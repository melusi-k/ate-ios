name: Bug report
description: Report a reproducible problem in Ate
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Ate. Please remove personal information from screenshots and logs. Never include passwords, session tokens, API keys, or private recipe/share links.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you were trying to do.
      placeholder: A short, specific description
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Ate version / build
      description: Find this in the app or TestFlight/build details if available.
      placeholder: "0.1.x (build …)"
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: "iPhone model, iOS version, or simulator/device"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area is affected?
      options:
        - Recipe creation or editing
        - Recipe library
        - Shopping list or cooking mode
        - Sharing or deep links
        - Sign-in, account, or sync
        - Widgets or Live Activities
        - Build, installation, or performance
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence of steps.
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Intermittent
        - Happened once
        - Unable to reproduce now
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or diagnostics (optional)
      description: Attach redacted evidence. Do not include secrets, authentication headers, or personal data.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked for an existing issue describing this problem.
          required: true
        - label: I removed secrets and personal information from attached evidence.
          required: true

# Product classification used by automatic GitHub labels.
  - type: dropdown
    id: feature_area
    attributes:
      label: Feature area
      description: Select the best current classification; do not infer acceptance or completion from the labels.
      options:
        - Recipe creation and quality
        - Library and discovery
        - Cooking, timers and widgets
        - Accessibility and navigation
        - Health and journal
        - Shopping List and Settings
        - Sharing, security and reliability
        - Future platform work
        - Product infrastructure and delivery
    validations:
      required: true
  - type: dropdown
    id: release_gate
    attributes:
      label: Release gate
      description: Select the best current classification; do not infer acceptance or completion from the labels.
      options:
        - Pilot
        - Public launch
        - No committed release gate
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Select the best current classification; do not infer acceptance or completion from the labels.
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
