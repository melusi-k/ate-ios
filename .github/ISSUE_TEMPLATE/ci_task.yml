name: CI or build pipeline
description: Track a CI workflow, build, signing, or automation task
title: "[CI]: "
labels: ["ci"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is failing or missing?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected pipeline behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Run links, logs, and reproduction details
      description: Redact secrets, tokens, and private data.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Definition of done
    validations:
      required: true

# Product classification used by automatic GitHub labels.
  - type: dropdown
    id: feature_area
    attributes:
      label: Feature area
      description: Select the best current classification; do not infer acceptance or completion from the labels.
      options:
        - Recipe creation and quality
        - Library and discovery
        - Cooking, timers and widgets
        - Accessibility and navigation
        - Health and journal
        - Shopping List and Settings
        - Sharing, security and reliability
        - Future platform work
        - Product infrastructure and delivery
    validations:
      required: true
  - type: dropdown
    id: release_gate
    attributes:
      label: Release gate
      description: Select the best current classification; do not infer acceptance or completion from the labels.
      options:
        - Pilot
        - Public launch
        - No committed release gate
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Select the best current classification; do not infer acceptance or completion from the labels.
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
