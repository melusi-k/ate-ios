name: Feature request
description: Suggest an improvement or new capability for Ate
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Focus on the user problem and the outcome that would help. Please do not include private recipe data or personal information.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Who is affected, and what is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Ate to do?
      description: Describe the behavior or outcome you have in mind.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Example use case
      description: A short real-world scenario helps us understand the value.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Related area
      options:
        - Recipe creation or editing
        - Recipe library
        - Shopping list or cooking mode
        - Sharing or deep links
        - Sign-in, account, or sync
        - Widgets or Live Activities
        - Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds tried (optional)
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked for an existing issue or planned item covering this idea.
          required: true
