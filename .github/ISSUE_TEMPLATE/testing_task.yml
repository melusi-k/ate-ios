name: Testing or regression coverage
description: Track a test gap, regression, or verification task
title: "[Testing]: "
labels: ["testing"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for missing coverage, flaky assertions, regression tests, and QA verification.
  - type: textarea
    id: gap
    attributes:
      label: What needs to be tested?
      description: Describe the user flow, behavior, or regression risk.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Existing evidence or reproduction steps
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Proposed test coverage
      description: Unit, integration, UI, device, or CI-level coverage.
    validations:
      required: true

# Product classification used by automatic GitHub labels.
  - type: dropdown
    id: feature_area
    attributes:
      label: Feature area
      description: Select the best current classification; do not infer acceptance or completion from the labels.
      options:
        - Recipe creation and quality
        - Library and discovery
        - Cooking, timers and widgets
        - Accessibility and navigation
        - Health and journal
        - Shopping List and Settings
        - Sharing, security and reliability
        - Future platform work
        - Product infrastructure and delivery
    validations:
      required: true
  - type: dropdown
    id: release_gate
    attributes:
      label: Release gate
      description: Select the best current classification; do not infer acceptance or completion from the labels.
      options:
        - Pilot
        - Public launch
        - No committed release gate
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Select the best current classification; do not infer acceptance or completion from the labels.
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
