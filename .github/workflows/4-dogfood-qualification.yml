            echo "::error::Tracker history recipe journeys failed (xcodebuild exit $status). Log and xcresult are uploaded."
            grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Terminating app|Testing failed|Assertion failed" tracker-ui.log || true
            tail -n 100 tracker-ui.log
            exit "$status"
          fi
          if grep -q "Executed 0 tests" tracker-ui.log; then echo "::error::tracker history recipe selection executed 0 tests"; exit 1; fi
          for evidence in \
            "AteUITests testTrackerDayRecipeOpensRecipeSheet]' passed" \
            "AteUITests testTrackerDayRecipeCanStartAndExitCookMode]' passed" \
            "AteUITests testTrackerDayRecipeCookModeKeepsRunningTimer]' passed" \
            "AteUITests testTrackerDayDeletedRecipeIsNotTappable]' passed" \
            "AteUITests testCookModeCompletionRecordsCookingDay]' passed" \
            "AteUITests testCookModeExitDoesNotRecordCookingDay]' passed" \
            "CookingTrackerEntryUITests testInsightsHasDedicatedTabEntryPoint]' passed" \
            "CookingTrackerEntryUITests testLibraryShortcutOpensInsightsHubRoot]' passed" \
            "CookingTrackerEntryUITests testMonthNavigationAndFutureMonthRestriction]' passed" \
            "CookingTrackerEntryUITests testSelectingTodayShowsDayDetailsAndExplicitEmptyState]' passed"; do
            grep -qF "$evidence" tracker-ui.log || { echo "::error::missing pass evidence: $evidence"; tail -60 tracker-ui.log; exit 1; }
          done
          grep -E "Test Case .* (passed|failed)|Executed" tracker-ui.log | tail -30

      - name: Export journey screenshots (folded group 7)
        if: always()
        run: |
          # Export whatever the runs produced, success or failure: partial captures are
          # failure diagnostics and the raw xcresults are always retained alongside.
          # Each result bundle exports into its OWN directory so a screenshot can only
          # satisfy a gate from the test group that was supposed to capture it.
          mkdir -p build/MenuUIAttachments/tracker-journal
          if [ -d build/TrackerUITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TrackerUITests.xcresult --output-path build/MenuUIAttachments/tracker-journal
          fi
          find build/MenuUIAttachments -type f | sort | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify journey screenshot evidence (folded group 7)
        if: always() && steps.tracker_journeys_g7.outcome == 'success'
        run: |
          # Hard gate: every named journey screenshot must resolve, INSIDE ITS OWN
          # SCOPE DIRECTORY, to a real decodable PNG with nonzero dimensions.
          # Resolution is manifest-first with EXACT logical-name matching only
          # (base == shot, or the observed "<shot>_0_<uuid>" export suffix) - never
          # substring, so "search-results-menu" can never be satisfied by
          # "search-results-menu-reset". Unknown manifest structure fails closed.
          set -euo pipefail
          ROOT=build/MenuUIAttachments
          fail() {
            echo "::error::$1"
            echo "--- exported files ---"
            find "$ROOT" -type f -exec ls -l {} + 2>/dev/null || true
            for M in "$ROOT"/*/manifest.json; do [ -f "$M" ] && { echo "--- $M ---"; head -c 4000 "$M"; echo; }; done
            exit 1
          }
          png_ok() {
            # Signature alone is not enough (a header-only fixture would pass it):
            # require sips to decode the image and report nonzero dimensions.
            [ -f "$1" ] && [ -s "$1" ] || return 1
            [ "$(od -An -tx1 -N8 "$1" | tr -d ' \n')" = "89504e470d0a1a0a" ] || return 1
            local w h
            w=$(sips -g pixelWidth "$1" 2>/dev/null | awk '/pixelWidth/ {print $2}')
            h=$(sips -g pixelHeight "$1" 2>/dev/null | awk '/pixelHeight/ {print $2}')
            [ "${w:-0}" -gt 0 ] 2>/dev/null && [ "${h:-0}" -gt 0 ] 2>/dev/null
          }
          resolve_shot() {
            # $1 = logical shot name, $2 = scope directory. Manifest-first, exact names only.
            local shot="$1" DIR="$2" MANIFEST="$2/manifest.json" f
            if [ -f "$MANIFEST" ]; then
              python3 - "$MANIFEST" "$shot" "$DIR" <<'PYMAP'
          import json, os, sys
          manifest, shot, outdir = sys.argv[1], sys.argv[2], sys.argv[3]
          real_out = os.path.realpath(outdir)
          def confined(fname):
              # The joined export path must stay inside the scope directory:
              # reject ../ escapes, absolute paths and symlink breakouts.
              try:
                  cand = os.path.realpath(os.path.join(outdir, fname))
              except Exception:
                  return None
              try:
                  if os.path.commonpath([cand, real_out]) != real_out:
                      return None
              except ValueError:
                  return None
              return cand if os.path.isfile(cand) else None
          try:
              top = json.load(open(manifest))
          except Exception:
              sys.exit(2)
          if not isinstance(top, list):
              sys.exit(2)
          # Observed manifest shape (run 41775045591): a list of payload groups, each with an
          # "attachments" list of {exportedFileName, suggestedHumanReadableName, ...}; suggested
          # names carry an "_0_<uuid>" suffix and extension. Accept a flat list too; anything
          # else fails closed.
          atts = []
          for e in top:
              if not isinstance(e, dict):
                  continue
              inner = e.get("attachments")
              atts.extend(inner) if isinstance(inner, list) else atts.append(e)
          for a in atts:
              if not isinstance(a, dict):
                  continue
              name = a.get("suggestedHumanReadableName") or a.get("humanReadableName") or ""
              fname = a.get("exportedFileName") or a.get("fileName") or a.get("attachedFileName") or ""
              base = name[:-4] if name.lower().endswith(".png") else name
              if base == shot or base.startswith(shot + "_0_"):
                  cand = confined(fname) if fname else None
                  if cand:
                      print(cand)
                      sys.exit(0)
                  sys.exit(1)
          sys.exit(1)
          PYMAP
              return $?
            fi
            # No manifest: exact-stem filename fallback only (never substring).
            for f in "$DIR/$shot.png" "$DIR/${shot}_0_"*.png; do
              [ -f "$f" ] && { echo "$f"; return 0; }
            done
            return 1
          }
          verify_scope() {
            local sub="$1"; shift
            [ -d "$ROOT/$sub" ] || fail "attachment export directory missing: $ROOT/$sub"
            local shot file rc
            for shot in "$@"; do
              set +e
              file=$(resolve_shot "$shot" "$ROOT/$sub")
              rc=$?
              set -e
              case $rc in
                0) ;;
                1) fail "missing screenshot evidence: $sub/$shot" ;;
                *) fail "unrecognised export manifest structure; cannot associate screenshot: $sub/$shot" ;;
              esac
              png_ok "$file" || fail "screenshot for $sub/$shot is not a decodable PNG with nonzero dimensions: $file"
              echo "verified $sub/$shot -> $file ($(stat -f%z "$file") bytes)"
            done
          }
          verify_scope tracker-journal \
            tracker-day-recipe-row \
            tracker-day-recipe-opened \
            tracker-day-recipe-cook-mode \
            tracker-day-recipe-timer-retained \
            tracker-day-deleted-recipe-fallback \
            tracker-month-view \
            tracker-day-details

      - name: Record qualification metadata (folded group 7)
        if: always()
        run: |
          {
            echo "event_name=$GITHUB_EVENT_NAME"
            echo "pr_head_sha=${{ github.event.pull_request.head.sha || '' }}"
            echo "executed_sha=$(git rev-parse HEAD)"
            echo "execution_target=actual-head"
            echo "pr_number=${{ github.event.pull_request.number || '' }}"
            echo "base_ref=${{ github.event.pull_request.base.ref || github.ref_name }}"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "simulator_id=${{ steps.select_simulator.outputs.id }}"
            echo "build_outcome=${{ steps.build.outcome }}"
            echo "tracker_journeys_g7_outcome=${{ steps.tracker_journeys_g7.outcome }}"
            echo "collected_at=$(date -u +%FT%TZ)"
          } | tee qualification-metadata-tracker.txt
          mkdir -p build/MenuUIAttachments

      # Folded group 8 (from retired issue-73-ui-qualification.yml): the UI journey step,
      # byte-carried (30m step timeout, 240/480 per-test allowances, failure evidence,
      # mandatory screenshot export, honest summary, error-if-missing 30-day upload).
      # No unit content; no strict-concurrency flag. Renames: step id ui_journeys ->
      # issue73_journeys_g8 (destination job already has ui_journeys); Commit line records
      # git rev-parse HEAD (folded job checks out the PR head). Map in README.
      - name: Issue 73 UI journeys (search-first, describe-save stack, first-use actions) (folded group 8)
        id: issue73_journeys_g8
        timeout-minutes: 30
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteUITests/AteUITests/testSearchTabStartsSearchFirstAndKeepsContext \
            -only-testing:AteUITests/AteUITests/testSearchDescribeSaveStaysOnSearchStack \
            -only-testing:AteUITests/AteUITests/testFirstLibraryRecipeActionsChooseTheCorrectInput \
            -resultBundlePath build/Issue73UIJourneys.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > issue-73-ui-journeys.log 2>&1 || { grep -n -B 8 -A 12 -E "error:|failed|XCTAssert|Testing failed|Fatal error" issue-73-ui-journeys.log || true; tail -100 issue-73-ui-journeys.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" issue-73-ui-journeys.log | tail -30

      - name: Export screenshots from result bundle (folded group 8)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/screenshots
          # xcrun wrapper is required (bare xcresulttool is not on PATH); failures are
          # mandatory-evidence failures, never masked.
          xcrun xcresulttool get --legacy --path build/Issue73UIJourneys.xcresult --format json > build/result.json
          # Export all attachments (screenshots captured during the journeys)
          xcrun xcresulttool export attachments --legacy --path build/Issue73UIJourneys.xcresult --output-path build/screenshots
          ls -la build/screenshots | tee -a "$GITHUB_STEP_SUMMARY"
          # Journey screenshots are mandatory review evidence: fail loudly if none exported.
          if [ -z "$(ls -A build/screenshots)" ]; then echo "screenshot export produced nothing"; exit 1; fi

      - name: Summarize journey qualification honestly (folded group 8)
        if: always()
        env:
          UI_OUTCOME: ${{ steps.issue73_journeys_g8.outcome }}
        run: |
          {
            echo '### Issue 73 UI journey qualification'
            echo
            echo "- Commit: \`$(git rev-parse HEAD)\`."
            printf '%s\n' "- Journeys: ${UI_OUTCOME:-unknown}."
            echo '- Journeys exercised: search-first start + context preservation; describe-save stays on Search stack; first-use actions route to correct input.'
            echo '- A green badge is NOT journey proof: review the retained screenshots in the artifact.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload journey diagnostics and screenshots (folded group 8)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-73-ui-qualification-${{ github.run_number }}
          path: |
            issue-73-ui-journeys.log
            build/Issue73UIJourneys.xcresult
            build/screenshots
          if-no-files-found: error
          retention-days: 30
      # Folded group 9 (from retired settings-ui-qualification.yml): the UI part of the
      # lane's combined step, byte-carried (240/480 per-test allowances, the Dynamic-Type
      # skip, failure evidence, mandatory screenshot export + named evidence gates,
      # exact-pass/scoped-capture validation, error-if-missing 90-day upload).
      # The lane's unit class AteTests/SettingsAIStatusTests moves to Compile's focused
      # step + full-unit-required.txt (unit ruling). Renames and the 3 adaptations are
      # listed in the README rename map; the validator script is parameterized so the two
      # destinations together require exactly the lane's original passes and captures.
      - name: Settings organisation UI + strict Settings AX audit + tools journey (folded group 9)
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          mkdir -p "$RUNNER_TEMP/ate-test-results"
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -derivedDataPath build/DerivedData \
            -only-testing:AteUITests/SettingsClarificationUITests \
            -only-testing:AteUITests/SettingsOrganizationUITests \
            -skip-testing:AteUITests/SettingsOrganizationUITests/testSyncSummaryLargestDynamicType \
            -only-testing:AteUITests/AccessibilityAuditUITests/testAuditMainScreens \
            -only-testing:AteUITests/SettingsAuditUITests \
            -only-testing:AteUITests/CoverageUITests/test32_MoreCollectionsToolsAbout \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/settings-ui-g9.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > settings-ui-g9.log 2>&1 || \
            { grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Testing failed" settings-ui-g9.log || true; tail -120 settings-ui-g9.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" settings-ui-g9.log | tail -40
      - name: Export rendered screenshots (folded group 9)
        if: always()
        run: |
          mkdir -p settings-ui-g9-screenshots/raw
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ate-test-results/settings-ui-g9.xcresult" --output-path settings-ui-g9-screenshots/raw
          python3 - <<'PY'
          import json, os, re, shutil
          raw = "settings-ui-g9-screenshots/raw"
          # upload-artifact rejects names containing " : < > | * ? CR LF (and a path separator would break the copy).
          # Only the readable COPIES are renamed; every raw attachment stays in settings-ui-g9-screenshots/raw under its exported
          # name, with manifest.json mapping it to its original suggested name.
          unsafe = re.compile(r'[\\"<>:|*?/\r\n]')
          def safe(s):
              return unsafe.sub("_", s)
          try:
              man = json.load(open(os.path.join(raw, "manifest.json")))
          except Exception:
              man = []
          for t in man:
              tn = t.get("testIdentifier", "t").split("/")[-1].replace("()", "")
              for a in t.get("attachments", []):
                  n = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  base = n.split("_0_")[0] if "_0_" in n else os.path.splitext(n)[0]
                  ext = os.path.splitext(a["exportedFileName"])[1] or ".png"
                  dest = f"settings-ui-g9-screenshots/{safe(tn)}__{safe(base)}{safe(ext)}"
                  k = 1
                  while os.path.exists(dest):
                      k += 1
                      dest = f"settings-ui-g9-screenshots/{safe(tn)}__{safe(base)}-{k}{safe(ext)}"
