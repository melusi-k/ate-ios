              png_ok "$file" || fail "screenshot for $sub/$shot is not a decodable PNG with nonzero dimensions: $file"
              echo "verified $sub/$shot -> $file ($(stat -f%z "$file") bytes)"
            done
          }
          verify_scope beta \
            beta-screen \
            beta-item-pass \
            beta-export-sheet \
            beta-reset-current-build-confirmation \
            beta-reset \
            beta-after-library-clear \
            beta-fresh-settings \
            beta-ci-no-published-evidence \
            beta-ci-not-loaded \
            beta-ci-refresh-unknown \
            beta-local-build-identity-notice
      - name: Record exact qualification metadata (folded group 10)
        if: always()
        run: |
          {
            echo "executed_sha=$(git rev-parse HEAD)"
            echo "execution_target=actual-head"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "simulator_id=${{ steps.select_simulator.outputs.id }}"
            echo "build_outcome=${{ steps.build.outcome }}"
            echo "beta_journeys_outcome=${{ steps.beta_journeys.outcome }}"
            echo "presentation_fixtures=not-loaded,simulated-refresh-error"
          } | tee qualification-metadata-beta.txt
      - name: Record qualification metadata
        if: always()
        run: |
          {
            echo "head_sha=$(git rev-parse HEAD)"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "simulator_id=${{ steps.select_simulator.outputs.id }}"
            echo "build_outcome=${{ steps.build.outcome }}"
            echo "ui_journeys_outcome=${{ steps.ui_journeys.outcome }}"
            echo "collected_at=$(date -u +%FT%TZ)"
          } | tee qualification-metadata.txt
          mkdir -p build/ShoppingEditUndoUIAttachments

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: folded-journeys-${{ github.run_number }}
          path: |
            qualification-metadata.txt
            qualification-metadata-shopping-completion.txt
            qualification-metadata-journal-menu.txt
            build-for-testing.log
            shopping-edit-undo-ui.log
            journal-menu-ui.log
            journal-root-ui.log
            build/ShoppingEditUndoUITests.xcresult
            build/ShoppingEditUndoUIAttachments
            build/JournalMenuUITests.xcresult
            qualification-metadata-menu.txt
            menu-shopping-ui.log
            menu-search-ui.log
            menu-journal-ui.log
            menu-nutrition-ui.log
            build/MenuShoppingUITests.xcresult
            build/MenuSearchUITests.xcresult
            build/MenuJournalUITests.xcresult
            build/MenuNutritionUITests.xcresult
            qualification-metadata-library.txt
            coverage-reroute.log
            journal-open-state.log
            insights-acceptance.log
            build/CoverageRerouteUITests.xcresult
            build/JournalOpenStateUITests.xcresult
            build/InsightsAcceptanceUITests.xcresult
            qualification-metadata-tracker.txt
            tracker-ui.log
            build/TrackerUITests.xcresult
            build/JournalRootMenuUITests.xcresult
            build/MenuUIAttachments
            qualification-metadata-beta.txt
            beta-status-ui.log
            build/BetaStatusUITests.xcresult
            build/BetaUIAttachments
          if-no-files-found: warn

  qualification-result:
    name: Dogfood qualification result
    if: always()
    needs: [changes, dogfood-qualification, folded-journeys]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report actual qualification route
        env:
          CLASSIFIER: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.app }}
          NATIVE_RESULT: ${{ needs.dogfood-qualification.result }}
          FOLDED_RESULT: ${{ needs.folded-journeys.result }}
        run: |
          if [[ "$CLASSIFIER" != success ]]; then
            echo 'Scope classifier failed; qualification is NOT established.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$NATIVE" == false ]]; then
            echo 'Documentation-only diff. Mac tests NOT RUN; this is NOT native qualification.' >> "$GITHUB_STEP_SUMMARY"
            [[ "$NATIVE_RESULT" == skipped && "$FOLDED_RESULT" == skipped ]]
          else
            echo "Native qualification required. Mac job result: $NATIVE_RESULT; folded journeys: $FOLDED_RESULT." >> "$GITHUB_STEP_SUMMARY"
            [[ "$NATIVE" == true && "$NATIVE_RESULT" == success && "$FOLDED_RESULT" == success ]]
          fi
