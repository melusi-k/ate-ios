name: AI model lane (Foundation Models)

# AI-ready real-model lane per docs/CI.md (architecture decision, 2026-11-01).
#
# Structure: ONE job, ONE simulator. The availability preflight, the real
# generation smoke and (as they land) the lane's real-model tests all execute
# on the same simulator in the same job - a readiness pass on one machine
# never qualifies another machine.
#
# Policy: require SystemLanguageModel .available, then prove real inference.
# Explicit failure on deviceNotEligible / Apple Intelligence disabled /
# model not ready / inference failure. No mock substitution, no skip-to-green.
# Failure strings carry AI-LANE ELIGIBILITY / READINESS / INFERENCE prefixes,
# surfaced as job annotations below.
#
# Trigger and merge-gate policy is the owner's pending decision (docs/CI.md);
# manual dispatch only until adopted. Eligible-runner provisioning requires
# owner approval. Current hosted xcode-27 config measured deviceNotEligible,
# so a manual run there fails eligibility explicitly - the intended honest
# result, not a defect.
permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ai-model-lane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-model-preflight:
    name: ai-model-preflight
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Cache Xcode DerivedData
        # Shared lineage with compile-check; lookup-only so this lane never
        # saves and cannot evict entries the standard lanes rely on.
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          lookup-only: true
          key: xcode-27-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-27-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            xcode-27-xcode-deriveddata-
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: xcode-27-homebrew-xcodegen-v1
          restore-keys: |
            xcode-27-homebrew-
      - run: brew install xcodegen && xcodegen generate
      - name: Build for testing (iOS simulator)
        run: |
          set -o pipefail
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          set +e
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Simulator build failed (xcodebuild exit $status). Matching diagnostics and recent log follow:"
            grep -n -B 8 -A 12 -E "error:|failed|Fatal error|Testing failed" build.log || true
            tail -n 100 build.log
            exit "$status"
          fi
          echo "build-for-testing succeeded on $SIM_ID"
      - name: Readiness preflight + real-inference smoke (this simulator only)
        run: |
          set -o pipefail
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          set +e
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteModelReadinessTests \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/ai-model-lane.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > ai-model-lane.log 2>&1
          status=$?
          set -e
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED|TEST FAILED" ai-model-lane.log | tail -20 || true
          if [ "$status" -ne 0 ]; then
            # Surface each structured verdict as its own annotation so the exact
            # availability/readiness/inference failure is visible without opening logs.
            grep -oE "AI-LANE (ELIGIBILITY|READINESS|INFERENCE): [^\"]+" ai-model-lane.log | sort -u | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -n -B 4 -A 10 -E "AI-LANE|error:|failed|Fatal error|Testing failed" ai-model-lane.log | head -80 || true
            exit "$status"
          fi
          echo "AI-LANE PASS: availability .available and real inference smoke succeeded on simulator $SIM_ID"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-model-lane-${{ github.run_id }}
          path: |
            ai-model-lane.log
            ${{ runner.temp }}/ate-test-results/ai-model-lane.xcresult
          if-no-files-found: warn
