name: Beta status qualification (#294)

# Additive exact-branch verification of the repaired beta screen.
# CI absence/error shots use explicitly labelled -UITesting presentation fixtures.
# They do not establish live network refresh, account-race or v1 upgrade proof.
on:
  push:
    branches: ["beta-status-provenance-repair"]
permissions:
  contents: read
concurrency:
  group: beta-status-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  beta-ui:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SCHEME: Ate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Install XcodeGen and generate exact source
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p build
          echo "Qualification commit: $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Select iPhone 18 Pro simulator (iOS 27.0)
        id: select_simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/available-simulators.json
          xcodebuild -project Ate.xcodeproj -scheme "$SCHEME" -showdestinations > /tmp/xcode-destinations.txt 2>&1 || {
            cat /tmp/xcode-destinations.txt
            exit 1
          }
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          if ! grep -Fq "id:$SIM_ID" /tmp/xcode-destinations.txt; then
            echo "ERROR: selected iPhone 18 Pro is not listed as an Ate scheme destination."
            cat /tmp/xcode-destinations.txt
            exit 1
          fi
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b

      - name: Build for testing (iOS simulator)
        id: build
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO > build-for-testing.log 2>&1 || { grep -n -B 8 -A 12 -E "error:" build-for-testing.log || true; tail -100 build-for-testing.log; exit 1; }
          grep -E "warning:" build-for-testing.log | sort -u | tail -30 || true

      - name: Beta screen and presentation-state journeys
        id: beta_journeys
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcrun simctl terminate "$SIM_ID" com.melusik.ate >/dev/null 2>&1 || true
          set +e
          xcodebuild test-without-building -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -derivedDataPath build/DerivedData \
            -only-testing:AteUITests/CoverageUITests/test35_BetaScreenManualExportReset \
            -only-testing:AteUITests/CoverageUITests/test35b_BetaOpensAfterLibraryClear \
            -only-testing:AteUITests/CoverageUITests/test35c_BetaOpensFromFreshSettingsScreen \
            -only-testing:AteUITests/CoverageUITests/test35d_BetaCINotLoadedAndUnknownAreNotNoEvidence \
            -only-testing:AteUITests/CoverageUITests/test35e_BetaLocalBuildExplainsUnverifiedVerdicts \
            -resultBundlePath build/BetaStatusUITests.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO > beta-status-ui.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Testing failed" beta-status-ui.log || true
            tail -100 beta-status-ui.log
            exit "$status"
          fi
          if grep -q "Executed 0 tests" beta-status-ui.log; then echo "::error::beta selection executed 0 tests"; exit 1; fi
          for evidence in \
            "CoverageUITests test35_BetaScreenManualExportReset]' passed" \
            "CoverageUITests test35b_BetaOpensAfterLibraryClear]' passed" \
            "CoverageUITests test35c_BetaOpensFromFreshSettingsScreen]' passed" \
            "CoverageUITests test35d_BetaCINotLoadedAndUnknownAreNotNoEvidence]' passed" \
            "CoverageUITests test35e_BetaLocalBuildExplainsUnverifiedVerdicts]' passed"; do
            grep -qF "$evidence" beta-status-ui.log || { echo "::error::missing pass evidence: $evidence"; exit 1; }
          done
          grep -E "Test Case .* (passed|failed)|Executed" beta-status-ui.log | tail -20
      - name: Export beta screenshots
        if: always()
        run: |
          mkdir -p build/BetaUIAttachments/beta
          if [ -d build/BetaStatusUITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/BetaStatusUITests.xcresult --output-path build/BetaUIAttachments/beta
          fi
      - name: Verify exact named beta screenshot evidence
        if: always() && steps.beta_journeys.outcome == 'success'
        run: |
          set -euo pipefail
          ROOT=build/BetaUIAttachments
          fail() {
            echo "::error::$1"
            echo "--- exported files ---"
            find "$ROOT" -type f -exec ls -l {} + 2>/dev/null || true
            for M in "$ROOT"/*/manifest.json; do [ -f "$M" ] && { echo "--- $M ---"; head -c 4000 "$M"; echo; }; done
            exit 1
          }
          png_ok() {
            # Signature alone is not enough (a header-only fixture would pass it):
            # require sips to decode the image and report nonzero dimensions.
            [ -f "$1" ] && [ -s "$1" ] || return 1
            [ "$(od -An -tx1 -N8 "$1" | tr -d ' \n')" = "89504e470d0a1a0a" ] || return 1
            local w h
            w=$(sips -g pixelWidth "$1" 2>/dev/null | awk '/pixelWidth/ {print $2}')
            h=$(sips -g pixelHeight "$1" 2>/dev/null | awk '/pixelHeight/ {print $2}')
            [ "${w:-0}" -gt 0 ] 2>/dev/null && [ "${h:-0}" -gt 0 ] 2>/dev/null
          }
          resolve_shot() {
            # $1 = logical shot name, $2 = scope directory. Manifest-first, exact names only.
            local shot="$1" DIR="$2" MANIFEST="$2/manifest.json" f
            if [ -f "$MANIFEST" ]; then
              python3 - "$MANIFEST" "$shot" "$DIR" <<'PYMAP'
          import json, os, sys
          manifest, shot, outdir = sys.argv[1], sys.argv[2], sys.argv[3]
          real_out = os.path.realpath(outdir)
          def confined(fname):
              # The joined export path must stay inside the scope directory:
              # reject ../ escapes, absolute paths and symlink breakouts.
              try:
                  cand = os.path.realpath(os.path.join(outdir, fname))
              except Exception:
                  return None
              try:
                  if os.path.commonpath([cand, real_out]) != real_out:
                      return None
              except ValueError:
                  return None
              return cand if os.path.isfile(cand) else None
          try:
              top = json.load(open(manifest))
          except Exception:
              sys.exit(2)
          if not isinstance(top, list):
              sys.exit(2)
          # Observed manifest shape (run 41775045591): a list of payload groups, each with an
          # "attachments" list of {exportedFileName, suggestedHumanReadableName, ...}; suggested
          # names carry an "_0_<uuid>" suffix and extension. Accept a flat list too; anything
          # else fails closed.
          atts = []
          for e in top:
              if not isinstance(e, dict):
                  continue
              inner = e.get("attachments")
              atts.extend(inner) if isinstance(inner, list) else atts.append(e)
          for a in atts:
              if not isinstance(a, dict):
                  continue
              name = a.get("suggestedHumanReadableName") or a.get("humanReadableName") or ""
              fname = a.get("exportedFileName") or a.get("fileName") or a.get("attachedFileName") or ""
              base = name[:-4] if name.lower().endswith(".png") else name
              if base == shot or base.startswith(shot + "_0_"):
                  cand = confined(fname) if fname else None
                  if cand:
                      print(cand)
                      sys.exit(0)
                  sys.exit(1)
          sys.exit(1)
          PYMAP
              return $?
            fi
            # No manifest: exact-stem filename fallback only (never substring).
            for f in "$DIR/$shot.png" "$DIR/${shot}_0_"*.png; do
              [ -f "$f" ] && { echo "$f"; return 0; }
            done
            return 1
          }
          verify_scope() {
            local sub="$1"; shift
            [ -d "$ROOT/$sub" ] || fail "attachment export directory missing: $ROOT/$sub"
            local shot file rc
            for shot in "$@"; do
              set +e
              file=$(resolve_shot "$shot" "$ROOT/$sub")
              rc=$?
              set -e
              case $rc in
                0) ;;
                1) fail "missing screenshot evidence: $sub/$shot" ;;
                *) fail "unrecognised export manifest structure; cannot associate screenshot: $sub/$shot" ;;
              esac
              png_ok "$file" || fail "screenshot for $sub/$shot is not a decodable PNG with nonzero dimensions: $file"
              echo "verified $sub/$shot -> $file ($(stat -f%z "$file") bytes)"
            done
          }
          verify_scope beta \
            beta-screen \
            beta-item-pass \
            beta-export-sheet \
            beta-reset-current-build-confirmation \
            beta-reset \
            beta-after-library-clear \
            beta-fresh-settings \
            beta-ci-no-published-evidence \
            beta-ci-not-loaded \
            beta-ci-refresh-unknown \
            beta-local-build-identity-notice
      - name: Record exact qualification metadata
        if: always()
        run: |
          {
            echo "head_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "simulator_id=${{ steps.select_simulator.outputs.id }}"
            echo "build_outcome=${{ steps.build.outcome }}"
            echo "beta_journeys_outcome=${{ steps.beta_journeys.outcome }}"
            echo "presentation_fixtures=not-loaded,simulated-refresh-error"
          } | tee qualification-metadata.txt
      - name: Upload beta qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beta-status-qualification-${{ github.run_number }}
          path: |
            qualification-metadata.txt
            build-for-testing.log
            beta-status-ui.log
            build/BetaStatusUITests.xcresult
            build/BetaUIAttachments
          if-no-files-found: warn
