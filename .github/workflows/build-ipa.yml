name: Build IPA

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SCHEME: Ate
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' && secrets.P12_PASSWORD != '' && secrets.TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate && xcodebuild -version

      - name: Run unit tests
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "Simulator: $SIM_ID"
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteTests CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || (grep -E "error:|failed|XCTAssert" test.log | head -100; tail -150 test.log; exit 1)
          grep -E "Executed|TEST SUCCEEDED" test.log | tail -3

      - name: Run UI tests (iPhone 17, iOS 26)
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(k,x) for k,v in d.items() if "iOS-26" in k for x in v if x["name"]=="iPhone 17"]
          c=c or [(k,x) for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"]); print(c[-1][0], c[-1][1]["name"], file=sys.stderr)')
          echo "UI test simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteUITests -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO > uitest.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E "Test Case .*(passed|failed)|error:|Executed" uitest.log | tail -60
          mkdir -p ui-screenshots/raw
          xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path ui-screenshots/raw || true
          python3 - <<'PY'
          import json, os, shutil
          raw = "ui-screenshots/raw"; out = "ui-screenshots"
          try: man = json.load(open(os.path.join(raw, "manifest.json")))
          except Exception as e: print("no manifest", e); man = []
          for test in man:
              tname = test.get("testIdentifier", "test").split("/")[-1].replace("()", "")
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  src = os.path.join(raw, a["exportedFileName"])
                  ext = os.path.splitext(a["exportedFileName"])[1] or ".png"
                  base = name.split("_0_")[0] if "_0_" in name else os.path.splitext(name)[0]
                  shutil.copy(src, os.path.join(out, f"{tname}__{base}{ext}"))
          print("\n".join(sorted(f for f in os.listdir(out) if f != "raw")))
          PY
          if [ $STATUS -ne 0 ]; then tail -120 uitest.log; fi
          exit $STATUS

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            ui-screenshots/*.png
            ui-screenshots/*.jpg
            ui-screenshots/*.jpeg
          if-no-files-found: warn

      - name: Upload UI test xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UITests-xcresult
          path: build/UITests.xcresult
          if-no-files-found: warn

      - name: Install signing certificate & profile
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KC_PASS=$(uuidgen)
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security cms -D -i $RUNNER_TEMP/profile.mobileprovision > $RUNNER_TEMP/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' $RUNNER_TEMP/profile.plist)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' $RUNNER_TEMP/profile.plist)
          APPID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' $RUNNER_TEMP/profile.plist)
          BUNDLE_ID=${APPID#*.}
          if /usr/libexec/PlistBuddy -c 'Print ProvisionsAllDevices' $RUNNER_TEMP/profile.plist >/dev/null 2>&1; then METHOD=enterprise
          elif /usr/libexec/PlistBuddy -c 'Print Entitlements:get-task-allow' $RUNNER_TEMP/profile.plist | grep -q true; then METHOD=development
          else METHOD=ad-hoc; fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          { echo "PROFILE_NAME=$NAME"; echo "BUNDLE_ID=$BUNDLE_ID"; echo "EXPORT_METHOD=$METHOD"; } >> $GITHUB_ENV

      - name: Build signed IPA
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          IDENTITY="Apple Development"; [ "$EXPORT_METHOD" != development ] && IDENTITY="Apple Distribution"
          xcodebuild archive -project Ate.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Ate.xcarchive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" -quiet
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Ate.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/export
          mkdir -p dist && cp build/export/*.ipa dist/Ate.ipa
          echo "IPA_KIND=signed ($EXPORT_METHOD)" >> $GITHUB_ENV

      - name: Build unsigned IPA
        if: env.HAS_SIGNING != 'true'
        run: |
          xcodebuild archive -project Ate.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Ate.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
          mkdir -p build/Payload dist
          cp -R build/Ate.xcarchive/Products/Applications/Ate.app build/Payload/
          test -d build/Payload/Ate.app/PlugIns/AteWidgets.appex || { echo "Widget extension missing from app bundle"; exit 1; }
          ls build/Payload/Ate.app/PlugIns
          (cd build && zip -qry ../dist/Ate.ipa Payload)
          echo "IPA_KIND=unsigned (sideload with Sideloadly/AltStore)" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ate-ipa-${{ github.sha }}
          path: dist/Ate.ipa
          if-no-files-found: error

      - name: Update rolling 'latest-build' prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build dist/Ate.ipa --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA}. ${IPA_KIND}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
