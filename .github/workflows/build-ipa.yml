name: Build IPA

on:
  push:
    # IPA builds are release artifacts: build only from main. PRs and feature branches use Compile check.
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run unit + QA + UI tests"
        type: boolean
        default: false
      channel:
        description: "Release channel: Production (default) or TierA/TierB/TierC for tester builds."
        type: string
        default: "Production"

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  # Queue instead of cancelling: every pushed batch gets its own build-N release.
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      SCHEME: Ate
      ATE_SIGN_STYLE: Automatic
      BUILD_NUMBER: ${{ github.run_number }}
      ATE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'TierA' }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' && secrets.P12_PASSWORD != '' && secrets.TEAM_ID != '' }}
      # Everyday main pushes build and smoke-check the release artifact only. Full validation is explicitly opt-in.
      RUN_TESTS: ${{ inputs.run_tests == true || contains(github.event.head_commit.message, '[run tests]') }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docs ID drift + client secret scan (A-CI-05)
        run: python3 scripts/check-ids.py

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: macos-26-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            macos-26-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            macos-26-xcode-deriveddata-
      - name: Probe Foundation Models image input (report only)
        continue-on-error: true
        run: |
          ls /Applications | grep -i '^Xcode' || true
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          IF=$(find "$SDK/System/Library/Frameworks/FoundationModels.framework" -name '*.swiftinterface' 2>/dev/null | head -1)
          { echo "### Foundation Models image-input probe"; echo "SDK: $(xcrun --sdk iphoneos --show-sdk-version)";
            if [ -n "$IF" ]; then echo '```'; grep -nE 'CGImage|UIImage|ImageAttachment|Transcript\.Image|image:' "$IF" | head -20 || echo "no image symbols"; echo '```'; else echo "FoundationModels interface not found"; fi; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-26-homebrew-xcodegen-v1
          restore-keys: |
            macos-26-homebrew-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          BASE=$(grep -E '^\s*MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          # Marketing version = <major>.<minor>.<run_number> so every build is distinct in iPhone Storage.
          VERSION="$(echo "$BASE" | cut -d. -f1-2).$BUILD_NUMBER"
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i '' -E "s/^( *MARKETING_VERSION: ).*/\1\"$VERSION\"/; s/^( *CURRENT_PROJECT_VERSION: ).*/\1\"$BUILD_NUMBER\"/; s/^( *ATE_GIT_SHA: ).*/\1\"$SHORT_SHA\"/; s/^( *ATE_CHANNEL: ).*/\1\"$ATE_CHANNEL\"/" project.yml
          grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION|ATE_GIT_SHA|ATE_CHANNEL' project.yml
          echo "GIT_SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          xcodegen generate && xcodebuild -version
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          SUFFIX=""; [ -n "$ATE_CHANNEL" ] && SUFFIX="-$ATE_CHANNEL"
          echo "CH_SUFFIX=$SUFFIX" >> $GITHUB_ENV
          echo "IPA_NAME=Ate-$VERSION-build$BUILD_NUMBER$SUFFIX.ipa" >> $GITHUB_ENV
          echo "Version $VERSION build $BUILD_NUMBER"

      - name: Ensure watchOS platform
        run: |
          xcodebuild -showsdks | grep -qi watchos || xcodebuild -downloadPlatform watchOS
          xcodebuild -showsdks | grep -i watch || true

      - name: Build watch app (watchOS simulator)
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild build -project Ate.xcodeproj -scheme AteWatch -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | tail -40

      - name: Run unit tests
        id: unit_tests
        # Preserve diagnostics by running the remaining focused gates; the final gate still fails validation.
        continue-on-error: true
        if: env.RUN_TESTS == 'true'
        timeout-minutes: 20
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "Simulator: $SIM_ID"
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteTests CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || (grep -v -i coredata test.log | grep -E "\.swift:[0-9]+: error|Test Case .* failed|XCTAssert|Fatal error|crashed" | head -100 || true; grep -v -i coredata test.log | tail -80 || true; exit 1)
          grep -E "Executed|TEST SUCCEEDED" test.log | tail -3

      - name: Focused recipe-generation regressions (#89)
        id: recipe_regressions
        # Retain later diagnostics; the final gate checks this step's outcome.
        continue-on-error: true
        if: env.RUN_TESTS == 'true'
        timeout-minutes: 15
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteTests/SyncFixtureTests/testInterruptedPhotoGenerationRestoresImageInput \
            -only-testing:AteTests/SyncFixtureTests/testLegacyPendingDraftWithoutPhotoStillDecodes \
            -only-testing:AteTests/PhotoRegressionTests/testAmbiguousPhotoPromptSupportsDrinksWithoutInventingSpirits \
            -resultBundlePath build/RecipeGenerationRegressions.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES CODE_SIGNING_ALLOWED=NO > recipe-generation-regressions.log 2>&1 || { grep -n -B 8 -A 12 -E "error:|failed|XCTAssert|Testing failed|Fatal error" recipe-generation-regressions.log || true; tail -100 recipe-generation-regressions.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" recipe-generation-regressions.log | tail -40

      - name: QA gate — key flows (KeyFlowsQATests)
        id: qa
        # Deferred UI backlog is report-only; preserve logs/screenshots but keep packaging moving.
        continue-on-error: true
        if: env.RUN_TESTS == 'true'
        timeout-minutes: 30
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(k,x) for k,v in d.items() if "iOS-26" in k for x in v if x["name"]=="iPhone 17"]
          c=c or [(k,x) for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"])')
          echo "SIM_ID=$SIM_ID"; xcrun simctl boot "$SIM_ID" || true; xcrun simctl bootstatus "$SIM_ID" -b
          set +e
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteUITests/KeyFlowsQATests -resultBundlePath build/QA.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee qa.log | grep --line-buffered -E "Test Case|Test Suite|error:|Testing (started|failed)|Restarting after"
          STATUS=${PIPESTATUS[0]}
          set -e
          python3 scripts/qa-summary.py qa.log > build/qa.md || true
          cat build/qa.md
          cat build/qa.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p ui-screenshots/qa-raw
          xcrun xcresulttool export attachments --path build/QA.xcresult --output-path ui-screenshots/qa-raw || true
          python3 - <<'PY'
          import json, os, shutil
          raw = "ui-screenshots/qa-raw"
          try: man = json.load(open(os.path.join(raw, "manifest.json")))
          except Exception: man = []
          for t in man:
              tn = t.get("testIdentifier", "t").split("/")[-1].replace("()", "")
              for a in t.get("attachments", []):
                  n = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  base = n.split("_0_")[0] if "_0_" in n else os.path.splitext(n)[0]
                  shutil.copy(os.path.join(raw, a["exportedFileName"]), f"ui-screenshots/{tn}__{base}{os.path.splitext(a['exportedFileName'])[1] or '.png'}")
          PY
          if [ $STATUS -ne 0 ]; then grep -vi coredata qa.log | grep -E "error:|failed" | head -40; fi
          exit $STATUS

      # Tracker is part of release confidence, not just the opt-in full UI suite.
      # Focused Tracker/Cook Mode regressions run only when full validation is explicitly requested.
      - name: Release gate — Cooking Tracker and Cook Mode history
        id: tracker_gate
        # Continue for diagnostics; required outcome is enforced at the end of full validation.
        continue-on-error: true
        if: env.RUN_TESTS == 'true'
        timeout-minutes: 25
        run: |
          set +e
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(k,x) for k,v in d.items() if "iOS-26" in k for x in v if x["name"]=="iPhone 17"]
          c=c or [(k,x) for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"])')
          echo "Tracker release gate simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteUITests/CookingTrackerEntryUITests \
            -only-testing:AteUITests/AteUITests/test06_CookMode \
            -only-testing:AteUITests/AteUITests/testCookModeExitDoesNotRecordCookingDay \
            -only-testing:AteUITests/AteUITests/testCookModeCompletionRecordsCookingDay \
            -resultBundlePath build/TrackerReleaseGate.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO > tracker-release-gate.log 2>&1
          STATUS=$?
          set -e
          grep -E "Test Case|Test Suite|error:|XCTAssert|failed|TEST SUCCEEDED|TEST FAILED" tracker-release-gate.log | tail -100 || true
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Cooking Tracker/Cook Mode release gate failed (xcodebuild exit $STATUS); complete log and xcresult are uploaded."
            tail -120 tracker-release-gate.log || true
          fi
          exit "$STATUS"

      - name: Focused shared-navigation header regressions (#68)
        id: header_regressions
        # Continue for diagnostics; required outcome is enforced at the end of full validation.
        continue-on-error: true
        if: env.RUN_TESTS == 'true'
        timeout-minutes: 20
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteUITests/CoverageUITests/testNavigationHeadersRemainStableOnShoppingAndSettings \
            -only-testing:AteUITests/CoverageUITests/testCookingTrackerMonthNavigationAndSelectedDay \
            -resultBundlePath build/NavigationHeaderRegressions.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES CODE_SIGNING_ALLOWED=NO > navigation-header-regressions.log 2>&1 || { grep -n -B 8 -A 12 -E "error:|failed|XCTAssert|Testing failed|Fatal error" navigation-header-regressions.log || true; tail -100 navigation-header-regressions.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" navigation-header-regressions.log | tail -40

      - name: Upload Tracker release-gate diagnostics
        if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tracker-release-gate-diagnostics
          path: |
            tracker-release-gate.log
            recipe-generation-regressions.log
            build/RecipeGenerationRegressions.xcresult
            navigation-header-regressions.log
            build/NavigationHeaderRegressions.xcresult
            build/TrackerReleaseGate.xcresult
          if-no-files-found: warn

      - name: Upload QA screenshots
        if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: ui-screenshots/*.png
          if-no-files-found: warn

      - name: Install signing certificate & profiles
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          # One provisioning profile per signed bundle. App is required; extensions are needed once those targets exist.
          PROFILE_APP: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          PROFILE_WIDGETS: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
          PROFILE_SHARE: ${{ secrets.SHARE_PROVISION_PROFILE_BASE64 }}
          PROFILE_WATCH: ${{ secrets.WATCH_PROVISION_PROFILE_BASE64 }}
          PROFILE_WATCHWIDGETS: ${{ secrets.WATCH_WIDGET_PROVISION_PROFILE_BASE64 }}
          PROFILE_CLIP: ${{ secrets.CLIP_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KC_PASS=$(uuidgen)
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          MAP=""
          for KIND in APP WIDGETS SHARE WATCH WATCHWIDGETS CLIP; do
            VAR=PROFILE_$KIND; DATA=${!VAR}
            [ -z "$DATA" ] && { echo "No $KIND profile secret"; continue; }
            F=$RUNNER_TEMP/$KIND.mobileprovision; echo -n "$DATA" | base64 --decode > $F
            security cms -D -i $F > $F.plist
            UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' $F.plist); NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' $F.plist)
            APPID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' $F.plist); BID=${APPID#*.}
            cp $F ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
            echo "ATE_PROFILE_$KIND=$NAME" >> $GITHUB_ENV
            MAP="$MAP<key>$BID</key><string>$NAME</string>"
            echo "$KIND → $BID ($NAME)"
            if [ $KIND = APP ]; then
              if /usr/libexec/PlistBuddy -c 'Print ProvisionsAllDevices' $F.plist >/dev/null 2>&1; then METHOD=enterprise
              elif /usr/libexec/PlistBuddy -c 'Print Entitlements:get-task-allow' $F.plist | grep -q true; then METHOD=development
              else METHOD=ad-hoc; fi
              echo "EXPORT_METHOD=$METHOD" >> $GITHUB_ENV
            fi
          done
          echo "PROFILE_MAP=$MAP" >> $GITHUB_ENV
          [ -n "$ATE_PROFILE_APP" ] || grep -q ATE_PROFILE_APP $GITHUB_ENV || { echo "::error::BUILD_PROVISION_PROFILE_BASE64 is required"; exit 1; }
          if [ -n "$ATE_PROFILE_CLIP" ]; then
            echo "HAS_CLIP_PROFILE=true" >> $GITHUB_ENV
          else
            echo "HAS_CLIP_PROFILE=false" >> $GITHUB_ENV
            echo "::warning::CLIP_PROVISION_PROFILE_BASE64 is not configured; signed release will preserve the current app without embedding the App Clip. Configure the Clip-specific provisioning profile to enable distribution embedding."
            python3 - <<'PY'
          from pathlib import Path
          p = Path('project.yml')
          s = p.read_text()
          dependency = '      # Embed the isolated shared-recipe App Clip at Ate.app/AppClips when the distribution build has its Clip profile.\n      - target: AteClip\n'
          if dependency not in s:
              raise SystemExit('Expected optional App Clip dependency was not found; refusing to alter the release project spec')
          p.write_text(s.replace(dependency, '', 1))
          PY
            {
              echo '### App Clip distribution status'
              echo
              echo 'The Clip target passed its independent CI build, but this signed IPA does **not** embed it because `CLIP_PROVISION_PROFILE_BASE64` is not configured. Existing release packaging continues without changing the main app distribution.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build signed IPA
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Regenerate so each target gets its own profile (project.yml reads ATE_PROFILE_* / ATE_SIGN_STYLE).
          export ATE_SIGN_STYLE=Manual
          xcodegen generate
          IDENTITY="Apple Development"; [ "$EXPORT_METHOD" != development ] && IDENTITY="Apple Distribution"
          xcodebuild archive -project Ate.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Ate.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$APP_VERSION" ATE_GIT_SHA="$GIT_SHORT_SHA" ATE_CHANNEL="$ATE_CHANNEL" ATE_ENTITLEMENTS=Ate/Ate-Signed.entitlements \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="$IDENTITY" -quiet
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>${PROFILE_MAP}</dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Ate.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/export
          mkdir -p dist && cp build/export/*.ipa dist/$IPA_NAME
          echo "IPA_KIND=signed ($EXPORT_METHOD)" >> $GITHUB_ENV

      - name: Build unsigned IPA
        if: env.HAS_SIGNING != 'true'
        run: |
          xcodebuild archive -project Ate.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Ate.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$APP_VERSION" ATE_GIT_SHA="$GIT_SHORT_SHA" ATE_CHANNEL="$ATE_CHANNEL" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
          mkdir -p build/Payload dist
          cp -R build/Ate.xcarchive/Products/Applications/Ate.app build/Payload/
          test -d build/Payload/Ate.app/PlugIns/AteWidgets.appex || { echo "Widget extension missing from app bundle"; exit 1; }
          test -e build/Payload/Ate.app/Metadata.appintents || { echo "::error::Metadata.appintents missing from main app (Siri phrases won't register)"; exit 1; }
          ls build/Payload/Ate.app/Metadata.appintents
          ls build/Payload/Ate.app/PlugIns
          test -d build/Payload/Ate.app/Watch/AteWatch.app || { echo "::error::Watch app missing from app bundle"; exit 1; }
          ls build/Payload/Ate.app/Watch build/Payload/Ate.app/Watch/AteWatch.app/PlugIns || true
          codesign -f -s - --entitlements AteWatchWidgets/AteWatchWidgets.entitlements build/Payload/Ate.app/Watch/AteWatch.app/PlugIns/AteWatchWidgets.appex || true
          codesign -f -s - --entitlements AteWatch/AteWatch.entitlements build/Payload/Ate.app/Watch/AteWatch.app
          codesign -f -s - --entitlements AteShare/AteShare.entitlements build/Payload/Ate.app/PlugIns/AteShare.appex || true
          # Ad-hoc sign with entitlements embedded so Sideloadly/AltStore can carry them over when re-signing.
          codesign -f -s - --entitlements AteWidgets/AteWidgets.entitlements build/Payload/Ate.app/PlugIns/AteWidgets.appex
          codesign -f -s - --entitlements Ate/Ate.entitlements build/Payload/Ate.app
          codesign -d --entitlements - build/Payload/Ate.app 2>/dev/null | grep -q application-groups && echo "entitlements embedded"
          /usr/libexec/PlistBuddy -c 'Print CFBundleVersion' build/Payload/Ate.app/Info.plist
          (cd build && zip -qry ../dist/$IPA_NAME Payload)
          echo "IPA_KIND=unsigned (sideload with Sideloadly/AltStore)" >> $GITHUB_ENV

      - name: Verify version inside the .ipa
        run: |
          rm -rf build/verify && mkdir -p build/verify && unzip -q "dist/$IPA_NAME" -d build/verify
          PL=build/verify/Payload/Ate.app/Info.plist
          BV=$(plutil -extract CFBundleVersion raw -o - "$PL")
          SV=$(plutil -extract CFBundleShortVersionString raw -o - "$PL")
          SHA=$(plutil -extract AteGitSHA raw -o - "$PL")
          WBV=$(plutil -extract CFBundleVersion raw -o - build/verify/Payload/Ate.app/PlugIns/AteWidgets.appex/Info.plist)
          {
            echo "### Ate $SV (build $BV)"
            echo "| Key | Value |"; echo "|---|---|"
            echo "| CFBundleShortVersionString | \`$SV\` |"
            echo "| CFBundleVersion (app) | \`$BV\` |"
            echo "| CFBundleVersion (widget) | \`$WBV\` |"
            echo "| AteGitSHA | \`$SHA\` |"
            echo "| Run number | \`$BUILD_NUMBER\` |"
            echo "| IPA | \`$IPA_NAME\` ($IPA_KIND) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "short=$SV build=$BV widget=$WBV sha=$SHA"
          [ "$BV" = "$BUILD_NUMBER" ] || { echo "::error::CFBundleVersion $BV != run number $BUILD_NUMBER"; exit 1; }
          [ "$WBV" = "$BUILD_NUMBER" ] || { echo "::error::Widget CFBundleVersion $WBV != run number $BUILD_NUMBER"; exit 1; }
          [ "$SV" = "$APP_VERSION" ] || { echo "::error::CFBundleShortVersionString $SV != $APP_VERSION"; exit 1; }
          [ "$SHA" = "$GIT_SHORT_SHA" ] || { echo "::error::AteGitSHA $SHA != $GIT_SHORT_SHA"; exit 1; }
          CLIP_APP=build/verify/Payload/Ate.app/AppClips/AteClip.app
          if [ -d "$CLIP_APP" ]; then
            CLIP_ID=$(plutil -extract CFBundleIdentifier raw -o - "$CLIP_APP/Info.plist")
            CLIP_BUILD=$(plutil -extract CFBundleVersion raw -o - "$CLIP_APP/Info.plist")
            [ "$CLIP_ID" = "com.melusik.ate.Clip" ] || { echo "::error::Unexpected embedded App Clip bundle ID: $CLIP_ID"; exit 1; }
            [ "$CLIP_BUILD" = "$BUILD_NUMBER" ] || { echo "::error::App Clip build $CLIP_BUILD != $BUILD_NUMBER"; exit 1; }
            plutil -lint "$CLIP_APP/Info.plist"
            echo "App Clip embedded: $CLIP_ID build $CLIP_BUILD" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_SIGNING" = "true" ] && [ "$HAS_CLIP_PROFILE" != "true" ]; then
            echo "::warning::App Clip is not embedded in this signed IPA; the Clip-specific provisioning profile is not configured."
          else
            echo "::error::Expected App Clip at $CLIP_APP but it is missing from the distribution IPA."
            exit 1
          fi

      - name: Release smoke test (A-CI-03) — plist + codesign checks on the .ipa
        id: ipacheck
        run: |
          set -e
          A=build/verify/Payload/Ate.app
          plutil -lint "$A/Info.plist" $A/PlugIns/*.appex/Info.plist
          for K in CFBundleIdentifier CFBundleExecutable CFBundleShortVersionString CFBundleVersion MinimumOSVersion NSSupportsLiveActivities; do
            plutil -extract $K raw -o - "$A/Info.plist" >/dev/null || { echo "::error::Info.plist missing $K"; exit 1; }
          done
          [ "$(plutil -extract CFBundleIdentifier raw -o - "$A/Info.plist")" = com.melusik.ate ] || { echo "::error::wrong bundle id"; exit 1; }
          EXE=$(plutil -extract CFBundleExecutable raw -o - "$A/Info.plist"); [ -x "$A/$EXE" ] || { echo "::error::executable missing"; exit 1; }
          lipo -archs "$A/$EXE" | grep -q arm64 || { echo "::error::no arm64 slice"; exit 1; }
          codesign --verify --strict "$A" || { echo "::error::codesign verify failed for Ate.app"; exit 1; }
          codesign -d --entitlements - "$A" 2>/dev/null | grep -q application-groups || { echo "::error::app entitlements missing"; exit 1; }
          codesign -d --entitlements - "$A" 2>/dev/null | grep -q com.apple.developer.healthkit || { echo "::error::HealthKit entitlement missing from IPA (A-HEALTH-01)"; exit 1; }
          for B in $A/PlugIns/*.appex; do
            if codesign --verify --strict "$B" 2>/dev/null; then echo "codesign ok: $B"
            elif [ "$HAS_SIGNING" = true ]; then echo "::error::codesign verify failed for $B"; exit 1
            else echo "::warning::$B not signed (unsigned sideload build)"; fi
          done
          for X in $A/PlugIns/*.appex; do
            XB=$(plutil -extract CFBundleVersion raw -o - "$X/Info.plist"); [ "$XB" = "$BUILD_NUMBER" ] || { echo "::error::$X CFBundleVersion $XB"; exit 1; }
          done
          echo "plist + codesign checks passed" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Release smoke test (A-CI-03) — simulator build, install, launch, alive after 10 s
        id: simsmoke
        timeout-minutes: 20
        run: |
          set -o pipefail
          profile() {
            local label="$1"; shift
            local start end status
            start=$(date +%s)
            "$@"
            status=$?
            end=$(date +%s)
            echo "::notice::PROFILE step=\"$label\" duration_seconds=$((end-start)) exit_code=$status"
            return "$status"
          }
          profile_sim_start=$(date +%s)
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(k,x) for k,v in d.items() if "iOS-26" in k for x in v if x["name"]=="iPhone 17"]
          c=c or [(k,x) for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"])')
          profile_sim_end=$(date +%s); echo "::notice::PROFILE step=select_simulator duration_seconds=$((profile_sim_end-profile_sim_start))"
          profile_sim_boot_start=$(date +%s)
          xcrun simctl boot "$SIM_ID" || true
          profile_sim_boot_end=$(date +%s); echo "::notice::PROFILE step=simulator_boot duration_seconds=$((profile_sim_boot_end-profile_sim_boot_start))"
          profile_build_start=$(date +%s)
          xcodebuild build -project Ate.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination "id=$SIM_ID" -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | tail -20
          profile_build_status=$?
          profile_build_end=$(date +%s); echo "::notice::PROFILE step=simulator_build duration_seconds=$((profile_build_end-profile_build_start)) exit_code=$profile_build_status"
          [ "$profile_build_status" -eq 0 ] || exit "$profile_build_status"
          APP=$(ls -d build/sim/Build/Products/Release-iphonesimulator/Ate.app)
          [ "$(plutil -extract CFBundleVersion raw -o - "$APP/Info.plist")" = "$BUILD_NUMBER" ] || { echo "::error::sim build number mismatch"; exit 1; }
          profile_bootstatus_start=$(date +%s)
          xcrun simctl bootstatus "$SIM_ID" -b
          profile_bootstatus_end=$(date +%s); echo "::notice::PROFILE step=simulator_bootstatus duration_seconds=$((profile_bootstatus_end-profile_bootstatus_start))"
          profile_install_start=$(date +%s)
          xcrun simctl install "$SIM_ID" "$APP"
          profile_install_end=$(date +%s); echo "::notice::PROFILE step=simulator_install duration_seconds=$((profile_install_end-profile_install_start))"
          profile_launch_start=$(date +%s)
          OUT=$(xcrun simctl launch "$SIM_ID" com.melusik.ate); echo "$OUT"
          profile_launch_status=$?
          profile_launch_end=$(date +%s); echo "::notice::PROFILE step=simulator_launch duration_seconds=$((profile_launch_end-profile_launch_start)) exit_code=$profile_launch_status"
          [ "$profile_launch_status" -eq 0 ] || exit "$profile_launch_status"
          PID=$(echo "$OUT" | awk -F': ' '{print $NF}')
          profile_wait_start=$(date +%s)
          sleep 10
          mkdir -p smoke
          xcrun simctl io "$SIM_ID" screenshot smoke/launch-10s.png
          profile_wait_end=$(date +%s); echo "::notice::PROFILE step=alive_wait_and_screenshot duration_seconds=$((profile_wait_end-profile_wait_start))"
          if kill -0 "$PID" 2>/dev/null; then
            echo "SMOKE_STATUS=pass" >> $GITHUB_ENV; echo "✅ Ate alive 10 s after launch (pid $PID)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "SMOKE_STATUS=fail" >> $GITHUB_ENV; echo "::error::Ate exited within 10 s of launch"
            xcrun simctl spawn "$SIM_ID" log show --last 1m --predicate 'process == "Ate"' | tail -60 || true
            exit 1
          fi

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-launch-screenshot
          path: smoke/*.png
          if-no-files-found: warn

      - name: Report A-CI-03 to qa_results
        if: always() && env.SUPABASE_ACCESS_TOKEN != ''
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          ST=pass; NOTE="ipa plist+codesign OK; simulator install+launch alive after 10 s"
          [ "${{ steps.ipacheck.outcome }}" = success ] || { ST=fail; NOTE="ipa plist/codesign check failed"; }
          [ "${{ steps.simsmoke.outcome }}" = success ] || { ST=fail; NOTE="$NOTE; simulator smoke ${{ steps.simsmoke.outcome }}"; }
          python3 -c "import json,sys; json.dump({'A-CI-03': {'status': sys.argv[1], 'note': sys.argv[2]}}, open('ci03.json','w'))" "$ST" "$NOTE"
          python3 scripts/e2e/backend_e2e.py --no-checks --extra ci03.json --upload --build "$APP_VERSION ($BUILD_NUMBER)${ATE_CHANNEL:+ $ATE_CHANNEL}" --out build/ci03 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: dist/*.ipa
          if-no-files-found: error

      - name: Update rolling 'latest-build' prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force -q || true
          # SHA-256 per IPA: published as a .sha256 asset and in the notes (A-CI-06).
          (cd dist && shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"); IPA_SHA=$(awk '{print $1}' "dist/$IPA_NAME.sha256")
          scripts/release-notes.sh "$APP_VERSION" "$BUILD_NUMBER" "$GITHUB_SHA" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "$IPA_NAME" "$IPA_KIND" > build/notes.md
          echo -e "\n**SHA-256** \`$IPA_NAME\`: \`$IPA_SHA\` (also attached as \`$IPA_NAME.sha256\`; check with \`shasum -a 256 -c $IPA_NAME.sha256\`)" >> build/notes.md
          [ -f build/qa.md ] && { echo; cat build/qa.md; } >> build/notes.md
          echo -e "\n**Channel:** Internal build. This rolling release is not a validated beta candidate. A validated candidate is published separately as \`latest-beta\` only after unit tests, key-flow QA, all UI test shards, and backend E2E pass." >> build/notes.md
          cat build/notes.md >> "$GITHUB_STEP_SUMMARY"
          # Immutable per-build prerelease.
          CH_TITLE=""; [ -n "$ATE_CHANNEL" ] && CH_TITLE=" — ${ATE_CHANNEL/TierA/Tier A}"
          # Tags are pushed over git first and releases created WITHOUT --target: when main moves mid-run and the
          # workflow files at GITHUB_SHA differ from the tip, POST /releases with --target needs workflows:write,
          # which GITHUB_TOKEN can't have (HTTP 403 "Resource not accessible by integration", builds 65 and 67).
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="build-${BUILD_NUMBER}${CH_SUFFIX}"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { git tag "$TAG" "$GITHUB_SHA" && git push origin "refs/tags/$TAG"; }
          gh release create "$TAG" "dist/$IPA_NAME" "dist/$IPA_NAME.sha256" --prerelease --verify-tag \
            --title "Build ${APP_VERSION} (${BUILD_NUMBER})${CH_TITLE} @ ${GITHUB_SHA::7}" --notes-file build/notes.md \
            || echo "$TAG already exists, leaving it untouched"
          # Rolling latest-build: recreated so its ONLY asset is the current versioned .ipa (no plain Ate.ipa).
          gh release delete latest-build --cleanup-tag -y || true
          git push origin ":refs/tags/latest-build" 2>/dev/null || true
          git tag -f latest-build "$GITHUB_SHA" && git push origin "refs/tags/latest-build"
          gh release create latest-build "dist/$IPA_NAME" "dist/$IPA_NAME.sha256" --prerelease --verify-tag \
            --title "Latest build ${APP_VERSION} (${BUILD_NUMBER})${CH_TITLE} — ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" --notes-file build/notes.md
          ASSETS=$(gh release view latest-build --json assets -q '[.assets[].name]|sort|join(" ")')
          [ "$ASSETS" = "$IPA_NAME $IPA_NAME.sha256" ] || { echo "::error::latest-build assets are: $ASSETS"; exit 1; }
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download"
          {
            echo "### Download"
            echo "- Latest: [$IPA_NAME]($BASE/latest-build/$IPA_NAME)"
            echo "- This build (permanent): [$IPA_NAME]($BASE/build-${BUILD_NUMBER}${CH_SUFFIX}/$IPA_NAME)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "IPA URL: $BASE/build-${BUILD_NUMBER}${CH_SUFFIX}/$IPA_NAME"

      - name: Published artifact smoke test (A-CI-06) — download, checksum, contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          TAG="build-${BUILD_NUMBER}${CH_SUFFIX}"
          rm -rf build/published && mkdir -p build/published
          gh release download "$TAG" -D build/published -p "$IPA_NAME" -p "$IPA_NAME.sha256"
          if scripts/verify-ipa.sh "build/published/$IPA_NAME" "build/published/$IPA_NAME.sha256" "$APP_VERSION" "$BUILD_NUMBER" | tee build/verify-ipa.log; then
            { echo "### Published artifact smoke test"; echo '```'; cat build/verify-ipa.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Published IPA failed the artifact smoke test; withdrawing the release"
            gh release delete "$TAG" --cleanup-tag -y || true
            gh release delete latest-build --cleanup-tag -y || true
            exit 1
          fi

      - name: Enforce required focused full-validation gates
        if: always() && env.RUN_TESTS == 'true'
        env:
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          RECIPE_REGRESSIONS_OUTCOME: ${{ steps.recipe_regressions.outcome }}
          KEY_FLOWS_OUTCOME: ${{ steps.qa.outcome }}
          TRACKER_COOK_MODE_OUTCOME: ${{ steps.tracker_gate.outcome }}
          HEADER_OUTCOME: ${{ steps.header_regressions.outcome }}
        run: |
          set -euo pipefail
          failed=0
          check_gate() {
            local label="$1" outcome="${2:-missing}"
            echo "- ${label}: ${outcome}"
            if [ "$outcome" != "success" ]; then
              echo "::error::${label} did not succeed (outcome: ${outcome})."
              failed=1
            fi
          }
          check_gate "Unit tests" "$UNIT_TESTS_OUTCOME"
          check_gate "Recipe-generation regressions" "$RECIPE_REGRESSIONS_OUTCOME"
          check_gate "KeyFlows QA" "$KEY_FLOWS_OUTCOME"
          check_gate "Tracker/Cook Mode regressions" "$TRACKER_COOK_MODE_OUTCOME"
          check_gate "Navigation-header regressions" "$HEADER_OUTCOME"
          if [ "$failed" -ne 0 ]; then
            echo "::error::Required focused full-validation gates failed or were skipped; beta promotion is blocked."
            exit 1
          fi
          echo "All required focused full-validation gates passed."

  # Full UI shards are required for beta promotion; each shard uploads diagnostics on failure.
  ui-suite:
    if: ${{ inputs.run_tests == true || contains(github.event.head_commit.message, '[run tests]') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [AteUITests, CoverageUITests, AccessibilityAuditUITests, WidgetsIntentsUITests]
    name: ui-suite (${{ matrix.shard }})
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SCHEME: Ate
      ATE_SIGN_STYLE: Automatic
      BUILD_NUMBER: ${{ github.run_number }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' && secrets.P12_PASSWORD != '' && secrets.TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: macos-26-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            macos-26-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            macos-26-xcode-deriveddata-

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-26-homebrew-xcodegen-v1
          restore-keys: |
            macos-26-homebrew-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          BASE=$(grep -E '^\s*MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          # Marketing version = <major>.<minor>.<run_number> so every build is distinct in iPhone Storage.
          VERSION="$(echo "$BASE" | cut -d. -f1-2).$BUILD_NUMBER"
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i '' -E "s/^( *MARKETING_VERSION: ).*/\1\"$VERSION\"/; s/^( *CURRENT_PROJECT_VERSION: ).*/\1\"$BUILD_NUMBER\"/; s/^( *ATE_GIT_SHA: ).*/\1\"$SHORT_SHA\"/" project.yml
          grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION|ATE_GIT_SHA' project.yml
          echo "GIT_SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          xcodegen generate && xcodebuild -version
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "IPA_NAME=Ate-$VERSION-build$BUILD_NUMBER.ipa" >> $GITHUB_ENV
          echo "Version $VERSION build $BUILD_NUMBER"

      - name: Run UI tests (full suite; required for beta promotion)
        id: uitests
        timeout-minutes: 42
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(k,x) for k,v in d.items() if "iOS-26" in k for x in v if x["name"]=="iPhone 17"]
          c=c or [(k,x) for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"]); print(c[-1][0], c[-1][1]["name"], file=sys.stderr)')
          echo "UI test simulator: $SIM_ID"; echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_ID" || true; xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteUITests/${{ matrix.shard }} -resultBundlePath build/UITests.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee uitest.log | grep --line-buffered -E "Test Case|Test Suite|error:|Testing (started|failed)|Restarting after" ; STATUS=${PIPESTATUS[0]}
          grep -E "Test Case .*(passed|failed)|error:|Executed" uitest.log | tail -60
          mkdir -p ui-screenshots/raw
          xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path ui-screenshots/raw || true
          python3 - <<'PY'
          import json, os, shutil
          raw = "ui-screenshots/raw"; out = "ui-screenshots"
          try: man = json.load(open(os.path.join(raw, "manifest.json")))
          except Exception as e: print("no manifest", e); man = []
          for test in man:
              tname = test.get("testIdentifier", "test").split("/")[-1].replace("()", "")
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  src = os.path.join(raw, a["exportedFileName"])
                  ext = os.path.splitext(a["exportedFileName"])[1] or ".png"
                  base = name.split("_0_")[0] if "_0_" in name else os.path.splitext(name)[0]
                  shutil.copy(src, os.path.join(out, f"{tname}__{base}{ext}"))
          print("\n".join(sorted(f for f in os.listdir(out) if f != "raw")))
          PY
          if [ $STATUS -ne 0 ]; then tail -120 uitest.log; fi
          exit $STATUS

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.shard }}
          path: |
            ui-screenshots/*.png
            ui-screenshots/*.jpg
            ui-screenshots/*.jpeg
          if-no-files-found: warn

      - name: Upload UI test xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UITests-xcresult-${{ matrix.shard }}
          path: build/UITests.xcresult
          if-no-files-found: warn

      - name: Report simulator Tier A items to qa_results
        if: always() && matrix.shard == 'CoverageUITests'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || exit 0
          python3 scripts/e2e/ui_results.py uitest.log build/ui-items.json
          python3 scripts/e2e/backend_e2e.py --no-checks --extra build/ui-items.json --upload --build "$APP_VERSION ($BUILD_NUMBER) TierA" --out build/ui-e2e || true

  backend-e2e:
    # Real-Supabase checks run on validation builds and are required for beta promotion.
    if: ${{ inputs.run_tests == true || contains(github.event.head_commit.message, '[run tests]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-playwright-chromium-${{ hashFiles('scripts/e2e/*.py') }}
          restore-keys: |
            ubuntu-playwright-chromium-

      - name: Install Playwright
        run: pip install -q playwright && python -m playwright install --with-deps chromium
      - name: Run backend-e2e
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          BASE=$(grep -E '^\s*MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/' | cut -d. -f1-2)
          S=0
          python scripts/e2e/backend_e2e.py --upload --build "$BASE.${{ github.run_number }} (${{ github.run_number }}) TierA" || S=$?
          cat build/e2e/summary.md >> "$GITHUB_STEP_SUMMARY"; exit $S
      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e
          path: build/e2e
          if-no-files-found: warn


  publish-beta:
    name: Promote validated beta candidate
    # Never publish a Production IPA as the rolling beta candidate. Push builds use TierA;
    # manually dispatched builds may promote only an explicit tester channel.
    if: ${{ (inputs.run_tests == true || contains(github.event.head_commit.message, '[run tests]')) && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["TierA", "TierB", "TierC"]'), inputs.channel)) }}
    needs: [release, ui-suite, backend-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_NUMBER: ${{ github.run_number }}
      ATE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'TierA' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the exact tested build
        run: |
          set -euo pipefail
          SUFFIX=""; [ -n "$ATE_CHANNEL" ] && SUFFIX="-$ATE_CHANNEL"
          TAG="build-${BUILD_NUMBER}${SUFFIX}"
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          ls -l dist
          test "$(find dist -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -name '*.ipa.sha256' | wc -l | tr -d ' ')" = "1"
          (cd dist && shasum -a 256 -c *.ipa.sha256)

      - name: Publish rolling latest-beta candidate
        run: |
          set -euo pipefail
          SUFFIX=""; [ -n "$ATE_CHANNEL" ] && SUFFIX="-$ATE_CHANNEL"
          TAG="build-${BUILD_NUMBER}${SUFFIX}"
          IPA=$(find dist -maxdepth 1 -name '*.ipa' -print -quit)
          CHECKSUM="$IPA.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh release delete latest-beta --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          git push origin ":refs/tags/latest-beta" 2>/dev/null || true
          git tag -f latest-beta "$GITHUB_SHA"
          git push --force origin refs/tags/latest-beta
          {
            echo "# Validated beta candidate"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Build tag: $TAG"
            echo "- Validation: unit tests, key-flow QA, all UI test shards (including widget/intents), backend E2E"
            echo "- This release promotes the exact IPA from the immutable build release; it does not rebuild."
            echo
            echo "SHA-256: $(awk '{print $1}' "$CHECKSUM")"
          } > beta-notes.md
          gh release create latest-beta "$IPA" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --prerelease \
            --verify-tag --title "Validated beta — build ${BUILD_NUMBER} @ ${GITHUB_SHA::7}" \
            --notes-file beta-notes.md
          echo "Published validated beta candidate from build $BUILD_NUMBER."
