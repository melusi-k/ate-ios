        env:
          REQUIRED_REGRESSION_LOGS: ${{ matrix.required_logs }}
        run: |
          missing=0
          for log in $REQUIRED_REGRESSION_LOGS; do
            if [ ! -s "$log" ]; then
              echo "::error::Missing regression execution log: $log (not a pass)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Summarize regression enforcement
        if: always()
        shell: bash
        run: |
          {
            echo "### Regression enforcement"
            echo "- Individual regression command exit codes determine worker success; log text does not override them."
            echo "- All AteTests, including the former #89 focused fixtures, are required in the separate full unit lane."
            echo "- Existing #76 Settings/account-sync quarantine remains advisory; production-channel hiding is blocking."
            echo "- Existing beta-channel UI skip remains quarantined, never a pass."
            echo "- See individual step outcomes and retained logs/xcresults for actual execution evidence."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Link regression failures to owning issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          # Advisory issue reporting only; these anchored records never decide the gate.
          failure_record_re="^Test Case '-\[.+\]' failed \([0-9.]+ seconds\)\.$|^[[:space:]]*Executed [0-9]+ tests?, with [1-9][0-9]* failures?([[:space:](,]|$)|^\*\* TEST (EXECUTE )?FAILED \*\*[[:space:]]*$|^Testing failed:$"
          report_failure() {
            log_file="$1"; suite="$2"; issue="$3"
            [ -f "$log_file" ] || return 0
            if ! grep -Eq "$failure_record_re" "$log_file"; then return 0; fi
            marker="<!-- ate-ci-regression:${GITHUB_RUN_ID}:${log_file} -->"
            details=$(grep -n -E "$failure_record_re" "$log_file" | tail -n 12 | cut -c1-500 || true)
            [ -n "$details" ] || details="Failure markers found; inspect the full retained log and xcresult."
            run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ "$issue" = "auto" ]; then
              existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "CI regression: $suite in:title" --json number,title --jq '.[0].number // empty')
              if [ -n "$existing" ]; then issue="$existing"; else
                created=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "CI regression: $suite" --body "Automated regression report for candidate ${GITHUB_SHA}.\n\nWorkflow run/artifacts: $run_url\nLog: $log_file\n\nFailure evidence:\n\n$details\n\nTriage: reproduce on the exact SHA, add reproduction steps, and verify a fix. This issue is generated from CI evidence and still needs owner/classification.") || { echo "::warning::Could not create backlog issue for $suite"; return 0; }
                issue="${created##*/}"
              fi
            fi
            if [ -z "$issue" ]; then echo "::warning::No issue target resolved for $suite ($log_file)."; return 0; fi
            if gh api "repos/${GITHUB_REPOSITORY}/issues/$issue/comments?per_page=100" --paginate --jq '.[].body' 2>/dev/null | grep -Fq "$marker"; then echo "Issue #$issue already has this run's regression report."; return 0; fi
            body=$(printf '%s\n' "$marker" "## CI regression detected — NOT PASSED" "- **Suite:** $suite" "- **Candidate SHA:** ${GITHUB_SHA}" "- **Workflow run and retained artifacts:** $run_url" "- **Log:** $log_file" "" "### Failure evidence (tail)" '```text' "$details" '```' "" "### Triage" "Reproduce from the exact candidate SHA, record reproduction steps, and keep this open until a fix is verified. Later diagnostics may still run after a failed step; command failures block except the explicit workflow quarantines. A quarantine is never a pass.")
            if gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"; then
              echo "::warning::Regression in $suite recorded on issue #$issue (NOT PASSED)."
              echo "- **Issue:** #$issue — $suite" >> "$GITHUB_STEP_SUMMARY"
              echo "- **Evidence:** $run_url" >> "$GITHUB_STEP_SUMMARY"
            else echo "::warning::Could not comment regression evidence for $suite on issue #$issue; run: $run_url"; fi
          }
          report_failure settings-sync.log "Settings/account sync (#76)" 76
          report_failure production-channel-production.log "Production channel UI" auto
          report_failure tracker-ui.log "Cooking Tracker UI (#31)" 31
          report_failure navigation-header-tests.log "Shared navigation header (#68)" 68
          report_failure cook-mode-history.log "Cook Mode completion/history (#31)" 31
          report_failure insights-evidence-navigation.log "Insights evidence and contextual navigation (#195)" 195
      - name: Enforce Insights acceptance result (#195)
        if: ${{ always() && steps.insights_acceptance.outcome == 'failure' }}
        run: |
          echo "::error::Insights acceptance failed. Later diagnostics were allowed to run, but the compile gate remains blocked until issue #195 is fixed."
          exit 1

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compile-regression-diagnostics-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            *.log
            ${{ runner.temp }}/ate-test-results/draft-quality-repair-attachments
            build.log
            app-clip-build.log
            app-clip-tests.log
            ${{ runner.temp }}/app-clip-tests.xcresult
            build-warnings.log
            test.log
            test-summary.log
            ui.log
            ui-summary.log
            production-channel-production.log
            settings-sync.log
            tracker-ui.log
            cook-mode-history.log
            navigation-header-tests.log
            settings-root-tab-visibility-tests.log
            share-publish-outage-tests.log
            recipe-static-row-accessibility-tests.log
            nutrition-ui-tests.log
            ${{ runner.temp }}/ate-test-results/nutrition-ui-attachments
            ${{ runner.temp }}/ate-test-results/*.xcresult
            cook-ingredients-tests.log
            ${{ runner.temp }}/ate-test-results/cook-ingredients-attachments
            ${{ runner.temp }}/ate-test-results/cook-finish-accessory-attachments

  regressions:
    # Preserve the original required-check context. Matrix skips, cancellation or
    # any failed worker block this aggregate. Regression command failures block;
    # only the explicit #76/beta-channel quarantines above remain advisory.
    needs: [changes, regression-suites]
    if: ${{ always() && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every native regression suite
        env:
          REGRESSION_SUITES_RESULT: ${{ needs.regression-suites.result }}
        run: |
          if [ "$REGRESSION_SUITES_RESULT" != success ]; then
            echo "::error::Native regression suites incomplete: $REGRESSION_SUITES_RESULT (not a pass)"
            exit 1
          fi

  compile:
    # Preserve the existing required-check context and fail closed on either lane.
    needs: [changes, python-tests, build-nutrition, regressions]
    if: ${{ always() && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both exact-head native lanes
        env:
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          BUILD_NUTRITION_RESULT: ${{ needs.build-nutrition.result }}
          REGRESSIONS_RESULT: ${{ needs.regressions.result }}
        run: |
          if [ "$PYTHON_RESULT" != success ] || [ "$BUILD_NUTRITION_RESULT" != success ] || [ "$REGRESSIONS_RESULT" != success ]; then
            echo "::error::Native qualification incomplete: python=$PYTHON_RESULT build-nutrition=$BUILD_NUTRITION_RESULT regressions=$REGRESSIONS_RESULT"
            exit 1
          fi

  qualification-result:
    name: Compile qualification result
    if: always()
    needs: [changes, python-tests, compile, docs-validation]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report actual qualification route
        env:
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          CLASSIFIER: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.app }}
          NATIVE_RESULT: ${{ needs.compile.result }}
          DOCS_RESULT: ${{ needs.docs-validation.result }}
        run: |
          if [[ "$PYTHON_RESULT" != success ]]; then
            echo 'Python script suite incomplete; qualification is NOT established.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$CLASSIFIER" != success ]]; then
            echo 'Scope classifier failed; qualification is NOT established.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$NATIVE" == false ]]; then
            echo 'Documentation-only diff. Mac compile/tests NOT RUN; this is NOT native qualification.' >> "$GITHUB_STEP_SUMMARY"
            [[ "$NATIVE_RESULT" == skipped && "$DOCS_RESULT" == success ]]
          else
            echo "Native qualification required. Mac job result: $NATIVE_RESULT." >> "$GITHUB_STEP_SUMMARY"
            [[ "$NATIVE" == true && "$NATIVE_RESULT" == success ]]
          fi
