name: Compile check

# Fast iteration for wip/** branches: builds the app (with all extensions) for the simulator and runs the unit tests.
# Build IPA ignores wip/** pushes, so this never consumes a build number.
on:
  push:
    branches: ["wip/**"]
  workflow_dispatch:

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ATE_SIGN_STYLE: Automatic
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && xcodegen generate
      - name: Build for testing (iOS simulator)
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E "error:|\.swift:[0-9]+:[0-9]+: error" build.log | sort -u | head -80; tail -40 build.log; exit 1; }
          grep -E "warning: .*(Widgets|Intents|Snapshot)" build.log | sort -u | head -30 || true
      - name: Unit tests
        run: |
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" -only-testing:AteTests CODE_SIGNING_ALLOWED=NO > test.log 2>&1 \
            || { grep -E "error:|failed|XCTAssert" test.log | head -60; tail -30 test.log; exit 1; }
          grep -E "Executed" test.log | tail -2
      - name: Widget/intents UI tests
        if: always()
        run: |
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" -only-testing:AteUITests/WidgetsIntentsUITests CODE_SIGNING_ALLOWED=NO > ui.log 2>&1 \
            || { grep -E "error:|failed|XCTAssert" ui.log | head -60; tail -30 ui.log; exit 1; }
          grep -E "Executed" ui.log | tail -2
