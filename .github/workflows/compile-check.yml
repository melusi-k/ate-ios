name: Compile check

# Fast validation for work-in-progress branches and pull requests: compile the app, run unit tests,
# and exercise widget/intents UI flows before changes are merged. Build IPA ignores wip/** pushes.
on:
  push:
    branches: ["wip/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ATE_SIGN_STYLE: Automatic
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-26-homebrew-xcodegen-v1
          restore-keys: |
            macos-26-homebrew-
      - run: brew install xcodegen && xcodegen generate
      - name: Build for testing (iOS simulator)
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          if ! xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            echo "::error::Simulator build failed. Last 200 log lines:"
            tail -n 200 build.log
            exit 1
          fi
          grep -E "warning: .*(Widgets|Intents|Snapshot)" build.log > build-warnings.log || true
          tail -n 30 build-warnings.log || true
      - name: Unit tests
        run: |
          if ! xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" -only-testing:AteTests CODE_SIGNING_ALLOWED=NO > test.log 2>&1; then
            echo "::error::Unit tests failed. Full log follows (no grep/head pipeline, preserving xcodebuild exit status):"
            tail -n 250 test.log
            exit 1
          fi
          grep -E "Executed|Test Suite .* (passed|failed)" test.log > test-summary.log || true
          tail -n 30 test-summary.log
      - name: Widget/intents UI tests
        if: always()
        run: |
          if ! xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" -only-testing:AteUITests/WidgetsIntentsUITests CODE_SIGNING_ALLOWED=NO > ui.log 2>&1; then
            echo "::error::Widget/intents UI tests failed. Full log follows (no grep/head pipeline, preserving xcodebuild exit status):"
            tail -n 250 ui.log
            exit 1
          fi
          grep -E "Executed|Test Suite .* (passed|failed)" ui.log > ui-summary.log || true
          tail -n 30 ui-summary.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-check-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            build.log
            build-warnings.log
            test.log
            test-summary.log
            ui.log
            ui-summary.log
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
