name: Compile check

# Everyday gate: build the app and run a small, high-value smoke set.
# Exhaustive unit/UI coverage is retained in preproduction-qa.yml.
permissions:
  contents: read
  pull-requests: read
  issues: write

on:
  push:
    branches: ["wip/**"]
  # Run on every PR target, including stacked feature/test branches, so a
  # dependent PR cannot silently bypass the compile gate while based on another PR.
  pull_request:
  workflow_dispatch:

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/classify-native-scope.yml
    permissions:
      contents: read
      pull-requests: read

  python-tests:
    # One credential-free candidate-head suite. Merge-ref Python duplication in
    # Dogfood is intentionally removed; native Dogfood coverage is unchanged.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run complete Python script suite once
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  docs-validation:
    needs: changes
    if: needs.changes.outputs.app == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate docs IDs and generated checklist consistency
        run: python3 scripts/check-ids.py

  build-nutrition:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    # Full units/nutrition and later regressions have independent exact-head jobs
    # with separate lower budgets (45m / 110m).
    timeout-minutes: 45
    env:
      ATE_SIGN_STYLE: Automatic
    steps:
      # PR validation must build the exact proposed head, not GitHub's synthetic merge commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-27-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-27-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            xcode-27-xcode-deriveddata-
      - name: Validate docs IDs and generated checklist consistency
        run: python3 scripts/check-ids.py
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: xcode-27-homebrew-xcodegen-v1
          restore-keys: |
            xcode-27-homebrew-
      - run: brew install xcodegen && xcodegen generate
      - name: Build isolated App Clip target
        run: |
          set -o pipefail
          xcodebuild build -project Ate.xcodeproj -scheme AteClip -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO > app-clip-build.log 2>&1 || { grep -n -B 8 -A 12 -E "error:|failed|Testing failed" app-clip-build.log || true; tail -100 app-clip-build.log; exit 1; }
          grep -E "BUILD SUCCEEDED|warning:" app-clip-build.log | tail -30
      - name: Run App Clip URL contract tests
        run: |
          set -o pipefail
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          xcodebuild test -project Ate.xcodeproj -scheme AteClip -destination "id=$SIM_ID" -resultBundlePath "$RUNNER_TEMP/app-clip-tests.xcresult" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO > app-clip-tests.log 2>&1 || { grep -n -B 8 -A 12 -E "error:|failed|XCTAssert|Testing failed|Fatal error" app-clip-tests.log || true; tail -100 app-clip-tests.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" app-clip-tests.log | tail -40
      - name: Prepare diagnostics directory
        run: mkdir -p "$RUNNER_TEMP/ate-test-results"
      - name: Build for testing (iOS simulator)
        id: build
        run: |
          set -o pipefail
          STEP_START=$(date +%s)
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"

          set +e
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" -resultBundlePath "$RUNNER_TEMP/ate-test-results/build.xcresult" CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          set -e
          STEP_END=$(date +%s)
          echo "::notice::CI_TIMING step=build-for-testing duration_seconds=$((STEP_END-STEP_START)) exit_code=$status"

          if [ "$status" -ne 0 ]; then
            echo "::error::Simulator build failed (xcodebuild exit $status). Matching diagnostics and recent log follow:"
            grep -n -B 8 -A 12 -E "error:|warning:|failed|Fatal error|Testing failed" build.log || true
            echo "::group::Last 100 build log lines"
            tail -n 100 build.log
            echo "::endgroup::"
            exit "$status"
          fi

          grep -E "warning: .*(Widgets|Intents|Snapshot)" build.log > build-warnings.log || true
          tail -n 30 build-warnings.log || true
      - name: Full exact-head unit suite (all AteTests)
        id: unit_tests
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          echo "Full unit suite source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteTests \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/full-unit-tests.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > full-unit-tests.log 2>&1 || { grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Testing failed|Assertion failed" full-unit-tests.log || true; tail -120 full-unit-tests.log; exit 1; }
          total=$(sed -nE 's/^[[:space:]]*Executed ([0-9]+) tests?,.*/\1/p' full-unit-tests.log | tail -1)
          if ! [[ "$total" =~ ^[0-9]+$ ]] || [ "$total" -lt 1 ]; then
            echo "::error::Full AteTests suite reported no execution: ${total:-missing}"
            exit 1
          fi
          # Structured results preserve exact named passes when app stderr splits console rows.
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/ate-test-results/full-unit-tests.xcresult" > full-unit-tests.json
          python3 scripts/verify-full-unit-required.py full-unit-tests.json scripts/full-unit-required.txt
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" full-unit-tests.log | tail -60

      - name: Retain full unit diagnostics before UI acceptance
        if: always() && (steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: full-unit-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            full-unit-tests.log
            full-unit-tests.json
            ${{ runner.temp }}/ate-test-results/full-unit-tests.xcresult

      # Keep normal-size audits required; retain cross-size cases in the optional lane.
      - name: Nutrition diary and goals UI regressions (#179)
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          # Clean process so launch arguments are real (same rationale as other UI shards).
          xcrun simctl terminate "$SIM_ID" com.melusik.ate >/dev/null 2>&1 || true
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteUITests/NutritionDiaryUITests \
            -only-testing:AteUITests/NutritionGoalsUITests \
            -only-testing:AteUITests/CookPlanUITests \
            -only-testing:AteUITests/AccessibilityAuditUITests/testAuditNutritionScreensWithoutDynamicType \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/nutrition-ui-tests.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > nutrition-ui-tests.log 2>&1 || status=$?
          # Export screenshots, hierarchy snapshots and audit attachments on every outcome,
          # including successful runs, so merge-gate pixel evidence is retained.
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ate-test-results/nutrition-ui-tests.xcresult" --output-path "$RUNNER_TEMP/ate-test-results/nutrition-ui-attachments" 2>/dev/null || true
          if [ "${status:-0}" -ne 0 ]; then
            grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Testing failed|Assertion failed" nutrition-ui-tests.log || true
            tail -120 nutrition-ui-tests.log
            exit 1
          fi
          # Execution evidence: a green selection that ran nothing is a failure, and every
          # named test must appear with its own pass line in the log.
          if grep -q "Executed 0 tests" nutrition-ui-tests.log; then echo "::error::nutrition UI selection executed 0 tests"; exit 1; fi
          for evidence in \
            "NutritionDiaryUITests testFoodDiaryOpensAndExplicitlyLogsFoodWithUnavailableValues]' passed" \
            "NutritionDiaryUITests testDiaryShowsGoalPromptWhenGoalsUnconfiguredAndEmptyState]' passed" \
            "NutritionDiaryUITests testLogFoodRejectsNonPositiveQuantityWithVisibleError]' passed" \
            "NutritionDiaryUITests testLogFoodSurfacesSaveFailure]' passed" \
            "NutritionDiaryUITests testCorruptDiaryShowsErrorAndRecoversAfterBackupReset]' passed" \
            "NutritionDiaryUITests testCorruptGoalsShowLoadErrorWithRetry]' passed" \
            "NutritionDiaryUITests testRecipeNutritionShowsIncompleteStateForUnmappedIngredient]' passed" \
            "NutritionDiaryUITests testLoggedEntryCanBeEditedAndShowsUpdatedValues]' passed" \
            "CookPlanUITests testSavedRecipePlanWithoutReminderCanBeReopenedAndCancelled]' passed" \
            "NutritionGoalsUITests testGoalsCanBeConfiguredAndClearedFromSettings]' passed" \
            "NutritionDiaryUITests testThisWeekSectionShowsTotalsForLoggedEntries]' passed" \
            "AccessibilityAuditUITests testAuditNutritionScreensWithoutDynamicType]' passed"; do
            grep -qF "$evidence" nutrition-ui-tests.log || { echo "::error::missing pass evidence: $evidence"; tail -60 nutrition-ui-tests.log; exit 1; }
          done
          grep -E "Test Case .* (passed|failed)|Executed" nutrition-ui-tests.log | tail -80

      - name: Upload nutrition UI diagnostics (early)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Unique per run+attempt and distinct from the tail artifact, so this early upload
          # never collides with the immutable tail artifact name and nutrition diagnostics
          # survive even when a later push supersedes this run before the job tail.
          name: nutrition-ui-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            nutrition-ui-tests.log
            ${{ runner.temp }}/ate-test-results/nutrition-ui-tests.xcresult
            ${{ runner.temp }}/ate-test-results/nutrition-ui-attachments

      - name: Upload build and nutrition diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compile-build-nutrition-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            build.log
            app-clip-build.log
            app-clip-tests.log
            ${{ runner.temp }}/app-clip-tests.xcresult
            build-warnings.log
            test.log
            test-summary.log
            ui.log
            ui-summary.log
            production-channel-production.log
            settings-sync.log
            tracker-ui.log
            cook-mode-history.log
            navigation-header-tests.log
            settings-root-tab-visibility-tests.log
            share-publish-outage-tests.log
            nutrition-ui-tests.log
            ${{ runner.temp }}/ate-test-results/nutrition-ui-attachments
            ${{ runner.temp }}/ate-test-results/*.xcresult
            cook-ingredients-tests.log
            ${{ runner.temp }}/ate-test-results/cook-ingredients-attachments
            ${{ runner.temp }}/ate-test-results/cook-finish-accessory-attachments

  regression-suites:
    name: regression suite (${{ matrix.suite }})
    # Separate standard hosted VMs; one simulator and sequential tests per worker.
    # Two regression workers plus nutrition, Journal and Dogfood permit five
    # priority native jobs per head. GitHub's account-wide macOS cap still
    # queues these alongside other PRs; this matrix reserves no extra capacity.
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - suite: presentation-creation
            required_logs: insights-evidence-navigation.log share-publish-outage-tests.log interrupted-generation-retry-lifecycle.log transient-generation-retry.log expandable-recipe-sheet-tests.log recipe-static-row-accessibility-tests.log
          - suite: account-cooking
            required_logs: settings-sync.log production-channel-production.log settings-about-145.log account-switch-sync-failure-library.log tracker-ui.log navigation-header-tests.log settings-root-tab-visibility-tests.log cook-mode-history.log cook-ingredients-tests.log
    env:
      ATE_SIGN_STYLE: Automatic
    steps:
      # PR validation must build the exact proposed head, not GitHub's synthetic merge commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-27-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-27-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            xcode-27-xcode-deriveddata-
      - name: Validate docs IDs and generated checklist consistency
        run: python3 scripts/check-ids.py
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: xcode-27-homebrew-xcodegen-v1
          restore-keys: |
            xcode-27-homebrew-
      - run: brew install xcodegen && xcodegen generate
      - name: Prepare diagnostics directory
        run: mkdir -p "$RUNNER_TEMP/ate-test-results"
      - name: Build for testing (iOS simulator)
        id: build
        run: |
          set -o pipefail
          STEP_START=$(date +%s)
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"

          set +e
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" -resultBundlePath "$RUNNER_TEMP/ate-test-results/build.xcresult" CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          set -e
          STEP_END=$(date +%s)
          echo "::notice::CI_TIMING step=build-for-testing duration_seconds=$((STEP_END-STEP_START)) exit_code=$status"

          if [ "$status" -ne 0 ]; then
            echo "::error::Simulator build failed (xcodebuild exit $status). Matching diagnostics and recent log follow:"
            grep -n -B 8 -A 12 -E "error:|warning:|failed|Fatal error|Testing failed" build.log || true
            echo "::group::Last 100 build log lines"
            tail -n 100 build.log
            echo "::endgroup::"
            exit "$status"
          fi

          grep -E "warning: .*(Widgets|Intents|Snapshot)" build.log > build-warnings.log || true
          tail -n 30 build-warnings.log || true
      # Removed obsolete Library Explore sheet selectors: the tests and UI no longer
      # exist and v9 executed zero tests. Current Journal hub navigation is asserted
      # by InsightsAcceptanceUITests below, not represented as sheet coverage.
      - name: Insights evidence and contextual navigation acceptance (issue #195)
        id: insights_acceptance
        if: ${{ matrix.suite == 'presentation-creation' && (!cancelled() && steps.build.outcome == 'success') }}
        run: |
          set -o pipefail
          xcrun simctl terminate "$SIM_ID" com.melusik.ate >/dev/null 2>&1 || true
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteUITests/InsightsAcceptanceUITests/testWeeklyCookingInsightShowsEvidenceAndNavigatesToTracker \
            -only-testing:AteUITests/InsightsAcceptanceUITests/testInsightCanBeResolvedAndStaysSuppressedAfterRefresh \
            -only-testing:AteUITests/InsightsAcceptanceUITests/testOpeningCookingHistoryKeepsInsightUntilExplicitDismissal \
            -only-testing:AteUITests/InsightsAcceptanceUITests/testJournalRootReflectionPlacementDraftAndSaveWithoutHealth \
            -only-testing:AteUITests/InsightsAcceptanceUITests/testJournalRootReflectionFailedSaveKeepsDraftVisible \
            -only-testing:AteUITests/InsightsAcceptanceUITests/testCandidateCardsScrollSideBySideWithoutDismissing \
            -only-testing:AteUITests/InsightsAcceptanceUITests/testJournalRootReflectionLabelsSampleHealthPrompts \
            -only-testing:AteUITests/InsightsAcceptanceUITests/testSeededShoppingInsightOpensRealListAndRetainsSuggestion \
            -only-testing:AteUITests/InsightsAcceptanceUITests/testSeededDiaryInsightOpensRealDiaryAndRetainsSuggestion \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/insights-evidence-navigation.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > insights-evidence-navigation.log 2>&1 || { grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Testing failed|Assertion failed" insights-evidence-navigation.log || true; tail -120 insights-evidence-navigation.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" insights-evidence-navigation.log | tail -40

      - name: Retain UI-test day-sheet presentation trace
        if: ${{ matrix.suite == 'presentation-creation' && (always() && steps.insights_acceptance.outcome != 'skipped') }}
        run: |
          xcrun simctl spawn "$SIM_ID" log show --style compact --last 30m \
            --predicate 'subsystem == "com.melusik.ate" AND category == "day-sheet-presentation"' \
            > day-sheet-presentation.log 2>&1 || true

      - name: Share publish outage fallback UI regression (PR #122)
        if: ${{ matrix.suite == 'presentation-creation' && (!cancelled() && steps.build.outcome == 'success') }}
        run: |
          set -o pipefail
          xcrun simctl terminate "$SIM_ID" com.melusik.ate >/dev/null 2>&1 || true
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/share-publish-outage-fallback.xcresult" \
            -only-testing:AteUITests/CoverageUITests/test39_SharePublishOutageFallsBackToTextAndKeepsLibrary \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO > share-publish-outage-tests.log 2>&1 || { grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Testing failed|Assertion failed" share-publish-outage-tests.log || true; tail -100 share-publish-outage-tests.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" share-publish-outage-tests.log | tail -40

      - name: Interrupted generation Retry lifecycle acceptance (#143)
        if: ${{ matrix.suite == 'presentation-creation' && (!cancelled() && steps.build.outcome == 'success') }}
        run: |
          set -o pipefail
          xcrun simctl terminate "$SIM_ID" com.melusik.ate >/dev/null 2>&1 || true
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteUITests/CoverageUITests/test37_KilledMidGenerationRecovers \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/interrupted-generation-retry-lifecycle.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > interrupted-generation-retry-lifecycle.log 2>&1 || { grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Testing failed|Assertion failed" interrupted-generation-retry-lifecycle.log || true; tail -120 interrupted-generation-retry-lifecycle.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" interrupted-generation-retry-lifecycle.log | tail -40

      # Unit selectors, including #89 fixtures, execute once in the strict full unit lane.
      - name: Transient generation Retry recovery (#89)
        if: ${{ matrix.suite == 'presentation-creation' && (always() && steps.build.outcome == 'success') }}
        run: |
          set -o pipefail
          xcrun simctl terminate "$SIM_ID" com.melusik.ate >/dev/null 2>&1 || true
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteUITests/CoverageUITests/test36b_RecipeGenerationRetryRecoversAfterTransientFailure \
            -only-testing:AteUITests/DraftQualityRepairUITests \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/transient-generation-retry.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO > transient-generation-retry.log 2>&1 || { grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Testing failed|Assertion failed" transient-generation-retry.log || true; tail -120 transient-generation-retry.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" transient-generation-retry.log | tail -40
          grep -qF "DraftQualityRepairUITests testExplicitRepairKeepsTheDraftAndResolvesTheMissingBreadGap]' passed" transient-generation-retry.log || { echo "::error::missing explicit draft repair pass"; exit 1; }

      - name: Retain explicit draft repair screenshots on every result
        if: ${{ matrix.suite == 'presentation-creation' && (always() && steps.build.outcome == 'success') }}
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ate-test-results/transient-generation-retry.xcresult" --output-path "$RUNNER_TEMP/ate-test-results/draft-quality-repair-attachments" || { echo '::warning::Draft repair attachment export unavailable; no pixel acceptance'; }

      - name: Expandable recipe-detail sheet regression (#101)
        if: ${{ matrix.suite == 'presentation-creation' && (always() && steps.build.outcome == 'success') }}
        run: |
          set -o pipefail
          xcrun simctl terminate "$SIM_ID" com.melusik.ate >/dev/null 2>&1 || true
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/expandable-recipe-sheet.xcresult" \
            -only-testing:AteUITests/CoverageUITests/test32c_ExpandableRecipeSheetOpensExpandsAndDismisses \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO > expandable-recipe-sheet-tests.log 2>&1 || { grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Testing failed|Assertion failed" expandable-recipe-sheet-tests.log || true; tail -100 expandable-recipe-sheet-tests.log; exit 1; }
          # Require the actual strengthened journey, not a zero-test green selection.
          if grep -q "Executed 0 tests" expandable-recipe-sheet-tests.log; then echo "::error::expandable recipe selection executed 0 tests"; exit 1; fi
          grep -qF "CoverageUITests test32c_ExpandableRecipeSheetOpensExpandsAndDismisses]' passed" expandable-recipe-sheet-tests.log || { echo "::error::missing expandable recipe named-pass evidence"; tail -80 expandable-recipe-sheet-tests.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" expandable-recipe-sheet-tests.log | tail -40

      - name: Static recipe row accessibility contract (#522)
        if: ${{ matrix.suite == 'presentation-creation' && (always() && steps.build.outcome == 'success') }}
        run: |
          set -o pipefail
          xcrun simctl terminate "$SIM_ID" com.melusik.ate >/dev/null 2>&1 || true
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/recipe-static-row-accessibility.xcresult" \
            -only-testing:AteUITests/RecipeStaticRowAccessibilityUITests/testCombinedRecipeRowsRetainQuantityNameStepNumberAndInstruction \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
