name: Diagnose 245 explore-sheets xcresult
on:
  push:
    branches: [diag/**]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Source run id holding the diagnostics artifact"
        required: true
        default: "41254392421"
      artifact_name:
        description: "Artifact name inside that run"
        required: true
        default: "compile-check-diagnostics-41254392421-2"
      xcresult_path:
        description: "xcresult path inside the artifact"
        required: true
        default: "_temp/ate-test-results/library-explore-sheets.xcresult"
permissions:
  actions: read
  contents: read
jobs:
  dump:
    runs-on: xcode-27
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name || 'compile-check-diagnostics-41254392421-2' }}
          run-id: ${{ inputs.run_id || '41254392421' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: diag
      - name: Dump xcresult diagnostics
        run: |
          set -x
          XC="diag/${{ inputs.xcresult_path || '_temp/ate-test-results/library-explore-sheets.xcresult' }}"
          ls -la "$XC" || true
          (xcrun xcresulttool get log --type action --path "$XC" --legacy > step-log.txt 2>log-err.txt) || (xcrun xcresulttool get log --type action --path "$XC" > step-log.txt 2>>log-err.txt) || true
          xcrun xcresulttool get test-results summary --path "$XC" --format json > summary.json 2>summary-err.txt || true
          xcrun xcresulttool get test-results tests --path "$XC" --format json > tests.json 2>tests-err.txt || true
          xcrun xcresulttool export attachments --path "$XC" --output-path attachments > export.txt 2>export-err.txt || true
          python3 - <<'PY'
          import json, subprocess
          try:
              t = json.load(open('tests.json'))
          except Exception as e:
              print('no tests.json', e)
              raise SystemExit(0)
          ids = []
          def walk(o):
              if isinstance(o, dict):
                  n = o.get('name') or o.get('testName') or ''
                  if isinstance(n, str) and 'testExplore' in n:
                      i = o.get('id') or o.get('identifier') or o.get('testIdentifier')
                      if i:
                          ids.append((n, i))
                  for v in o.values():
                      walk(v)
              elif isinstance(o, list):
                  for v in o:
                      walk(v)
          walk(t)
          print('explore ids:', ids)
          for n, i in ids[:4]:
              safe = n.replace('()', '').replace(' ', '_')
              with open('details-%s.json' % safe, 'w') as f:
                  subprocess.run(['xcrun','xcresulttool','get','test-results','test-details','--path','diag/${{ inputs.xcresult_path || \'_temp/ate-test-results/library-explore-sheets.xcresult\' }}','--test-id',i,'--format','json'], stdout=f, stderr=subprocess.DEVNULL)
              with open('activities-%s.json' % safe, 'w') as f:
                  subprocess.run(['xcrun','xcresulttool','get','test-results','activities','--path','diag/${{ inputs.xcresult_path || \'_temp/ate-test-results/library-explore-sheets.xcresult\' }}','--test-id',i,'--format','json'], stdout=f, stderr=subprocess.DEVNULL)
          PY
          (find diag -iname '*spindump*' -o -iname '*sample*' -o -iname '*.crash' -o -iname '*.hang' -o -iname '*diagnostic*' | head -50) > diag-files.txt || true
          ls attachments 2>/dev/null | head -80 >> diag-files.txt || true
      - name: Upload diagnostics dump
        uses: actions/upload-artifact@v7
        with:
          name: diag-245-explore-sheets-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            step-log.txt
            summary.json
            tests.json
            details-*.json
            activities-*.json
            diag-files.txt
            attachments
            *-err.txt
