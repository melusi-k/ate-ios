name: Dogfood Qualification

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  pin-source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Freeze qualification source from the event
        id: pin
        env:
          EVENT_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$EVENT_SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$EVENT_SOURCE" >> "$GITHUB_OUTPUT"

  changes:
    uses: ./.github/workflows/classify-native-scope.yml
    permissions:
      contents: read
      pull-requests: read

  qa-critical-flows:
    needs: [changes, pin-source]
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.receipt.outputs.sha }}
    env:
      SCHEME: Ate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify frozen source before execution
        env:
          EXPECTED_SOURCE: ${{ needs.pin-source.outputs.sha }}
        run: python3 scripts/ci-lane-receipt.py verify --expected "$EXPECTED_SOURCE"
      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-27-dogfood-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-27-dogfood-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            xcode-27-xcode-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project for exact commit
        run: |
          BASE=$(grep -E '^\s*MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          VERSION="$(echo "$BASE" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
          sed -i '' -E "s/^( *MARKETING_VERSION: ).*/\1\"$VERSION\"/; s/^( *CURRENT_PROJECT_VERSION: ).*/\1\"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate
          mkdir -p build
          xcodebuild -version
          echo "Qualification commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      # Python scripts are tested once on the exact candidate head in Compile.
      # Separate merge-ref Python coverage is intentionally removed.

      - name: Select iPhone 18 Pro simulator (iOS 27.0)
        id: select_simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/available-simulators.json
          xcodebuild -project Ate.xcodeproj -scheme "$SCHEME" -showdestinations > /tmp/xcode-destinations.txt 2>&1 || {
            cat /tmp/xcode-destinations.txt
            exit 1
          }
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          if ! grep -Fq "id:$SIM_ID" /tmp/xcode-destinations.txt; then
            echo "ERROR: selected iPhone 18 Pro is not listed as an Ate scheme destination."
            cat /tmp/xcode-destinations.txt
            exit 1
          fi
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b

      - name: Required QA critical flows
        id: critical_flows
        timeout-minutes: 30
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          # QA1 flow = the exact three cases below; keep in sync with QA1_REQUIRED_CASES
          # in scripts/qa-summary.py and scripts/release/readiness.py.
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteUITests/KeyFlowsQATests/testQA1_AddFromURL_JSONLD \
            -only-testing:AteUITests/KeyFlowsQATests/testQA1_AddFromURL_InstagramCaption \
            -only-testing:AteUITests/KeyFlowsQATests/testQA1_AddFromURL_HiddenCaptionFallback \
            -only-testing:AteUITests/KeyFlowsQATests/testQA2_AddFromPhoto \
            -only-testing:AteUITests/KeyFlowsQATests/testQA3_GenerateAndEdit \
            -only-testing:AteUITests/KeyFlowsQATests/testQA4_Save \
            -only-testing:AteUITests/KeyFlowsQATests/testQA5_Share \
            -only-testing:AteUITests/KeyFlowsQATests/testQA6_OpenShared \
            -only-testing:AteUITests/KeyFlowsQATests/testQA8_Timers \
            -resultBundlePath build/DogfoodCriticalFlows-qa.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > dogfood-critical-flows-qa.log 2>&1 || { grep -n -B 8 -A 12 -E "error:|failed|XCTAssert|Testing failed|Fatal error" dogfood-critical-flows-qa.log || true; tail -100 dogfood-critical-flows-qa.log; exit 1; }
          python3 scripts/verify-dogfood-group.py --group qa --log dogfood-critical-flows-qa.log --bundle build/DogfoodCriticalFlows-qa.xcresult --exit-code 0
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" dogfood-critical-flows-qa.log | tail -50
      - name: Retain UI-test photo-import phase diagnostics
        if: always() && steps.critical_flows.outcome != 'skipped' && steps.select_simulator.outputs.id != ''
        env:
          SIM_ID: ${{ steps.select_simulator.outputs.id }}
        run: |
          # Fixed phase names and elapsed milliseconds only, emitted solely with -UITesting.
          # This is collection, not a retry or a qualification outcome.
          xcrun simctl spawn "$SIM_ID" log show --last 60m --style compact --info --debug \
            --predicate 'subsystem == "com.melusik.ate" AND category == "photo-import-phases"' \
            > dogfood-photo-import-phases.log 2>&1 || true

      - name: Upload independent Dogfood group diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dogfood-critical-flows-qa.log*
            build/DogfoodCriticalFlows-qa.xcresult
            dogfood-startup-liveness
            dogfood-photo-import-phases.log
          if-no-files-found: error
      - name: Record exact-source lane receipt
        id: receipt
        env:
          EXPECTED_SOURCE: ${{ needs.pin-source.outputs.sha }}
        run: python3 scripts/ci-lane-receipt.py write --expected "$EXPECTED_SOURCE" --lane qa-critical-flows --path lane-receipt.json >> "$GITHUB_OUTPUT"
      - name: Retain exact-source lane receipt
        uses: actions/upload-artifact@v7
        with:
          name: source-receipt-qa-critical-flows-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane-receipt.json
          if-no-files-found: error

  library-popup:
    needs: [changes, pin-source]
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.receipt.outputs.sha }}
    env:
      SCHEME: Ate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify frozen source before execution
        env:
          EXPECTED_SOURCE: ${{ needs.pin-source.outputs.sha }}
        run: python3 scripts/ci-lane-receipt.py verify --expected "$EXPECTED_SOURCE"
      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-27-dogfood-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-27-dogfood-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            xcode-27-xcode-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project for exact commit
        run: |
          BASE=$(grep -E '^\s*MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          VERSION="$(echo "$BASE" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
          sed -i '' -E "s/^( *MARKETING_VERSION: ).*/\1\"$VERSION\"/; s/^( *CURRENT_PROJECT_VERSION: ).*/\1\"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate
          mkdir -p build
          xcodebuild -version
          echo "Qualification commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      # Python scripts are tested once on the exact candidate head in Compile.
      # Separate merge-ref Python coverage is intentionally removed.

      - name: Select iPhone 18 Pro simulator (iOS 27.0)
        id: select_simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/available-simulators.json
          xcodebuild -project Ate.xcodeproj -scheme "$SCHEME" -showdestinations > /tmp/xcode-destinations.txt 2>&1 || {
            cat /tmp/xcode-destinations.txt
            exit 1
          }
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          if ! grep -Fq "id:$SIM_ID" /tmp/xcode-destinations.txt; then
            echo "ERROR: selected iPhone 18 Pro is not listed as an Ate scheme destination."
            cat /tmp/xcode-destinations.txt
            exit 1
          fi
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b

      - name: Required Library popup journeys
        id: critical_flows
        timeout-minutes: 30
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          # QA1 flow = the exact three cases below; keep in sync with QA1_REQUIRED_CASES
          # in scripts/qa-summary.py and scripts/release/readiness.py.
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteUITests/AteUITests/test28_GroupSortAndMenus \
            -only-testing:AteUITests/AteUITests/test29_ReorderMyOrder \
            -only-testing:AteUITests/AteUITests/test29b_ReorderMyOrderActions \
            -resultBundlePath build/DogfoodCriticalFlows-library.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > dogfood-critical-flows-library.log 2>&1 || { grep -n -B 8 -A 12 -E "error:|failed|XCTAssert|Testing failed|Fatal error" dogfood-critical-flows-library.log || true; tail -100 dogfood-critical-flows-library.log; exit 1; }
          python3 scripts/verify-dogfood-group.py --group library --log dogfood-critical-flows-library.log --bundle build/DogfoodCriticalFlows-library.xcresult --exit-code 0
          for test in test28_GroupSortAndMenus test29_ReorderMyOrder test29b_ReorderMyOrderActions; do
            grep -qF "AteUITests $test]' passed" dogfood-critical-flows-library.log || { echo "::error::missing named Library pass: $test"; exit 1; }
          done
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" dogfood-critical-flows-library.log | tail -50
      - name: Retain selected Group28 startup liveness
        if: always() && steps.critical_flows.outcome != 'skipped' && steps.select_simulator.outputs.id != ''
        env:
          SIM_ID: ${{ steps.select_simulator.outputs.id }}
        run: |
          mkdir -p dogfood-startup-liveness
          date -u '+%Y-%m-%dT%H:%M:%SZ' > dogfood-startup-liveness/copy-utc.txt
          if data_container=$(xcrun simctl get_app_container "$SIM_ID" com.melusik.ate data 2> dogfood-startup-liveness/container-errors.txt); then
            found=0
            for evidence in "$data_container"/Library/Caches/startup-liveness-*.txt; do
              if [ -f "$evidence" ]; then
                cp "$evidence" dogfood-startup-liveness/
                found=1
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo 'No startup samples retained; liveness unverified.' > dogfood-startup-liveness/missing.txt
            fi
          fi

      - name: Upload independent Dogfood group diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-library-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dogfood-critical-flows-library.log*
            build/DogfoodCriticalFlows-library.xcresult
            dogfood-startup-liveness
            dogfood-photo-import-phases.log
          if-no-files-found: error
      - name: Record exact-source lane receipt
        id: receipt
        env:
          EXPECTED_SOURCE: ${{ needs.pin-source.outputs.sha }}
        run: python3 scripts/ci-lane-receipt.py write --expected "$EXPECTED_SOURCE" --lane library-popup --path lane-receipt.json >> "$GITHUB_OUTPUT"
      - name: Retain exact-source lane receipt
        uses: actions/upload-artifact@v7
        with:
          name: source-receipt-library-popup-${{ github.run_id }}-${{ github.run_attempt }}
          path: lane-receipt.json
          if-no-files-found: error

  sync-quarantine:
    needs: [changes, pin-source]
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      SCHEME: Ate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify frozen source before execution
        env:
          EXPECTED_SOURCE: ${{ needs.pin-source.outputs.sha }}
        run: python3 scripts/ci-lane-receipt.py verify --expected "$EXPECTED_SOURCE"
      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-27-dogfood-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-27-dogfood-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            xcode-27-xcode-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project for exact commit
        run: |
          BASE=$(grep -E '^\s*MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          VERSION="$(echo "$BASE" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
          sed -i '' -E "s/^( *MARKETING_VERSION: ).*/\1\"$VERSION\"/; s/^( *CURRENT_PROJECT_VERSION: ).*/\1\"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate
          mkdir -p build
          xcodebuild -version
          echo "Qualification commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      # Python scripts are tested once on the exact candidate head in Compile.
      # Separate merge-ref Python coverage is intentionally removed.

      - name: Select iPhone 18 Pro simulator (iOS 27.0)
        id: select_simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/available-simulators.json
          xcodebuild -project Ate.xcodeproj -scheme "$SCHEME" -showdestinations > /tmp/xcode-destinations.txt 2>&1 || {
            cat /tmp/xcode-destinations.txt
            exit 1
          }
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          if ! grep -Fq "id:$SIM_ID" /tmp/xcode-destinations.txt; then
            echo "ERROR: selected iPhone 18 Pro is not listed as an Ate scheme destination."
            cat /tmp/xcode-destinations.txt
            exit 1
          fi
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b

      - name: Diagnose quarantined Settings/account-sync flow (#76)
        id: sync_quarantine
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteUITests/KeyFlowsQATests/testQA7_SyncAccount \
            -resultBundlePath build/DogfoodSyncQuarantine.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            CODE_SIGNING_ALLOWED=NO > dogfood-sync-quarantine.log 2>&1 || { grep -n -B 6 -A 10 -E "error:|failed|XCTAssert|Testing failed" dogfood-sync-quarantine.log || true; tail -80 dogfood-sync-quarantine.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" dogfood-sync-quarantine.log | tail -20

      - name: Report quarantine without claiming qualification
        if: always()
        env:
          DIAGNOSTIC: ${{ steps.sync_quarantine.outcome }}
        run: |
          echo 'Settings/account-sync issue76: QUARANTINED / NOT A QUALIFICATION PASS.' >> "$GITHUB_STEP_SUMMARY"
          echo "Independent diagnostic outcome: $DIAGNOSTIC. This cannot satisfy a required gate." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain sync quarantine diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-sync-quarantine-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dogfood-sync-quarantine.log
            build/DogfoodSyncQuarantine.xcresult
          if-no-files-found: warn

  dogfood-qualification:
    needs: [changes, pin-source, qa-critical-flows, library-popup]
    if: ${{ always() && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require both exact-source Dogfood groups
        env:
          PINNED_SOURCE: ${{ needs.pin-source.outputs.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-dogfood-gate.py --source "$PINNED_SOURCE" --needs-json "$NEEDS_JSON"
      - name: Summarize independent evidence honestly
        if: always()
        env:
          QA_RESULT: ${{ needs.qa-critical-flows.result }}
          LIBRARY_RESULT: ${{ needs.library-popup.result }}
        run: |
          {
            echo '### Dogfood independent group results'
            echo "- Frozen source: ${{ needs.pin-source.outputs.sha }}."
            echo "- QA critical flows (9 cases): $QA_RESULT."
            echo "- Library popup journeys (3 cases): $LIBRARY_RESULT."
            echo '- Unit tests: NOT RUN HERE. Required separately by Compile full-unit gate on the exact candidate head.'
            echo '- Both groups must pass at the same source. QA success alone is not Dogfood qualification.'
            echo '- Splitting lets QA evidence land independently; it does not fix Library failures.'
            echo '- Settings/account-sync issue76: QUARANTINED / NOT A QUALIFICATION PASS. See independent diagnostic job.'
          } >> "$GITHUB_STEP_SUMMARY"

  ci-telemetry:
    name: Export CI timing telemetry
    if: always()
    needs: [dogfood-qualification]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Collect workflow and step timings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-telemetry.py
      - name: Upload CI telemetry report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-telemetry-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ate-ci-telemetry.json
          if-no-files-found: warn
          retention-days: 30

  qualification-result:
    name: Dogfood qualification result
    if: always()
    needs: [changes, dogfood-qualification]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report actual qualification route
        env:
          CLASSIFIER: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.app }}
          NATIVE_RESULT: ${{ needs.dogfood-qualification.result }}
        run: |
          if [[ "$CLASSIFIER" != success ]]; then
            echo 'Scope classifier failed; qualification is NOT established.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$NATIVE" == false ]]; then
            echo 'Documentation-only diff. Mac tests NOT RUN; this is NOT native qualification.' >> "$GITHUB_STEP_SUMMARY"
            [[ "$NATIVE_RESULT" == skipped ]]
          else
            echo "Native qualification required. Mac job result: $NATIVE_RESULT." >> "$GITHUB_STEP_SUMMARY"
            [[ "$NATIVE" == true && "$NATIVE_RESULT" == success ]]
          fi
