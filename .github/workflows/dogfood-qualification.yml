            -only-testing:AteUITests/AteUITests/testJournalRootPrimaryActionAndInsightsRoute \
            -only-testing:AteUITests/CookingTrackerEntryUITests/testInsightsHasDedicatedTabEntryPoint \
            -only-testing:AteUITests/CookingTrackerEntryUITests/testLibraryShortcutOpensInsightsHubRoot \
