name: Dogfood Qualification

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: dogfood-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/classify-native-scope.yml
    permissions:
      contents: read
      pull-requests: read

  dogfood-qualification:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      SCHEME: Ate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-27-dogfood-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-27-dogfood-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            xcode-27-xcode-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project for exact commit
        run: |
          BASE=$(grep -E '^\s*MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          VERSION="$(echo "$BASE" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
          sed -i '' -E "s/^( *MARKETING_VERSION: ).*/\1\"$VERSION\"/; s/^( *CURRENT_PROJECT_VERSION: ).*/\1\"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate
          mkdir -p build
          xcodebuild -version
          echo "Qualification commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      # Python scripts are tested once on the exact candidate head in Compile.
      # Separate merge-ref Python coverage is intentionally removed.

      - name: Select iPhone 18 Pro simulator (iOS 27.0)
        id: select_simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/available-simulators.json
          xcodebuild -project Ate.xcodeproj -scheme "$SCHEME" -showdestinations > /tmp/xcode-destinations.txt 2>&1 || {
            cat /tmp/xcode-destinations.txt
            exit 1
          }
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          if ! grep -Fq "id:$SIM_ID" /tmp/xcode-destinations.txt; then
            echo "ERROR: selected iPhone 18 Pro is not listed as an Ate scheme destination."
            cat /tmp/xcode-destinations.txt
            exit 1
          fi
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b

      # Full AteTests executes once in Compile/build-nutrition on the exact head.
      # This workflow qualifies critical flows only, not the removed unit execution.
      - name: Required critical flows and Library popup journeys
        id: critical_flows
        timeout-minutes: 30
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          # QA1 flow = the exact three cases below; keep in sync with QA1_REQUIRED_CASES
          # in scripts/qa-summary.py and scripts/release/readiness.py.
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteUITests/KeyFlowsQATests/testQA1_AddFromURL_JSONLD \
            -only-testing:AteUITests/KeyFlowsQATests/testQA1_AddFromURL_InstagramCaption \
            -only-testing:AteUITests/KeyFlowsQATests/testQA1_AddFromURL_HiddenCaptionFallback \
            -only-testing:AteUITests/KeyFlowsQATests/testQA2_AddFromPhoto \
            -only-testing:AteUITests/KeyFlowsQATests/testQA3_GenerateAndEdit \
            -only-testing:AteUITests/KeyFlowsQATests/testQA4_Save \
            -only-testing:AteUITests/KeyFlowsQATests/testQA5_Share \
            -only-testing:AteUITests/KeyFlowsQATests/testQA6_OpenShared \
            -only-testing:AteUITests/KeyFlowsQATests/testQA8_Timers \
            -only-testing:AteUITests/AteUITests/test28_GroupSortAndMenus \
            -only-testing:AteUITests/AteUITests/test29_ReorderMyOrder \
            -only-testing:AteUITests/AteUITests/test29b_ReorderMyOrderActions \
            -resultBundlePath build/DogfoodCriticalFlows.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > dogfood-critical-flows.log 2>&1 || { grep -n -B 8 -A 12 -E "error:|failed|XCTAssert|Testing failed|Fatal error" dogfood-critical-flows.log || true; tail -100 dogfood-critical-flows.log; exit 1; }
          total=$(sed -nE 's/^[[:space:]]*Executed ([0-9]+) tests?,.*/\1/p' dogfood-critical-flows.log | tail -1)
          if ! [[ "$total" =~ ^[0-9]+$ ]] || [ "$total" -lt 12 ]; then
            echo "::error::critical flow selection must execute at least twelve tests; got ${total:-missing}"
            exit 1
          fi
          for test in test28_GroupSortAndMenus test29_ReorderMyOrder test29b_ReorderMyOrderActions; do
            grep -qF "AteUITests $test]' passed" dogfood-critical-flows.log || { echo "::error::missing named Library pass: $test"; exit 1; }
          done
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" dogfood-critical-flows.log | tail -50

      - name: Retain selected Group28 startup liveness
        if: always() && steps.critical_flows.outcome != 'skipped' && steps.select_simulator.outputs.id != ''
        env:
          SIM_ID: ${{ steps.select_simulator.outputs.id }}
        run: |
          mkdir -p dogfood-startup-liveness
          date -u '+%Y-%m-%dT%H:%M:%SZ' > dogfood-startup-liveness/copy-utc.txt
          if data_container=$(xcrun simctl get_app_container "$SIM_ID" com.melusik.ate data 2> dogfood-startup-liveness/container-errors.txt); then
            found=0
            for evidence in "$data_container"/Library/Caches/startup-liveness-*.txt; do
              if [ -f "$evidence" ]; then
                cp "$evidence" dogfood-startup-liveness/
                found=1
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo 'No startup samples retained; liveness unverified.' > dogfood-startup-liveness/missing.txt
            fi
          fi

      - name: Retain UI-test photo-import phase diagnostics
        if: always() && steps.critical_flows.outcome != 'skipped' && steps.select_simulator.outputs.id != ''
        env:
          SIM_ID: ${{ steps.select_simulator.outputs.id }}
        run: |
          # Fixed phase names and elapsed milliseconds only, emitted solely with -UITesting.
          # This is collection, not a retry or a qualification outcome.
          xcrun simctl spawn "$SIM_ID" log show --last 60m --style compact --info --debug \
            --predicate 'subsystem == "com.melusik.ate" AND category == "photo-import-phases"' \
            > dogfood-photo-import-phases.log 2>&1 || true

      - name: Diagnose quarantined Settings/account-sync flow (#76)
        id: sync_quarantine
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteUITests/KeyFlowsQATests/testQA7_SyncAccount \
            -resultBundlePath build/DogfoodSyncQuarantine.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            CODE_SIGNING_ALLOWED=NO > dogfood-sync-quarantine.log 2>&1 || { grep -n -B 6 -A 10 -E "error:|failed|XCTAssert|Testing failed" dogfood-sync-quarantine.log || true; tail -80 dogfood-sync-quarantine.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" dogfood-sync-quarantine.log | tail -20

      - name: Summarize qualification and quarantine honestly
        if: always()
        env:
          CRITICAL_FLOWS_OUTCOME: ${{ steps.critical_flows.outcome }}
          SYNC_QUARANTINE_OUTCOME: ${{ steps.sync_quarantine.outcome }}
        run: |
          {
            echo '### Dogfood qualification status'
            echo
            echo "- Commit: \`$(git rev-parse HEAD)\`."
            echo '- Unit tests: NOT RUN HERE. Required separately by Compile/build-nutrition on the exact candidate head.'
            printf '%s\n' "- Critical flows and Library popup journeys: ${CRITICAL_FLOWS_OUTCOME:-unknown}."
            echo '- Required here: seven non-quarantined critical flows plus named Library group/sort/menu and reorder journeys. The full unit suite remains required by Compile.'
            echo '- Settings/account-sync (`testQA7_SyncAccount`, issue #76): **QUARANTINED / NOT A QUALIFICATION PASS**.'
            printf '%s\n' "- Diagnostic execution outcome: ${SYNC_QUARANTINE_OUTCOME:-not run}; this never changes the quarantine status."
            echo '- Full UI shards and backend E2E remain part of deliberate pre-production validation.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload dogfood qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-qualification-${{ github.run_number }}
          path: |
            dogfood-critical-flows.log
            dogfood-startup-liveness
            dogfood-photo-import-phases.log
            dogfood-sync-quarantine.log
            build/DogfoodCriticalFlows.xcresult
            build/DogfoodSyncQuarantine.xcresult
          if-no-files-found: warn


  ci-telemetry:
    name: Export CI timing telemetry
    if: always()
    needs: [dogfood-qualification]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Collect workflow and step timings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-telemetry.py
      - name: Upload CI telemetry report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-telemetry-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ate-ci-telemetry.json
          if-no-files-found: warn
          retention-days: 30

  folded-journeys:
    name: Folded journeys (retired per-issue lanes)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SCHEME: Ate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: build/DerivedData
          key: xcode-27-folded-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-27-folded-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            xcode-27-xcode-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project for exact commit
        run: |
          BASE=$(grep -E '^\s*MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          VERSION="$(echo "$BASE" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
          sed -i '' -E "s/^( *MARKETING_VERSION: ).*/\1\"$VERSION\"/; s/^( *CURRENT_PROJECT_VERSION: ).*/\1\"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate
          mkdir -p build
          xcodebuild -version
          echo "Qualification commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Select iPhone 18 Pro simulator (iOS 27.0)
        id: select_simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/available-simulators.json
          xcodebuild -project Ate.xcodeproj -scheme "$SCHEME" -showdestinations > /tmp/xcode-destinations.txt 2>&1 || {
            cat /tmp/xcode-destinations.txt
            exit 1
          }
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          if ! grep -Fq "id:$SIM_ID" /tmp/xcode-destinations.txt; then
            echo "ERROR: selected iPhone 18 Pro is not listed as an Ate scheme destination."
            cat /tmp/xcode-destinations.txt
            exit 1
          fi
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b

      - name: Build for testing (iOS simulator)
        id: build
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO > build-for-testing.log 2>&1 || { grep -n -B 8 -A 12 -E "error:" build-for-testing.log || true; tail -100 build-for-testing.log; exit 1; }
          grep -E "warning:" build-for-testing.log | sort -u | tail -30 || true

      # Folded group 1 (from retired shopping-edit-undo-qualification.yml): the lane's
      # run, gates, screenshot evidence and budgets below are carried over unchanged.
      - name: Shopping edit/undo UI journeys (#72)
        id: ui_journeys
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          # Clean process so launch arguments are real (same rationale as other UI shards).
          xcrun simctl terminate "$SIM_ID" com.melusik.ate >/dev/null 2>&1 || true
          set +e
          xcodebuild test-without-building -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -derivedDataPath build/DerivedData \
            -only-testing:AteUITests/ShoppingEditUndoUITests \
            -resultBundlePath build/ShoppingEditUndoUITests.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO > shopping-edit-undo-ui.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Shopping edit/undo UI journeys failed (xcodebuild exit $status). Exact diagnostics follow; log and xcresult are uploaded."
            grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Terminating app|Testing failed|Assertion failed" shopping-edit-undo-ui.log || true
            tail -n 100 shopping-edit-undo-ui.log
            exit "$status"
          fi
          # Hard gate: a green selection that ran nothing is a failure, and every named
          # journey must appear with its own pass line in the log.
          # testTimelyUndoRestoreWithinProductionWindow verdict semantics: GREEN proves
          # the production-config (5s window) restore path via a real UI tap - not human
          # usability/responsiveness. A RED journey is INCONCLUSIVE by default: runner
          # "Synthesize event" completion timestamps bound but do not equal the real
          # removal/expiry/delivery instants, so read the raw t= bounds plus visible
          # toast/item state before classifying; an app defect needs app-owned timing
          # corroboration that the tap landed before expiry.
          if grep -q "Executed 0 tests" shopping-edit-undo-ui.log; then echo "::error::shopping edit/undo selection executed 0 tests"; exit 1; fi
          for evidence in \
            "ShoppingEditUndoUITests testEditSaveCancelAndInvalidQuantityJourneys]' passed" \
            "ShoppingEditUndoUITests testBatchUndoRestoresBothRemovalsInOriginalOrder]' passed" \
            "ShoppingEditUndoUITests testTimelyUndoRestoreWithinProductionWindow]' passed" \
            "ShoppingEditUndoUITests testUndoWindowExpiryFinalizesRemoval]' passed"; do
            grep -qF "$evidence" shopping-edit-undo-ui.log || { echo "::error::missing pass evidence: $evidence"; tail -60 shopping-edit-undo-ui.log; exit 1; }
          done
          grep -E "Test Case .* (passed|failed)|Executed" shopping-edit-undo-ui.log | tail -20

      - name: Export journey screenshots
        if: always()
        run: |
          # Export whatever the run produced, success or failure: partial captures are
          # failure diagnostics and the raw xcresult is always retained alongside.
          mkdir -p build/ShoppingEditUndoUIAttachments
          if [ -d build/ShoppingEditUndoUITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ShoppingEditUndoUITests.xcresult --output-path build/ShoppingEditUndoUIAttachments
          fi
          find build/ShoppingEditUndoUIAttachments -type f | sort | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify journey screenshot evidence
        if: always() && steps.ui_journeys.outcome == 'success'
        run: |
          # Hard gate: each of the six named journey screenshots must resolve to a real
          # nonempty PNG on disk. Association: name-matched exported file first, then the
          # xcresult export manifest (humanReadableName -> fileName). Unknown manifest
          # structure, a missing file, or a zero-byte/non-PNG match all fail the run.
          set -euo pipefail
          DIR=build/ShoppingEditUndoUIAttachments
          MANIFEST="$DIR/manifest.json"
          [ -d "$DIR" ] || { echo "::error::attachment export directory missing: $DIR"; exit 1; }
          fail() {
            echo "::error::$1"
            echo "--- exported files ---"
            find "$DIR" -type f -exec ls -l {} + 2>/dev/null || true
            if [ -f "$MANIFEST" ]; then echo "--- manifest.json ---"; head -c 4000 "$MANIFEST"; echo; fi
            exit 1
          }
          png_ok() {
            [ -f "$1" ] && [ -s "$1" ] || return 1
            [ "$(od -An -tx1 -N8 "$1" | tr -d ' \n')" = "89504e470d0a1a0a" ]
          }
          resolve_shot() {
            local shot="$1" f
            f=$(find "$DIR" -type f -name "*${shot}*" | head -n 1)
            if [ -n "$f" ]; then echo "$f"; return 0; fi
            [ -f "$MANIFEST" ] || return 1
            python3 - "$MANIFEST" "$shot" "$DIR" <<'PYMAP'
          import json, os, sys
          manifest, shot, outdir = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              top = json.load(open(manifest))
          except Exception:
              sys.exit(2)
          if not isinstance(top, list):
              sys.exit(2)
          # Observed manifest shape (run 41775045591): a list of payload groups, each with an
          # "attachments" list of {exportedFileName, suggestedHumanReadableName, ...}; suggested
          # names carry an "_0_<uuid>" suffix and extension. Accept a flat list too; anything
          # else fails closed.
          atts = []
          for e in top:
              if not isinstance(e, dict):
                  continue
              inner = e.get("attachments")
              atts.extend(inner) if isinstance(inner, list) else atts.append(e)
          for a in atts:
              if not isinstance(a, dict):
                  continue
              name = a.get("suggestedHumanReadableName") or a.get("humanReadableName") or ""
              fname = a.get("exportedFileName") or a.get("fileName") or a.get("attachedFileName") or ""
              base = name[:-4] if name.lower().endswith(".png") else name
              if (base == shot or base.startswith(shot + "_0_")) and fname:
                  print(os.path.join(outdir, fname))
                  sys.exit(0)
          sys.exit(1)
          PYMAP
          }
          for shot in \
            edit-save-row-renamed \
            edit-invalid-quantity-save-disabled \
            batch-undo-toast-two-items \
            batch-undo-restored-order \
            timely-undo-restored \
            undo-expired-removal-final; do
            set +e
            file=$(resolve_shot "$shot")
            rc=$?
            set -e
            case $rc in
              0) ;;
              1) fail "missing screenshot evidence: $shot" ;;
              *) fail "unrecognised export manifest structure; cannot associate screenshot: $shot" ;;
            esac
            png_ok "$file" || fail "screenshot for $shot is not a nonempty PNG: $file"
            echo "verified $shot -> $file ($(stat -f%z "$file") bytes)"
          done


      # Folded group 2 (from retired shopping-completion-qualification.yml): the UI journey,
      # gates and screenshot evidence carried over unchanged; shares the job's single build.
      # The lane's 3 LogicTests unit selections retire into Compile's full exact-head AteTests
      # suite (approved journal-foundation precedent); unit selections never run in Dogfood.
      - name: Shopping completion UI journey (folded group 2)
        id: journal_journeys
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl terminate "$SIM_ID" com.melusik.ate >/dev/null 2>&1 || true
          set +e
          xcodebuild test-without-building -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -derivedDataPath build/DerivedData \
            -only-testing:AteUITests/ShoppingEditUndoUITests/testProgressShowsBoughtAndMoveAllBackReturnsThemToList \
            -resultBundlePath build/JournalMenuUITests.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO > journal-menu-ui.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Shopping completion journeys failed (xcodebuild exit $status). Log and xcresult are uploaded."
            grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Terminating app|Testing failed|Assertion failed" journal-menu-ui.log || true
            tail -n 100 journal-menu-ui.log
            exit "$status"
          fi
          if grep -q "Executed 0 tests" journal-menu-ui.log; then echo "::error::shopping completion selection executed 0 tests"; exit 1; fi
          for evidence in \
            "ShoppingEditUndoUITests testProgressShowsBoughtAndMoveAllBackReturnsThemToList]' passed"; do
            grep -qF "$evidence" journal-menu-ui.log || { echo "::error::missing pass evidence: $evidence"; tail -60 journal-menu-ui.log; exit 1; }
          done
          grep -E "Test Case .* (passed|failed)|Executed" journal-menu-ui.log | tail -30


      - name: Export journey screenshots (folded group 2)
        if: always()
        run: |
          # Export whatever the runs produced, success or failure: partial captures are
          # failure diagnostics and the raw xcresults are always retained alongside.
          # Each result bundle exports into its OWN directory so a screenshot can only
          # satisfy a gate from the test group that was supposed to capture it.
          mkdir -p build/MenuUIAttachments/journal
          if [ -d build/JournalMenuUITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/JournalMenuUITests.xcresult --output-path build/MenuUIAttachments/journal
          fi
          find build/MenuUIAttachments -type f | sort | tee -a "$GITHUB_STEP_SUMMARY"


      - name: Verify journey screenshot evidence (folded group 2)
        if: always() && steps.journal_journeys.outcome == 'success'
        run: |
          # Hard gate: every named journey screenshot must resolve, INSIDE ITS OWN
          # SCOPE DIRECTORY, to a real decodable PNG with nonzero dimensions.
          # Resolution is manifest-first with EXACT logical-name matching only
          # (base == shot, or the observed "<shot>_0_<uuid>" export suffix) - never
          # substring, so "search-results-menu" can never be satisfied by
          # "search-results-menu-reset". Unknown manifest structure fails closed.
          set -euo pipefail
          ROOT=build/MenuUIAttachments
          fail() {
            echo "::error::$1"
            echo "--- exported files ---"
            find "$ROOT" -type f -exec ls -l {} + 2>/dev/null || true
            for M in "$ROOT"/*/manifest.json; do [ -f "$M" ] && { echo "--- $M ---"; head -c 4000 "$M"; echo; }; done
            exit 1
          }
          png_ok() {
            # Signature alone is not enough (a header-only fixture would pass it):
            # require sips to decode the image and report nonzero dimensions.
            [ -f "$1" ] && [ -s "$1" ] || return 1
            [ "$(od -An -tx1 -N8 "$1" | tr -d ' \n')" = "89504e470d0a1a0a" ] || return 1
            local w h
            w=$(sips -g pixelWidth "$1" 2>/dev/null | awk '/pixelWidth/ {print $2}')
            h=$(sips -g pixelHeight "$1" 2>/dev/null | awk '/pixelHeight/ {print $2}')
            [ "${w:-0}" -gt 0 ] 2>/dev/null && [ "${h:-0}" -gt 0 ] 2>/dev/null
          }
          resolve_shot() {
            # $1 = logical shot name, $2 = scope directory. Manifest-first, exact names only.
            local shot="$1" DIR="$2" MANIFEST="$2/manifest.json" f
            if [ -f "$MANIFEST" ]; then
              python3 - "$MANIFEST" "$shot" "$DIR" <<'PYMAP'
          import json, os, sys
          manifest, shot, outdir = sys.argv[1], sys.argv[2], sys.argv[3]
          real_out = os.path.realpath(outdir)
          def confined(fname):
              # The joined export path must stay inside the scope directory:
              # reject ../ escapes, absolute paths and symlink breakouts.
              try:
                  cand = os.path.realpath(os.path.join(outdir, fname))
              except Exception:
                  return None
              try:
                  if os.path.commonpath([cand, real_out]) != real_out:
                      return None
              except ValueError:
                  return None
              return cand if os.path.isfile(cand) else None
          try:
              top = json.load(open(manifest))
          except Exception:
              sys.exit(2)
          if not isinstance(top, list):
              sys.exit(2)
          # Observed manifest shape (run 41775045591): a list of payload groups, each with an
          # "attachments" list of {exportedFileName, suggestedHumanReadableName, ...}; suggested
          # names carry an "_0_<uuid>" suffix and extension. Accept a flat list too; anything
          # else fails closed.
          atts = []
          for e in top:
              if not isinstance(e, dict):
                  continue
              inner = e.get("attachments")
              atts.extend(inner) if isinstance(inner, list) else atts.append(e)
          for a in atts:
              if not isinstance(a, dict):
                  continue
              name = a.get("suggestedHumanReadableName") or a.get("humanReadableName") or ""
              fname = a.get("exportedFileName") or a.get("fileName") or a.get("attachedFileName") or ""
              base = name[:-4] if name.lower().endswith(".png") else name
              if base == shot or base.startswith(shot + "_0_"):
                  cand = confined(fname) if fname else None
                  if cand:
                      print(cand)
                      sys.exit(0)
                  sys.exit(1)
          sys.exit(1)
          PYMAP
              return $?
            fi
            # No manifest: exact-stem filename fallback only (never substring).
            for f in "$DIR/$shot.png" "$DIR/${shot}_0_"*.png; do
              [ -f "$f" ] && { echo "$f"; return 0; }
            done
            return 1
          }
          verify_scope() {
            local sub="$1"; shift
            [ -d "$ROOT/$sub" ] || fail "attachment export directory missing: $ROOT/$sub"
            local shot file rc
            for shot in "$@"; do
              set +e
              file=$(resolve_shot "$shot" "$ROOT/$sub")
              rc=$?
              set -e
              case $rc in
                0) ;;
                1) fail "missing screenshot evidence: $sub/$shot" ;;
                *) fail "unrecognised export manifest structure; cannot associate screenshot: $sub/$shot" ;;
              esac
              png_ok "$file" || fail "screenshot for $sub/$shot is not a decodable PNG with nonzero dimensions: $file"
              echo "verified $sub/$shot -> $file ($(stat -f%z "$file") bytes)"
            done
          }
          verify_scope journal \
            shopping-progress-one-bought \
            shopping-moved-back-toast


      - name: Record qualification metadata (folded group 2)
        if: always()
        run: |
