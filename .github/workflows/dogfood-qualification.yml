name: Dogfood Qualification

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dogfood-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dogfood-qualification:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SCHEME: Ate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: macos-26-dogfood-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            macos-26-dogfood-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            macos-26-xcode-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project for exact commit
        run: |
          BASE=$(grep -E '^\s*MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          VERSION="$(echo "$BASE" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
          sed -i '' -E "s/^( *MARKETING_VERSION: ).*/\1\"$VERSION\"/; s/^( *CURRENT_PROJECT_VERSION: ).*/\1\"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate
          mkdir -p build
          xcodebuild -version
          echo "Qualification commit: $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: CI telemetry unit tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Select simulator present in Xcode destinations
        id: select_simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/available-simulators.json
          xcodebuild -project Ate.xcodeproj -scheme "$SCHEME" -showdestinations > /tmp/xcode-destinations.txt 2>&1 || {
            cat /tmp/xcode-destinations.txt
            exit 1
          }
          SIM_ID=$(python3 - <<'PY'
          import json, re, sys
          with open('/tmp/available-simulators.json') as f:
              devices = json.load(f)['devices']
          with open('/tmp/xcode-destinations.txt') as f:
              destinations = f.read()
          xcode_ids = set(re.findall(r'id:([A-Fa-f0-9-]{36})', destinations))
          candidates = []
          for runtime, entries in devices.items():
              if 'iOS' not in runtime:
                  continue
              for device in entries:
                  if device.get('isAvailable') and device.get('udid') in xcode_ids:
                      score = (runtime.startswith('iOS-26'), device.get('name') == 'iPhone 17', device.get('name', '').startswith('iPhone'))
                      candidates.append((score, device['udid'], runtime, device.get('name', 'unknown')))
          if not candidates:
              print('ERROR: no available iOS simulator is shared by simctl and xcodebuild destinations.', file=sys.stderr)
              print('Available runtimes/devices:', devices, file=sys.stderr)
              print('Xcode destinations:', destinations, file=sys.stderr)
              raise SystemExit(1)
          candidates.sort(reverse=True)
          _, udid, runtime, name = candidates[0]
          print(f'Selected {name} ({udid}) on {runtime}', file=sys.stderr)
          print(udid)
          PY
          )
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b

      - name: Required unit tests
        id: unit_tests
        timeout-minutes: 20
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteTests -resultBundlePath build/DogfoodUnitTests.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES CODE_SIGNING_ALLOWED=NO > dogfood-unit-tests.log 2>&1 || { grep -n -B 8 -A 12 -E "error:|failed|XCTAssert|Testing failed|Fatal error" dogfood-unit-tests.log || true; tail -100 dogfood-unit-tests.log; exit 1; }
          grep -E "Executed|TEST SUCCEEDED" dogfood-unit-tests.log | tail -5

      - name: Required critical flows (seven stable key flows)
        id: critical_flows
        timeout-minutes: 30
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteUITests/KeyFlowsQATests/testQA1_AddFromURL \
            -only-testing:AteUITests/KeyFlowsQATests/testQA2_AddFromPhoto \
            -only-testing:AteUITests/KeyFlowsQATests/testQA3_GenerateAndEdit \
            -only-testing:AteUITests/KeyFlowsQATests/testQA4_Save \
            -only-testing:AteUITests/KeyFlowsQATests/testQA5_Share \
            -only-testing:AteUITests/KeyFlowsQATests/testQA6_OpenShared \
            -only-testing:AteUITests/KeyFlowsQATests/testQA8_Timers \
            -resultBundlePath build/DogfoodCriticalFlows.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > dogfood-critical-flows.log 2>&1 || { grep -n -B 8 -A 12 -E "error:|failed|XCTAssert|Testing failed|Fatal error" dogfood-critical-flows.log || true; tail -100 dogfood-critical-flows.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" dogfood-critical-flows.log | tail -50

      - name: Diagnose quarantined Settings/account-sync flow (#76)
        id: sync_quarantine
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -only-testing:AteUITests/KeyFlowsQATests/testQA7_SyncAccount \
            -resultBundlePath build/DogfoodSyncQuarantine.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            CODE_SIGNING_ALLOWED=NO > dogfood-sync-quarantine.log 2>&1 || { grep -n -B 6 -A 10 -E "error:|failed|XCTAssert|Testing failed" dogfood-sync-quarantine.log || true; tail -80 dogfood-sync-quarantine.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" dogfood-sync-quarantine.log | tail -20

      - name: Summarize qualification and quarantine honestly
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          CRITICAL_FLOWS_OUTCOME: ${{ steps.critical_flows.outcome }}
          SYNC_QUARANTINE_OUTCOME: ${{ steps.sync_quarantine.outcome }}
        run: |
          {
            echo '### Dogfood qualification status'
            echo
            echo "- Commit: \`$GITHUB_SHA\`."
            printf '%s\n' "- Unit tests: ${UNIT_OUTCOME:-unknown}."
            printf '%s\n' "- Seven critical flows: ${CRITICAL_FLOWS_OUTCOME:-unknown}."
            echo '- Required: `AteTests` unit suite and seven non-quarantined critical flows.'
            echo '- Settings/account-sync (`testQA7_SyncAccount`, issue #76): **QUARANTINED / NOT A QUALIFICATION PASS**.'
            printf '%s\n' "- Diagnostic execution outcome: ${SYNC_QUARANTINE_OUTCOME:-not run}; this never changes the quarantine status."
            echo '- Full UI shards and backend E2E remain part of deliberate pre-production validation.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload dogfood qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-qualification-${{ github.run_number }}
          path: |
            dogfood-unit-tests.log
            dogfood-critical-flows.log
            dogfood-sync-quarantine.log
            build/DogfoodUnitTests.xcresult
            build/DogfoodCriticalFlows.xcresult
            build/DogfoodSyncQuarantine.xcresult
          if-no-files-found: warn


  ci-telemetry:
    name: Export CI timing telemetry
    if: always()
    needs: [dogfood-qualification]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Collect workflow and step timings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-telemetry.py
      - name: Upload CI telemetry report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-telemetry-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ate-ci-telemetry.json
          if-no-files-found: warn
          retention-days: 30
