          # failure diagnostics and the raw xcresults are always retained alongside.
          # Each result bundle exports into its OWN directory so a screenshot can only
          # satisfy a gate from the test group that was supposed to capture it.
          mkdir -p build/MenuUIAttachments/journal-root
          if [ -d build/JournalRootMenuUITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/JournalRootMenuUITests.xcresult --output-path build/MenuUIAttachments/journal-root
          fi
