          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Journal menu journeys failed (xcodebuild exit $status). Log and xcresult are uploaded."
            grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Terminating app|Testing failed|Assertion failed" journal-root-ui.log || true
