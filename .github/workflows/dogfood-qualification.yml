            "AteUITests testTab_AccessoryAndSearchTab]' passed" \
            "AteUITests testTab_TimerAccessoryKeepsAddControlClear]' passed" \
            "AteUITests testJournalRootPrimaryActionAndInsightsRoute]' passed" \
            "CookingTrackerEntryUITests testInsightsHasDedicatedTabEntryPoint]' passed" \
            "CookingTrackerEntryUITests testLibraryShortcutOpensInsightsHubRoot]' passed" \
            "CookingTrackerEntryUITests testMonthNavigationAndFutureMonthRestriction]' passed" \
            "CookingTrackerEntryUITests testSelectingTodayShowsDayDetailsAndExplicitEmptyState]' passed" \
            "InsightsAcceptanceUITests testWeeklyCookingInsightShowsEvidenceAndNavigatesToTracker]' passed" \
            "InsightsAcceptanceUITests testInsightCanBeResolvedAndStaysSuppressedAfterRefresh]' passed" \
            "AteUITests test06_CookMode]' passed" \
            "AteUITests testCookModeExitDoesNotRecordCookingDay]' passed" \
            "AteUITests testCookModeCompletionRecordsCookingDay]' passed"; do
            grep -qF "$evidence" journal-root-ui.log || { echo "::error::missing pass evidence: $evidence"; tail -60 journal-root-ui.log; exit 1; }
          done
          grep -E "Test Case .* (passed|failed)|Executed" journal-root-ui.log | tail -30


      - name: Export journey screenshots (folded group 3)
        if: always()
        run: |
