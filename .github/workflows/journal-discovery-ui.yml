name: Journal discovery UI (#245)

# Exact-head, app-launch verification of the Food Journal access route.
# Kept in its own workflow because compile-check.yml's test selection is shared
# with the in-flight nutrition stack (#239-#241); additive coverage must not
# collide with that file.
permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: journal-discovery-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery-ui:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      # PR validation must build the exact proposed head, not GitHub's synthetic merge commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: xcode-27-homebrew-xcodegen-v1
          restore-keys: |
            xcode-27-homebrew-
      - run: brew install xcodegen && xcodegen generate
      - name: Build for testing (iOS simulator)
        run: |
          set -o pipefail
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          set +e
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Simulator build failed (xcodebuild exit $status). Matching diagnostics and recent log follow:"
            grep -n -B 8 -A 12 -E "error:|failed|Fatal error|Testing failed" build.log || true
            tail -n 100 build.log
            exit "$status"
          fi
          echo "build-for-testing succeeded on $SIM_ID"
      - name: Journal discovery app-launch UI tests
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteUITests/JournalDiscoveryUITests \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/journal-discovery-ui.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > journal-discovery-ui.log 2>&1 || \
            { grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Testing failed" journal-discovery-ui.log || true; tail -120 journal-discovery-ui.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" journal-discovery-ui.log | tail -40
      - name: Mirror embedded screenshots into the step log
        # The UI tests embed every screenshot as chunked base64 (SNAPSHOT-* lines)
        # in the xcodebuild log. Mirroring them into the step log keeps the exact
        # rendered pixels recoverable from the served log alone, on green AND red,
        # without downloading the artifact bundle.
        if: always()
        run: grep -E '^SNAPSHOT-(BEGIN|CHUNK|END)' journal-discovery-ui.log || true
      - name: Surface failure diagnostics in the step log
        # Failure-path retention: the small evidence files must be readable without
        # the artifact zip - full debug descriptions, spindump heads (hang stacks),
        # and the log window around any test-timeout kill.
        if: failure()
        run: |
          grep -n -m1 "exceeded execution time allowance" journal-discovery-ui.log || true
          for f in ui-screenshots/*description*.txt; do
            [ -e "$f" ] || continue; echo "=== $f ==="; cat "$f"
          done
          for f in ui-screenshots/*[Ss]pindump*.txt; do
            [ -e "$f" ] || continue; echo "=== $f (first 120 lines) ==="; head -120 "$f"
          done
      - name: Export rendered screenshots
        if: always()
        run: |
          mkdir -p ui-screenshots/raw
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ate-test-results/journal-discovery-ui.xcresult" --output-path ui-screenshots/raw || true
          python3 - <<'PY'
          import json, os, re, shutil
          raw = "ui-screenshots/raw"
          try:
              man = json.load(open(os.path.join(raw, "manifest.json")))
          except Exception:
              man = []
          for t in man:
              tn = t.get("testIdentifier", "t").split("/")[-1].replace("()", "")
              for a in t.get("attachments", []):
                  n = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  base = n.split("_0_")[0] if "_0_" in n else os.path.splitext(n)[0]
                  # upload-artifact rejects paths containing NTFS-invalid characters
                  # (failure-path names like Debug description for `"X" NavigationBar`
                  # killed the whole upload on run 41283944646) - sanitize every name.
                  base = re.sub('[\\\\"/:*?<>|"\\r\\n]+', "-", base).strip(". ")
                  ext = os.path.splitext(a["exportedFileName"])[1] or ".png"
                  shutil.copy(os.path.join(raw, a["exportedFileName"]), f"ui-screenshots/{tn}__{base}{ext}")
          PY
          ls -la ui-screenshots || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: journal-discovery-ui-${{ github.run_number }}
          path: |
            journal-discovery-ui.log
            ui-screenshots
            ${{ runner.temp }}/ate-test-results/journal-discovery-ui.xcresult
          if-no-files-found: warn
