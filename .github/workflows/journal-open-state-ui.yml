name: Journal open state UI (#245)

# Exact-head, app-launch verification that a non-clean journal open is presented
# honestly (banner + suppressed empty state). Kept in its own workflow because
# compile-check.yml's test selection is shared with the in-flight nutrition stack
# (#239-#241); additive coverage must not collide with that file.
permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: journal-open-state-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/classify-native-scope.yml
    permissions:
      contents: read
      pull-requests: read

  open-state-ui:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      # PR validation must build the exact proposed head, not GitHub's synthetic merge commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Cache Xcode package artifacts and DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-27-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-27-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: xcode-27-homebrew-xcodegen-v1
          restore-keys: |
            xcode-27-homebrew-
      - run: brew install xcodegen && xcodegen generate
      - name: Build for testing (iOS simulator)
        id: build
        run: |
          set -o pipefail
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          set +e
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Simulator build failed (xcodebuild exit $status). Matching diagnostics and recent log follow:"
            grep -n -B 8 -A 12 -E "error:|failed|Fatal error|Testing failed" build.log || true
            tail -n 100 build.log
            exit "$status"
          fi
          echo "build-for-testing succeeded on $SIM_ID"
      - name: Journal open state app-launch UI tests
        if: ${{ success() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          # Diagnostics only: do not prelaunch, warm, erase or otherwise change the simulator.
          mkdir -p launch-diagnostics
          {
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            git rev-parse HEAD
            xcodebuild -version
            xcrun simctl list devices --json
            printf 'SIM_ID=%s\n' "$SIM_ID"
            shasum -a 256 AteUITests/JournalOpenStateUITests.swift
          } > launch-diagnostics/baseline.txt 2>&1
          /usr/bin/log stream --style compact --level info \
            --predicate 'process == "CoreSimulatorService" OR process == "testmanagerd" OR process == "runningboardd" OR process == "installd" OR process == "Ate" OR process == "AteUITests-Runner" OR process == "xcodebuild"' \
            > launch-diagnostics/host-unified.log 2>&1 &
          log_pid=$!
          (
            while true; do
              date -u '+%Y-%m-%dT%H:%M:%SZ'
              ps -axo pid,ppid,etime,state,%cpu,%mem,command | grep -E 'Ate|xcodebuild|CoreSimulator|testmanagerd|installd|launchd_sim' | grep -v grep || true
              sleep 10
            done
          ) > launch-diagnostics/process-timeline.log 2>&1 &
          sample_pid=$!
          cleanup() {
            kill "$log_pid" "$sample_pid" 2>/dev/null || true
            wait "$log_pid" "$sample_pid" 2>/dev/null || true
            { date -u '+%Y-%m-%dT%H:%M:%SZ'; xcrun simctl list devices --json; } \
              > launch-diagnostics/final-state.txt 2>&1 || true
            xcrun simctl spawn "$SIM_ID" log show --last 15m --style compact \
              --predicate 'process == "Ate" OR process == "AteUITests-Runner" OR process == "testmanagerd" OR process == "runningboardd" OR process == "installd" OR process == "SpringBoard"' \
              > launch-diagnostics/simulator-unified.log 2>&1 || true
          }
          trap cleanup EXIT
          # One environment-readiness phase only: never install or launch Ate here.
          python3 - <<'PYREADINESS'
          import datetime, json, os, subprocess, time
          def mark(phase, **fields):
              print(json.dumps(dict(phase=phase, utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                                    monotonic_ns=time.monotonic_ns(), **fields)), flush=True)
          sim = os.environ["SIM_ID"]
          with open("launch-diagnostics/readiness.log", "w", buffering=1) as log:
              def run(args, limit, capture=False):
                  mark("command-start", argv=args, timeout_seconds=limit)
                  try:
                      result = subprocess.run(args, stdout=subprocess.PIPE if capture else log,
                                              stderr=subprocess.STDOUT, text=True, timeout=limit)
                      if capture:
                          log.write(result.stdout)
                  except subprocess.TimeoutExpired:
                      mark("command-timeout", argv=args)
                      raise SystemExit(1)
                  mark("command-end", argv=args, returncode=result.returncode)
                  if result.returncode:
                      raise SystemExit(result.returncode)
                  return result
              mark("simulator-readiness-start", sim_id=sim)
              # Runtime help is retained; unsupported options fail instead of silently skipping readiness.
              run(["xcrun", "simctl", "help", "bootstatus"], 30)
              # Verify identity before boot; bootstatus is the subsequent readiness authority.
              result = run(["xcrun", "simctl", "list", "devices", "available", "-j"], 30, capture=True)
              matches = [(runtime, device) for runtime, devices in json.loads(result.stdout)["devices"].items()
                         for device in devices if device["udid"] == sim]
              if len(matches) != 1:
                  raise SystemExit("Selected simulator identity is no longer unique/available")
              runtime, device = matches[0]
              if runtime.rsplit(".", 1)[-1] != "iOS-27-0" or device["name"] != "iPhone 18 Pro":
                  raise SystemExit("Selected simulator identity/runtime mismatch")
              mark("simulator-identity-verified", sim_id=sim, runtime=runtime, state_before_boot=device["state"])
              run(["xcrun", "simctl", "bootstatus", sim, "-b"], 180)
              mark("simulator-readiness-complete", sim_id=sim, runtime=runtime, authority="bootstatus-return-zero")
              mark("unchanged-four-tests-next")
          PYREADINESS
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteUITests/JournalOpenStateUITests \
            -skip-testing:AteUITests/JournalOpenStateUITests/testManualSaveFailureVisibleAtXXXL \
            -skip-testing:AteUITests/JournalOpenStateUITests/testJournalRootAddAtMaximumAccessibilitySizeAndSidebarRoundTrip \
            -skip-testing:AteUITests/JournalOpenStateUITests/testTimelineFixtureAtLargestTextSizeKeepsRowAndFilterReachable \
            -skip-testing:AteUITests/JournalOpenStateUITests/testTimelineFixtureAtLargestTextSizeLastRowClearsSearchBar \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/journal-open-state-ui.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > journal-open-state-ui.log 2>&1 || \
            { grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Testing failed" journal-open-state-ui.log || true; tail -120 journal-open-state-ui.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED" journal-open-state-ui.log | tail -40
      - name: Qualify dormant reset composition on its exact candidate branch
        if: github.head_ref == 'prep/account-reset-composition'
        run: |
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteTests/ClearAllLocalDataTests \
            -only-testing:AteTests/ClearAllResetCoordinatorTests \
            -only-testing:AteTests/AccountGenerationPolicyTests \
            -only-testing:AteTests/AccountGenerationReceiptStoreTests \
            -only-testing:AteTests/AccountWriterGateTests \
            -only-testing:AteTests/ResetAwareStartupTests \
            -only-testing:AteTests/GenerationFencedSyncTests \
            -only-testing:AteTests/FileResetControlPersistenceTests \
            -only-testing:AteTests/AccountResetCompositionTests \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/reset-composition.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > reset-composition.log 2>&1 || \
            { grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Testing failed" reset-composition.log || true; tail -120 reset-composition.log; exit 1; }
          python3 scripts/verify-reset-composition-results.py reset-composition.log
      - name: Export reset composition attachments
        if: always() && github.head_ref == 'prep/account-reset-composition'
        run: |
          mkdir -p reset-attachments
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ate-test-results/reset-composition.xcresult" --output-path reset-attachments || true
      - name: Export rendered screenshots
        if: always()
        run: |
          mkdir -p ui-screenshots/raw
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ate-test-results/journal-open-state-ui.xcresult" --output-path ui-screenshots/raw || true
          python3 - <<'PY'
          import json, os, re, shutil
          raw = "ui-screenshots/raw"
          # upload-artifact rejects names containing " : < > | * ? CR LF (and a path separator would break the copy).
          # Only the readable COPIES are renamed; every raw attachment stays in ui-screenshots/raw under its exported
          # name, with manifest.json mapping it to its original suggested name.
          unsafe = re.compile(r'[\\"<>:|*?/\r\n]')
          def safe(s):
              return unsafe.sub("_", s)
          try:
              man = json.load(open(os.path.join(raw, "manifest.json")))
          except Exception:
              man = []
          for t in man:
              tn = t.get("testIdentifier", "t").split("/")[-1].replace("()", "")
              for a in t.get("attachments", []):
                  n = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  base = n.split("_0_")[0] if "_0_" in n else os.path.splitext(n)[0]
                  ext = os.path.splitext(a["exportedFileName"])[1] or ".png"
                  dest = f"ui-screenshots/{safe(tn)}__{safe(base)}{safe(ext)}"
                  k = 1
                  while os.path.exists(dest):
                      k += 1
                      dest = f"ui-screenshots/{safe(tn)}__{safe(base)}-{k}{safe(ext)}"
                  shutil.copy(os.path.join(raw, a["exportedFileName"]), dest)
          PY
          ls -la ui-screenshots || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: journal-open-state-ui-${{ github.run_number }}
          path: |
            journal-open-state-ui.log
            reset-composition.log
            reset-attachments
            ${{ runner.temp }}/ate-test-results/reset-composition.xcresult
            launch-diagnostics
            ui-screenshots
            ${{ runner.temp }}/ate-test-results/journal-open-state-ui.xcresult
          if-no-files-found: warn

  qualification-result:
    name: Journal qualification result
    if: always()
    needs: [changes, open-state-ui]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report actual qualification route
        env:
          CLASSIFIER: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.app }}
          NATIVE_RESULT: ${{ needs.open-state-ui.result }}
        run: |
          if [[ "$CLASSIFIER" != success ]]; then
            echo 'Scope classifier failed; qualification is NOT established.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$NATIVE" == false ]]; then
            echo 'Documentation-only diff. Mac tests NOT RUN; this is NOT native qualification.' >> "$GITHUB_STEP_SUMMARY"
            [[ "$NATIVE_RESULT" == skipped ]]
          else
            echo "Native qualification required. Mac job result: $NATIVE_RESULT." >> "$GITHUB_STEP_SUMMARY"
            [[ "$NATIVE" == true && "$NATIVE_RESULT" == success ]]
          fi
