name: Label pull requests

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  apply-type-labels:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels from PR type checklist
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const body = (context.payload.pull_request.body || "");
            const typeLabels = ["bug", "enhancement", "testing", "ci", "maintenance", "research", "documentation", "release"];
            const sectionMatch = body.match(/## Type of change([\s\S]*?)(?=\n## |$)/i);
            const section = sectionMatch ? sectionMatch[1] : "";
            const options = [
              ["Bug fix", "bug"],
              ["User-facing feature or improvement", "enhancement"],
              ["Tests or regression coverage", "testing"],
              ["CI or build pipeline", "ci"],
              ["Refactor, dependency, or codebase maintenance", "maintenance"],
              ["Investigation or technical research", "research"],
              ["Documentation", "documentation"],
              ["Release or release-readiness work", "release"],
            ];
            const selected = new Set();
            for (const [label, type] of options) {
              const checked = section.split(/\r?\n/).some(line => /^\s*-\s*\[x\]\s*/i.test(line) && line.toLowerCase().includes(label.toLowerCase()));
              if (checked) selected.add(type);
            }
            const current = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number });
            const names = new Set(current.data.map(label => label.name));
            if (selected.size === 0) {
              if (!names.has("triage")) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ["triage"] });
              core.warning("No PR type selected; added triage label.");
              return;
            }
            for (const name of typeLabels) {
              if (names.has(name) && !selected.has(name)) await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
            }
            const missing = [...selected].filter(name => !names.has(name));
            if (missing.length) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: missing });
            if (names.has("triage")) await github.rest.issues.removeLabel({ owner, repo, issue_number, name: "triage" });
            core.info("Applied PR type labels: " + [...selected].join(", "));

  apply-classification-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Apply feature area, release gate, and priority labels
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const body = context.payload.pull_request?.body || context.payload.issue?.body || "";
            const isPR = context.eventName === "pull_request";
            const areas = {
              "Recipe creation and quality": "area:recipes",
              "Library and discovery": "area:library-discovery",
              "Cooking, timers and widgets": "area:cooking-timers-widgets",
              "Accessibility and navigation": "area:accessibility-navigation",
              "Health and journal": "area:health-journal",
              "Shopping List and Settings": "area:shopping-settings",
              "Sharing, security and reliability": "area:sharing-security-reliability",
              "Future platform work": "area:future-platforms",
              "Product infrastructure and delivery": "area:product-infrastructure"
            };
            const gates = {
              "Pilot": "gate:pilot",
              "Public launch": "gate:public-launch",
              "No committed release gate": "gate:uncommitted"
            };
            const priorities = { "P0": "priority:p0", "P1": "priority:p1", "P2": "priority:p2", "P3": "priority:p3" };
            const fieldValue = (heading) => {
              const lines = body.split(/\r?\n/);
              const start = lines.findIndex(line => line.trim().replace(/^#{1,4}\s*/, "").toLowerCase() === heading.toLowerCase());
              if (start < 0) return "";
              const section = [];
              for (let i = start + 1; i < lines.length; i++) {
                if (/^#{1,4}\s/.test(lines[i].trim())) break;
                section.push(lines[i]);
              }
              const checked = section.map(line => line.match(/^\s*-\s*\[x\]\s*(.+)$/i)).find(Boolean);
              if (checked) return checked[1].trim();
              if (isPR) return "";
              return section.map(s => s.trim()).find(s => s && !s.startsWith("<!--") && !s.startsWith("- [ ]")) || "";
            };
            const selectedArea = fieldValue("Feature area");
            const selectedGate = fieldValue("Release gate");
            const selectedPriority = fieldValue("Priority").toUpperCase().slice(0, 2);
            const desired = [areas[selectedArea], gates[selectedGate], priorities[selectedPriority]].filter(Boolean);
            const managedPrefixes = ["area:", "gate:", "priority:"];
            const colors = { area: "1D76DB", gate: "0E8A16", priority: "D93F0B" };
            const descriptions = {
              "area:": "Product feature area",
              "gate:": "Release commitment gate; not a status or acceptance claim",
              "priority:": "Delivery priority, independent of release gate"
            };
            const current = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number });
            const currentNames = new Set(current.data.map(x => x.name));
            for (const name of desired) {
              if (!currentNames.has(name)) {
                const prefix = managedPrefixes.find(p => name.startsWith(p));
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name, color: colors[prefix.slice(0, -1)],
                    description: descriptions[prefix]
                  });
                } catch (error) {
                  if (error.status !== 422) throw error;
                }
              }
            }
            const refreshed = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number });
            const existing = new Set(refreshed.data.map(x => x.name));
            if (desired.length !== 3) {
              core.warning("Classification incomplete. Choose one Feature area, Release gate, and Priority; existing classification labels were left unchanged.");
              return;
            }
            for (const label of refreshed.data) {
              if (managedPrefixes.some(p => label.name.startsWith(p)) && !desired.includes(label.name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label.name });
              }
            }
            const missing = desired.filter(name => !existing.has(name));
            if (missing.length) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: missing });
            core.info("Applied classification labels: " + desired.join(", "));
