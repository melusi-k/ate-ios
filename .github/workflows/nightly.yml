name: Nightly QA

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache Playwright browser binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-playwright-chromium-${{ hashFiles('scripts/e2e/*.py') }}
          restore-keys: |
            ubuntu-playwright-chromium-

      - name: Install Playwright
        run: pip install -q playwright && python -m playwright install --with-deps chromium
      - name: Run backend-e2e
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          S=0
          python scripts/e2e/backend_e2e.py --upload --build "nightly $(date -u +%F)" || S=$?
          cat build/e2e/summary.md >> "$GITHUB_STEP_SUMMARY"; exit $S
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-backend-e2e
          path: build/e2e

  qa-gate:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-26-homebrew-xcodegen-v1
          restore-keys: |
            macos-26-homebrew-
      - run: brew install xcodegen && xcodegen generate
      - name: Unit tests + QA gate (KeyFlowsQATests)
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(k,x) for k,v in d.items() if "iOS-26" in k for x in v if x["name"]=="iPhone 17"]
          c=c or [(k,x) for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"])')
          xcrun simctl boot "$SIM_ID" || true; xcrun simctl bootstatus "$SIM_ID" -b
          set -o pipefail
          xcodebuild test -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteTests -only-testing:AteUITests/KeyFlowsQATests -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee qa.log | grep --line-buffered -E "Test Case .*(passed|failed)|error:|Executed"
          python3 scripts/qa-summary.py qa.log >> "$GITHUB_STEP_SUMMARY" || true
