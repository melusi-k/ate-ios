name: Nutrition 179 diary + journal foundation native qualification

on:
  push:
    branches: [feat/issue-179-diary-edit-weekly]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nutrition-179-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nutrition-179-foundation:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Record exact source and toolchain
        run: |
          mkdir -p build/nutrition-179-foundation
          git rev-parse HEAD | tee build/nutrition-179-foundation/head.txt
          git status --porcelain > build/nutrition-179-foundation/worktree.txt
          xcodebuild -version | tee build/nutrition-179-foundation/xcode.txt
          find Ate AteTests -name '*.swift' -print0 | xargs -0 shasum -a 256 > build/nutrition-179-foundation/source-sha256.txt
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and run 47 foundation + 21 nutrition diary fixtures with complete concurrency checking
        run: |
          set -o pipefail
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          printf '%s\n' "$SIM_ID" > build/nutrition-179-foundation/simulator.txt
          xcodebuild test -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteTests/FoodJournalStoreTests \
            -only-testing:AteTests/FoodJournalCoordinatorTests \
            -only-testing:AteTests/JournalArchiveTests \
            -only-testing:AteTests/JournalTimelineOrderTests \
            -only-testing:AteTests/LegacyDiaryRepairTests \
            -only-testing:AteTests/CanonicalNutritionDiaryTests \
            -only-testing:AteTests/NutritionRecipeAssociationTests \
            -resultBundlePath build/nutrition-179-foundation/Nutrition179Foundation.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            SWIFT_STRICT_CONCURRENCY=complete CODE_SIGNING_ALLOWED=NO \
            > build/nutrition-179-foundation/native.log 2>&1 || { tail -160 build/nutrition-179-foundation/native.log; exit 1; }
          grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED|warning:.*(concurr|Sendable|actor)" build/nutrition-179-foundation/native.log || true
      - name: Require every named pure fixture pass
        run: |
          set -euo pipefail
          ! grep -Eq "Executed 0 tests|Test Case .* failed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testMealRoundTripsEveryFieldVerbatim' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testSavedMealIsOneJournalEntryWithMealKind' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testExistingReflectionDefaultsToReflectionKind' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testDayKeyPreservedVerbatimNotRecomputed' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testTotalsAreIdenticalToLegacyCalculation' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testSaveRejectsInvalidEntry' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testSaveRejectsDuplicateIdentity' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testUpdateKeepsIdentityAndOriginalDay' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testDeleteRemovesEntryAndPayloadTogether' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testMigrationImportsPopulatedLegacyStoreVerbatim' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testMigrationBacksUpPayloadBeforeRetiringLegacyKey' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testMigrationIsIdempotentAcrossRunsAndRecovery' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testMigrationLeavesUnreadableLegacyUntouched' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testMigrationPreservesMalformedRecordsAndReportsHonestly' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testMigrationFailsWithoutRetiringWhenBackupCannotBeWritten' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testMigrationWithNoLegacyDiary' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testJournalStorePersistsMealsAcrossReopen' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testCorruptJournalStoreIsMovedAsideAndReplacesItself' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testThrowingReadRejectsUnavailableInsteadOfReportingEmpty' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testConflictingIdentityPreservesLegacyAndUnifiedPayload' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testBatchInvalidInputDoesNotLeavePendingRows' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testIsolatedSaveFailureLeavesUnrelatedMainContextEditPending' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testMigrationThenCreateUpdateDeletePreservesIdentityAndHistoricalDay' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testOrphanPayloadIsUnreadableAndCannotTriggerLegacyRetirement' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testFallbackCannotImportOrRetireDurableLegacy' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testDuplicateLegacyIdentityDoesNotImportEitherCopy' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testEveryCanonicalWriterRejectsInvalidDayBeforeAnyMutation' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalStoreTests.testMigrationRejectsMalformedDayBeforeCopyAndKeepsLegacyBytes' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalCoordinatorTests.testMigrateThenReadSaveEditDeleteWithoutRecreatingLegacyKey' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalCoordinatorTests.testInvalidLegacyFailsAllCanonicalActionsAndPreservesOriginalBytes' passed" build/nutrition-179-foundation/native.log
          grep -F -- "FoodJournalCoordinatorTests.testDecodableInvalidLegacyHasTypedFailureThenRepairRetriesWithoutCachedFailure' passed" build/nutrition-179-foundation/native.log
          grep -F -- "JournalArchiveTests.testRawFieldsAndActualMediaBytesRoundTripWithoutNormalization' passed" build/nutrition-179-foundation/native.log
          grep -F -- "JournalArchiveTests.testMissingMediaAndUnsafeBasenamesFailValidation' passed" build/nutrition-179-foundation/native.log
          grep -F -- "JournalArchiveTests.testDuplicateIdentityAndMediaLimitFailBeforeRestore' passed" build/nutrition-179-foundation/native.log
          grep -F -- "JournalArchiveTests.testMealKindCannotOmitStructuredPayload' passed" build/nutrition-179-foundation/native.log
          grep -F -- "JournalArchiveTests.testCoordinatesAndFutureArchiveVersionAreRejected' passed" build/nutrition-179-foundation/native.log
          grep -F -- "JournalArchiveTests.testCaptureRejectsEveryIncompleteOpenState' passed" build/nutrition-179-foundation/native.log
          grep -F -- "JournalArchiveTests.testCaptureReadsMediaAndRawReflectionFromIsolatedStore' passed" build/nutrition-179-foundation/native.log
          grep -F -- "JournalArchiveTests.testMediaHashMismatchFailsValidation' passed" build/nutrition-179-foundation/native.log
          grep -F -- "JournalArchiveTests.testCaptureRefusesOrphanMealPayload' passed" build/nutrition-179-foundation/native.log
          grep -F -- "JournalArchiveTests.testCaptureOrdersOutOfOrderEntriesByCreatedAtAscending' passed" build/nutrition-179-foundation/native.log
          grep -F -- "JournalTimelineOrderTests.testEntriesRemainNewestFirstWhenInsertedOutOfOrder' passed" build/nutrition-179-foundation/native.log
          grep -F -- "LegacyDiaryRepairTests.testRepairPreservesBackupAndUntouchedRowsAndRejectsStaleSnapshot' passed" build/nutrition-179-foundation/native.log
          grep -F -- "LegacyDiaryRepairTests.testDuplicateIdentityCanBeRemovedByRowIndexWithoutDroppingBoth' passed" build/nutrition-179-foundation/native.log
          grep -F -- "LegacyDiaryRepairTests.testInvalidDayReplacementDoesNotWriteOrMigratePoisonedRow' passed" build/nutrition-179-foundation/native.log
          grep -F -- "LegacyDiaryRepairTests.testUndecodableAndBackupFailurePreserveSourceBytes' passed" build/nutrition-179-foundation/native.log
          grep -F -- "LegacyDiaryRepairTests.testExplicitUndecodableRecoveryBacksUpExactBytesBeforeResetAndRefusesReadableData' passed" build/nutrition-179-foundation/native.log
          grep -F -- "CanonicalNutritionDiaryTests.testAddUpdateDeleteReloadsFromCanonicalStore' passed" build/nutrition-179-foundation/native.log
          grep -F -- "CanonicalNutritionDiaryTests.testEditPreservesIdentityInstantAndUnknownNutrients' passed" build/nutrition-179-foundation/native.log
          grep -F -- "CanonicalNutritionDiaryTests.testDeliberateDayMoveChangesOnlyDayKey' passed" build/nutrition-179-foundation/native.log
          grep -F -- "CanonicalNutritionDiaryTests.testDraftValidationFailuresAreTypedAndKeepTheDraftIntact' passed" build/nutrition-179-foundation/native.log
          grep -F -- "CanonicalNutritionDiaryTests.testBlockedInvalidLegacyRoutesToRepairThenRepairAndRetryRecovers' passed" build/nutrition-179-foundation/native.log
          grep -F -- "CanonicalNutritionDiaryTests.testUndecodableLegacyRoutesToRepairResetThenRetryRecovers' passed" build/nutrition-179-foundation/native.log
          grep -F -- "CanonicalNutritionDiaryTests.testClassificationMatchesActualLegacyContent' passed" build/nutrition-179-foundation/native.log
          grep -F -- "CanonicalNutritionDiaryTests.testValidLegacyEnvironmentalBackupFailureRoutesToRetryAndRecoversIdempotently' passed" build/nutrition-179-foundation/native.log
          grep -F -- "CanonicalNutritionDiaryTests.testJournalOpenStateIsExposedForHonestPresentation' passed" build/nutrition-179-foundation/native.log
          grep -F -- "CanonicalNutritionDiaryTests.testWeekScopingIsHalfOpenAndKeepsUnknownTotalsUnavailable' passed" build/nutrition-179-foundation/native.log
          grep -F -- "CanonicalNutritionDiaryTests.testBlockedLegacyLeavesCanonicalStoreUnwrittenAcrossAllMutations' passed" build/nutrition-179-foundation/native.log
          grep -F -- "NutritionRecipeAssociationTests.testLinkRoundTripsAcrossStoreInstances' passed" build/nutrition-179-foundation/native.log
          grep -F -- "NutritionRecipeAssociationTests.testLinkKeepsRecipeNameSnapshotIndependentOfLaterRecipeChanges' passed" build/nutrition-179-foundation/native.log
          grep -F -- "NutritionRecipeAssociationTests.testRelinkReplacesPreviousLinkForSameEntryOnly' passed" build/nutrition-179-foundation/native.log
          grep -F -- "NutritionRecipeAssociationTests.testDissociateRemovesOnlyThatEntryLink' passed" build/nutrition-179-foundation/native.log
          grep -F -- "NutritionRecipeAssociationTests.testCorruptLinkStoreReportsUnavailableAndRefusesOverwrite' passed" build/nutrition-179-foundation/native.log
          grep -F -- "NutritionRecipeAssociationTests.testPruneOrphansKeepsOnlyLiveEntries' passed" build/nutrition-179-foundation/native.log
          grep -F -- "NutritionRecipeAssociationTests.testFrequentFoodsCountsLocalEntriesAndPrefersMostRecentValues' passed" build/nutrition-179-foundation/native.log
          grep -F -- "NutritionRecipeAssociationTests.testFrequentDraftNeverCarriesVerificationOrExternalProvenance' passed" build/nutrition-179-foundation/native.log
          grep -F -- "NutritionRecipeAssociationTests.testControllerLinksEntryAndDeleteDropsLinkWhileDiaryKeepsWorking' passed" build/nutrition-179-foundation/native.log
          grep -F -- "NutritionRecipeAssociationTests.testControllerReloadNeverPrunesLinksAgainstPossiblyPartialEntrySet' passed" build/nutrition-179-foundation/native.log
      - name: Run real canonical nutrition UI journeys (DEBUG hermetic route only)
        run: |
          set -euo pipefail
          SIM_ID=$(cat build/nutrition-179-foundation/simulator.txt)
          xcodebuild test -project Ate.xcodeproj -scheme Ate -configuration Debug -destination "id=$SIM_ID" \
            -only-testing:AteUITests/CanonicalNutritionAssociationUITests \
            -resultBundlePath build/nutrition-179-foundation/Nutrition179UI.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 \
            SWIFT_STRICT_CONCURRENCY=complete CODE_SIGNING_ALLOWED=NO \
            > build/nutrition-179-foundation/ui.log 2>&1 || { tail -160 build/nutrition-179-foundation/ui.log; exit 1; }
          grep -F -- "CanonicalNutritionAssociationUITests.testLinkSnapshotThenUnlinkKeepsEntryValues' passed" build/nutrition-179-foundation/ui.log
          grep -F -- "CanonicalNutritionAssociationUITests.testCorruptLinksAreUnavailableWhileEntryRemainsReadable' passed" build/nutrition-179-foundation/ui.log
          grep -F -- "CanonicalNutritionAssociationUITests.testFrequentPrefillValidationFailureRetainsDraftAndPriorProvenance' passed" build/nutrition-179-foundation/ui.log
          python3 scripts/validate-nutrition-179-captures.py build/nutrition-179-foundation/ui.log build/nutrition-179-foundation/captures
      - name: Retain native evidence including failed build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nutrition-179-foundation-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/nutrition-179-foundation/
          if-no-files-found: error
          retention-days: 14
