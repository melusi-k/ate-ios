name: Nutrition failed-save single journey (manual)

# Reviewer dispatches the exact reviewed branch head once. No automatic checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nutrition-failed-save-single:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      ATE_SIGN_STYLE: Automatic
      EXPECTED_HEAD: ${{ github.sha }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Require first attempt and exact dispatch source
        run: |
          set -euo pipefail
          mkdir -p build/nutrition-failed-save-single
          test "$RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD | tee build/nutrition-failed-save-single/head.txt
          git status --porcelain > build/nutrition-failed-save-single/worktree.txt
          test ! -s build/nutrition-failed-save-single/worktree.txt
          shasum -a 256 AteUITests/NutritionDiaryUITests.swift scripts/select-ios-simulator.py > build/nutrition-failed-save-single/source-sha256.txt
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Generate existing project
        run: brew install xcodegen && xcodegen generate
      - name: Build matching source for testing
        timeout-minutes: 30
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          xcodebuild -version | tee build/nutrition-failed-save-single/xcode.txt
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          printf '%s\n' "$SIM_ID" > build/nutrition-failed-save-single/simulator.txt
          xcrun simctl list devices available -j > build/nutrition-failed-save-single/devices.json
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -resultBundlePath build/nutrition-failed-save-single/build.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/nutrition-failed-save-single/build.log
      - name: Run exactly one failed-save cancel relaunch journey
        timeout-minutes: 15
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          xcrun simctl terminate "$SIM_ID" com.melusik.ate || true
          NSUnbufferedIO=YES xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteUITests/NutritionDiaryUITests/testCancelledFailedSavesLeaveDiaryEmptyAfterRelaunch \
            -resultBundlePath build/nutrition-failed-save-single/journey.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | python3 -u scripts/stream-ui-test-progress.py --selection nutrition-failed-save-single --log build/nutrition-failed-save-single/journey.log
          python3 - <<'PYVERIFY'
          import pathlib, re
          text = pathlib.Path('build/nutrition-failed-save-single/journey.log').read_text()
          target = 'NutritionDiaryUITests testCancelledFailedSavesLeaveDiaryEmptyAfterRelaunch'
          rows = re.findall(r"Test Case '-\[(?:[^\s\]]+\.)?([^\]]+)\]' (started\.|passed \([0-9.]+ seconds\)\.|failed[^\n]*)", text)
          assert len(rows) == 2 and rows[0] == (target, 'started.'), rows
          assert rows[1][0] == target, rows
          passed = re.fullmatch(r'passed \(([0-9.]+) seconds\)\.', rows[1][1])
          assert passed and float(passed[1]) > 0, rows
          lines = [line.strip() for line in text.splitlines()]
          assert sum(line in {'** TEST SUCCEEDED **', '** TEST EXECUTE SUCCEEDED **'} for line in lines) == 1
          assert not any(line in {'** TEST FAILED **', '** TEST EXECUTE FAILED **'} for line in lines)
          assert not re.search(r'Executed 0 tests|exceeded execution time allowance|Restarting after unexpected exit|Test Case .* failed', text, re.I)
          print('Verified exactly one named nonzero pass, no repeated start or watchdog acceptance')
          PYVERIFY
      - name: Export native evidence on every outcome
        if: always()
        run: |
          mkdir -p build/nutrition-failed-save-single/attachments
          xcrun xcresulttool export attachments --path build/nutrition-failed-save-single/journey.xcresult --output-path build/nutrition-failed-save-single/attachments || true
          xcrun xcresulttool get test-results tests --path build/nutrition-failed-save-single/journey.xcresult > build/nutrition-failed-save-single/tests.json || true
          if [ -n "${SIM_ID:-}" ]; then
            xcrun simctl spawn "$SIM_ID" log show --last 15m --style compact --predicate 'process == "Ate" OR process == "AteUITests-Runner" OR process == "testmanagerd"' > build/nutrition-failed-save-single/simulator-unified.log 2>&1 || true
          fi
      - name: Retain matching build and single-journey results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nutrition-failed-save-single-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/nutrition-failed-save-single/
          if-no-files-found: error
          retention-days: 14
