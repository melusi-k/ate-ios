name: Optional Dynamic Type coverage

# Owner-descoped from PR gates. Retained unchanged tests run only on deliberate request.
# This workflow is not a required check and is never dispatched by the bundle refresh.
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  optional-dynamic-type:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      # PR validation must build the exact proposed head, not GitHub's synthetic merge commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: xcode-27-homebrew-xcodegen-v1
          restore-keys: |
            xcode-27-homebrew-
      - run: brew install xcodegen && xcodegen generate
      - name: Build for testing (iOS simulator)
        id: build
        run: |
          set -o pipefail
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          set +e
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Simulator build failed (xcodebuild exit $status). Matching diagnostics and recent log follow:"
            grep -n -B 8 -A 12 -E "error:|failed|Fatal error|Testing failed" build.log || true
            tail -n 100 build.log
            exit "$status"
          fi
          echo "build-for-testing succeeded on $SIM_ID"
      - name: Run retained optional Dynamic Type coverage
        if: ${{ success() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ate-test-results"
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteUITests/JournalOpenStateUITests/testManualSaveFailureVisibleAtXXXL \
            -only-testing:AteUITests/JournalOpenStateUITests/testJournalRootAddAtMaximumAccessibilitySizeAndSidebarRoundTrip \
            -only-testing:AteUITests/JournalOpenStateUITests/testTimelineFixtureAtLargestTextSizeKeepsRowAndFilterReachable \
            -only-testing:AteUITests/JournalOpenStateUITests/testTimelineFixtureAtLargestTextSizeLastRowClearsSearchBar \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/optional-dynamic-type.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > optional-dynamic-type.log 2>&1
          if grep -q "Executed 0 tests" optional-dynamic-type.log; then echo "::error::optional coverage executed 0 tests"; exit 1; fi
          grep -qF "JournalOpenStateUITests testManualSaveFailureVisibleAtXXXL]' passed" optional-dynamic-type.log || { echo "::error::missing optional case pass: JournalOpenStateUITests/testManualSaveFailureVisibleAtXXXL"; exit 1; }
          grep -qF "JournalOpenStateUITests testJournalRootAddAtMaximumAccessibilitySizeAndSidebarRoundTrip]' passed" optional-dynamic-type.log || { echo "::error::missing optional case pass: JournalOpenStateUITests/testJournalRootAddAtMaximumAccessibilitySizeAndSidebarRoundTrip"; exit 1; }
          grep -qF "JournalOpenStateUITests testTimelineFixtureAtLargestTextSizeKeepsRowAndFilterReachable]' passed" optional-dynamic-type.log || { echo "::error::missing optional case pass: JournalOpenStateUITests/testTimelineFixtureAtLargestTextSizeKeepsRowAndFilterReachable"; exit 1; }
          grep -qF "JournalOpenStateUITests testTimelineFixtureAtLargestTextSizeLastRowClearsSearchBar]' passed" optional-dynamic-type.log || { echo "::error::missing optional case pass: JournalOpenStateUITests/testTimelineFixtureAtLargestTextSizeLastRowClearsSearchBar"; exit 1; }
      - name: Export retained optional evidence
        if: always()
        run: |
          mkdir -p optional-dynamic-type-attachments
          if [ -d "$RUNNER_TEMP/ate-test-results/optional-dynamic-type.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ate-test-results/optional-dynamic-type.xcresult" --output-path optional-dynamic-type-attachments
          fi
      - name: Upload optional evidence on every outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: optional-dynamic-type-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            optional-dynamic-type.log
            optional-dynamic-type-attachments
            ${{ runner.temp }}/ate-test-results/optional-dynamic-type.xcresult
