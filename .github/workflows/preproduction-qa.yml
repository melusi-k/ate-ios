name: Pre-production QA

# Deliberate release-candidate gate: run the full retained unit and UI test suites.
permissions:
  contents: read
  pull-requests: read
  issues: write

on:
  workflow_dispatch:
  push:
    tags: ["preproduction-*"]

concurrency:
  group: preproduction-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ATE_SIGN_STYLE: Automatic
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: macos-26-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            macos-26-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            macos-26-xcode-deriveddata-
      - name: Validate docs IDs and generated checklist consistency
        run: python3 scripts/check-ids.py
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-26-homebrew-xcodegen-v1
          restore-keys: |
            macos-26-homebrew-
      - run: brew install xcodegen && xcodegen generate
      - name: Prepare diagnostics directory
        run: mkdir -p "$RUNNER_TEMP/ate-test-results"
      - name: Build for testing (iOS simulator)
        id: build
        run: |
          set -o pipefail
          STEP_START=$(date +%s)
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"

          set +e
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" -resultBundlePath "$RUNNER_TEMP/ate-test-results/build.xcresult" CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          set -e
          STEP_END=$(date +%s)
          echo "::notice::CI_TIMING step=build-for-testing duration_seconds=$((STEP_END-STEP_START)) exit_code=$status"

          if [ "$status" -ne 0 ]; then
            echo "::error::Simulator build failed (xcodebuild exit $status). Matching diagnostics and recent log follow:"
            grep -n -B 8 -A 12 -E "error:|warning:|failed|Fatal error|Testing failed" build.log || true
            echo "::group::Last 100 build log lines"
            tail -n 100 build.log
            echo "::endgroup::"
            exit "$status"
          fi

          grep -E "warning: .*(Widgets|Intents|Snapshot)" build.log > build-warnings.log || true
          tail -n 30 build-warnings.log || true
      - name: Unit tests (non-blocking during feature implementation)
        run: |
          STEP_START=$(date +%s)
          set +e
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" -resultBundlePath "$RUNNER_TEMP/ate-test-results/unit-tests.xcresult" -only-testing:AteTests -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 240 CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          set -e
          STEP_END=$(date +%s)
          echo "::notice::CI_TIMING step=unit-tests duration_seconds=$((STEP_END-STEP_START)) exit_code=$status"

          if [ "$status" -ne 0 ]; then
            echo "::error::Unit tests failed (xcodebuild exit $status). Failure diagnostics follow; the complete test.log and xcresult are uploaded as artifacts."
            grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Terminating app|Testing failed|Assertion failed" test.log || true
            echo "::group::Last 100 unit-test log lines"
            tail -n 100 test.log
            echo "::endgroup::"
            exit "$status"
          fi

          # A successful xcodebuild exit is insufficient if XCTest discovered no tests.
          if ! grep -Eq 'Executed [1-9][0-9]* tests?' test.log; then
            echo "::error::Unit-test run did not report executing any tests; this is NOT a pass."
            tail -n 100 test.log
            exit 1
          fi
          grep -E "Executed|Test Suite .* (passed|failed)" test.log > test-summary.log || true
          tail -n 30 test-summary.log
      - name: Settings-tab key-flow regression test
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          STEP_START=$(date +%s)
          set -e
          run_focused_test() {
            test_id="$1"
            log_file="$2"
            result_name="$3"
            # XCUITest can leave the app process alive after a prior suite. Force a
            # clean process before each channel case so its launch arguments are real.
            xcrun simctl terminate "$SIM_ID" com.melusik.ate >/dev/null 2>&1 || true
            set +e
            xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
              -resultBundlePath "$RUNNER_TEMP/ate-test-results/$result_name.xcresult" \
              "-only-testing:$test_id" -parallel-testing-enabled NO -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
              CODE_SIGNING_ALLOWED=NO > "$log_file" 2>&1
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "::error::$test_id failed (xcodebuild exit $status). Full log and xcresult are uploaded."
              grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Terminating app|Testing failed|Assertion failed" "$log_file" || true
              tail -n 100 "$log_file" || true
              return "$status"
            fi
            grep -E "Test Case .* (passed|failed)|Executed|Test Suite .* (passed|failed)" "$log_file" | tail -n 30
          }
          run_focused_test "AteUITests/KeyFlowsQATests/testQA7_SyncAccount" "settings-sync.log" "settings-sync" || exit $?
          # QUARANTINED, not passed: retained in source while launch-channel fixture is corrected.
          {
            echo "### Quarantined test — NOT RUN / NOT PASSED"
            echo
            echo "- Test: AteUITests/ProductionChannelUITests/testBetaChannelShowsBetaDiagnosticsEntry"
            echo "- Reason: beta launch-channel argument is not applied deterministically in the current CI harness; result cannot reliably distinguish product behavior from test setup."
            echo "- Owner: iOS QA/automation maintainer"
            echo "- Exit condition: deterministic launch-channel fixture is implemented and this test passes repeatedly in pre-production."
            echo "- Required action: preserve the test; do not count this quarantine as coverage or a pass."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::warning::QUARANTINED testBetaChannelShowsBetaDiagnosticsEntry — not run, not passed; owner: iOS QA/automation maintainer; exit condition: deterministic launch-channel fixture and repeated passing runs."
          run_focused_test "AteUITests/ProductionChannelUITests/testProductionChannelHidesBetaDiagnostics" "production-channel-production.log" "production-channel-production" || exit $?
          STEP_END=$(date +%s)
          echo "::notice::CI_TIMING step=settings-tab-key-flow duration_seconds=$((STEP_END-STEP_START)) exit_code=0"
      - name: Cooking Tracker focused UI tests
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          STEP_START=$(date +%s)
          set +e
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" -resultBundlePath "$RUNNER_TEMP/ate-test-results/cooking-tracker-ui-tests.xcresult" -only-testing:AteUITests/CookingTrackerEntryUITests -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 240 CODE_SIGNING_ALLOWED=NO > tracker-ui.log 2>&1
          status=$?
          set -e
          STEP_END=$(date +%s)
          echo "::notice::CI_TIMING step=cooking-tracker-ui-tests duration_seconds=$((STEP_END-STEP_START)) exit_code=$status"

          if [ "$status" -ne 0 ]; then
            echo "::error::Cooking Tracker UI tests failed (xcodebuild exit $status). Exact diagnostics follow; tracker-ui.log and xcresult are uploaded."
            grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Terminating app|Testing failed|Assertion failed" tracker-ui.log || true
            echo "::group::Last 100 Cooking Tracker UI-test log lines"
            tail -n 100 tracker-ui.log
            echo "::endgroup::"
            exit "$status"
          fi

          grep -E "Test Case .* (passed|failed)|Executed|Test Suite .* (passed|failed)" tracker-ui.log | tail -n 30
      - name: Cook Mode completion/history UI tests
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          STEP_START=$(date +%s)
          set +e
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" -resultBundlePath "$RUNNER_TEMP/ate-test-results/cook-mode-history-ui-tests.xcresult" -only-testing:AteUITests/AteUITests/test06_CookMode -only-testing:AteUITests/AteUITests/testCookModeExitDoesNotRecordCookingDay -only-testing:AteUITests/AteUITests/testCookModeCompletionRecordsCookingDay -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 240 CODE_SIGNING_ALLOWED=NO > cook-mode-history.log 2>&1
          status=$?
          set -e
          STEP_END=$(date +%s)
          echo "::notice::CI_TIMING step=cook-mode-history-ui-tests duration_seconds=$((STEP_END-STEP_START)) exit_code=$status"

          if [ "$status" -ne 0 ]; then
            echo "::error::Cook Mode completion/history UI tests failed (xcodebuild exit $status). Exact diagnostics follow; cook-mode-history.log and xcresult are uploaded."
            grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Terminating app|Testing failed|Assertion failed" cook-mode-history.log || true
            echo "::group::Last 100 Cook Mode history-test log lines"
            tail -n 100 cook-mode-history.log
            echo "::endgroup::"
            exit "$status"
          fi

          grep -E "Test Case .* (passed|failed)|Executed|Test Suite .* (passed|failed)" cook-mode-history.log | tail -n 30
      - name: Apple Health and journal acceptance UI tests
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          STEP_START=$(date +%s)
          set +e
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -resultBundlePath "$RUNNER_TEMP/ate-test-results/health-journal-acceptance.xcresult" \
            -only-testing:AteUITests/CoverageUITests/testHealthScenarioRecovery \
            -only-testing:AteUITests/CoverageUITests/testHealthScenarioLowEnergy \
            -only-testing:AteUITests/CoverageUITests/testHealthScenarioPerformance \
            -only-testing:AteUITests/CoverageUITests/testHealthScenarioUnderactive \
            -only-testing:AteUITests/CoverageUITests/testHealthSuggestionsDifferByState \
            -only-testing:AteUITests/CoverageUITests/testHealthScenarioEmpty \
            -only-testing:AteUITests/CoverageUITests/testHealthInsightsDeniedAndUnavailable \
            -only-testing:AteUITests/CoverageUITests/testHealthOpenRecipeSheetAndClose \
            -only-testing:AteUITests/CoverageUITests/testHealthPermissionPromptAppearsWhenUndecided \
            -only-testing:AteUITests/CoverageUITests/testHealthEmptyStateSampleDataAction \
            -only-testing:AteUITests/CoverageUITests/testJournalMomentContextRow \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO > health-journal-ui.log 2>&1
          status=$?
          set -e
          STEP_END=$(date +%s)
          echo "::notice::CI_TIMING step=health-journal-acceptance-ui-tests duration_seconds=$((STEP_END-STEP_START)) exit_code=$status"

          if [ "$status" -ne 0 ]; then
            echo "::error::Health/journal acceptance UI tests failed (xcodebuild exit $status). Exact diagnostics follow; health-journal-ui.log and xcresult are uploaded."
            grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Terminating app|Testing failed|Assertion failed" health-journal-ui.log || true
            echo "::group::Last 120 Health/journal UI-test log lines"
            tail -n 120 health-journal-ui.log
            echo "::endgroup::"
            exit "$status"
          fi

          grep -E "Test Case .* (passed|failed)|Executed|Test Suite .* (passed|failed)" health-journal-ui.log | tail -n 40
      - name: Widget/intents UI tests
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          STEP_START=$(date +%s)
          set +e
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" -resultBundlePath "$RUNNER_TEMP/ate-test-results/widget-intents-ui-tests.xcresult" -only-testing:AteUITests/WidgetsIntentsUITests -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 240 CODE_SIGNING_ALLOWED=NO > ui.log 2>&1
          status=$?
          set -e
          STEP_END=$(date +%s)
          echo "::notice::CI_TIMING step=widget-intents-ui-tests duration_seconds=$((STEP_END-STEP_START)) exit_code=$status"

          if [ "$status" -ne 0 ]; then
            echo "::error::Widget/intents UI tests failed or exceeded a per-test timeout (xcodebuild exit $status). Failure diagnostics follow; the complete ui.log and xcresult are uploaded as artifacts."
            grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Terminating app|Testing failed|Assertion failed" ui.log || true
            echo "::group::Last 100 UI-test log lines"
            tail -n 100 ui.log
            echo "::endgroup::"
            exit "$status"
          fi

          grep -E "Executed|Test Suite .* (passed|failed)" ui.log > ui-summary.log || true
          tail -n 30 ui-summary.log
      - name: Summarize non-blocking regression outcomes
        if: always()
        shell: bash
        run: |
          failed=0
          for log in test.log settings-sync.log production-channel-production.log tracker-ui.log cook-mode-history.log health-journal-ui.log ui.log uitest.log; do
            [ -f "$log" ] || continue
            if grep -Eq 'Testing failed|TEST FAILED|Test Case .* failed|error:|XCTAssert|Assertion Failure|Fatal error' "$log"; then
              echo "::warning::Regression diagnostics indicate a failure in $log; see retained log and xcresult artifact. This is NOT a pass."
              {
                echo "### Regression failure detected — NOT PASSED"
                echo "- Log: $log"
                echo "- Candidate SHA: $GITHUB_SHA"
                echo "- Artifacts: preproduction diagnostics for run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT"
                echo "- Action: link the failure evidence and reproduction steps to the owning issue."
                echo
              } >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          if [ "$failed" -eq 0 ]; then
            echo "No regression failure markers were found in available logs. A skipped/quarantined test is not counted as a pass." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Link regression failures to owning issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          report_failure() {
            log_file="$1"; suite="$2"; issue="$3"
            [ -f "$log_file" ] || return 0
            if ! grep -Eq 'Testing failed|TEST FAILED|Test Case .* failed|XCTAssert|Assertion Failure|Fatal error|Assertion failed' "$log_file"; then return 0; fi
            marker="<!-- ate-ci-regression:${GITHUB_RUN_ID}:${log_file} -->"
            details=$(grep -n -E 'Test Case .* failed|XCTAssert|Assertion Failure|Fatal error|Assertion failed|Testing failed|TEST FAILED' "$log_file" | tail -n 12 | cut -c1-500 || true)
            [ -n "$details" ] || details="Failure markers found; inspect the full retained log and xcresult."
            run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ "$issue" = "auto" ]; then
              existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "CI regression: $suite in:title" --json number,title --jq '.[0].number // empty')
              if [ -n "$existing" ]; then issue="$existing"; else
                created=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "CI regression: $suite" --body "Automated regression report for candidate ${GITHUB_SHA}.\n\nWorkflow run/artifacts: $run_url\nLog: $log_file\n\nFailure evidence:\n\n$details\n\nTriage: reproduce on the exact SHA, add reproduction steps, and verify a fix. This issue is generated from CI evidence and still needs owner/classification.") || { echo "::warning::Could not create backlog issue for $suite"; return 0; }
                issue="${created##*/}"
              fi
            fi
            if [ -z "$issue" ]; then echo "::warning::No issue target resolved for $suite ($log_file)."; return 0; fi
            if gh api "repos/${GITHUB_REPOSITORY}/issues/$issue/comments?per_page=100" --paginate --jq '.[].body' 2>/dev/null | grep -Fq "$marker"; then echo "Issue #$issue already has this run's regression report."; return 0; fi
            body=$(printf '%s\n' "$marker" "## CI regression detected — NOT PASSED" "- **Suite:** $suite" "- **Candidate SHA:** ${GITHUB_SHA}" "- **Workflow run and retained artifacts:** $run_url" "- **Log:** $log_file" "" "### Failure evidence (tail)" '```text' "$details" '```' "" "### Triage" "Reproduce from the exact candidate SHA, record reproduction steps, and keep this open until a fix is verified. continue-on-error allowed later suites to proceed; it does not mean this test passed.")
            if gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"; then
              echo "::warning::Regression in $suite recorded on issue #$issue (NOT PASSED)."
              echo "- **Issue:** #$issue — $suite" >> "$GITHUB_STEP_SUMMARY"
              echo "- **Evidence:** $run_url" >> "$GITHUB_STEP_SUMMARY"
            else echo "::warning::Could not comment regression evidence for $suite on issue #$issue; run: $run_url"; fi
          }
          report_failure test.log "Unit test suite" auto
          report_failure settings-sync.log "Settings/account sync (#76)" 76
          report_failure production-channel-production.log "Production channel UI" auto
          report_failure tracker-ui.log "Cooking Tracker UI (#31)" 31
          report_failure cook-mode-history.log "Cook Mode completion/history (#31)" 31
          report_failure health-journal-ui.log "Health/journal UI acceptance (#67)" 67
          report_failure ui.log "Widget/intents UI" auto
          report_failure uitest.log "Full UI shard ${{ matrix.shard }}" auto
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compile-check-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            build.log
            build-warnings.log
            test.log
            test-summary.log
            ui.log
            health-journal-ui.log
            ui-summary.log
            production-channel-production.log
            settings-sync.log
            tracker-ui.log
            cook-mode-history.log
            ${{ runner.temp }}/ate-test-results/*.xcresult

  # Four independent shard jobs; two Xcode simulator workers within each shard.
  # Focused UI acceptance steps above deliberately remain serial. See docs/CI.md.
  full-ui-suite:
    name: Full UI suite (${{ matrix.shard }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [AteUITests, CoverageUITests, AccessibilityAuditUITests, WidgetsIntentsUITests]
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: macos-26-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            macos-26-xcode-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            macos-26-xcode-deriveddata-
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-26-homebrew-xcodegen-v1
          restore-keys: |
            macos-26-homebrew-
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Run complete UI shard
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(k,x) for k,v in d.items() if "iOS-26" in k for x in v if x["name"]=="iPhone 17"]
          c=c or [(k,x) for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); print(c[-1][1]["udid"])')
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          mkdir -p build
          set +e
          xcodebuild test -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteUITests/${{ matrix.shard }} -resultBundlePath build/UITests.xcresult \
            -parallel-testing-enabled YES -parallel-testing-worker-count 2 -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > uitest.log 2>&1
          status=$?
          set -e
          grep -E "Test Case .* (passed|failed)|error:|Executed|TEST (SUCCEEDED|FAILED)" uitest.log | tail -100 || true
          if [ "$status" -ne 0 ]; then
            grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Fatal error|Testing failed|Assertion failed" uitest.log | tail -200 || true
            tail -n 100 uitest.log || true
            exit "$status"
          fi
          # A successful xcodebuild exit is insufficient if XCTest discovered no tests.
          if ! grep -Eq 'Executed [1-9][0-9]* tests?' uitest.log; then
            echo "::error::UI shard ${{ matrix.shard }} did not report executing any tests; this is NOT a pass."
            tail -n 100 uitest.log
            exit 1
          fi
      - name: Summarize UI shard outcome
        if: always()
        shell: bash
        run: |
          if grep -Eq 'Testing failed|TEST FAILED|Test Case .* failed|error:|XCTAssert|Assertion Failure|Fatal error' uitest.log; then
            echo "::warning::UI shard ${{ matrix.shard }} failed — NOT PASSED. See uploaded uitest.log and UITests.xcresult; candidate SHA: $GITHUB_SHA."
            {
              echo "### UI regression failure — NOT PASSED"
              echo "- Shard: ${{ matrix.shard }}"
              echo "- Candidate SHA: $GITHUB_SHA"
              echo "- Artifact: preproduction-ui-${{ matrix.shard }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
              echo "- Record the failing test and reproduction steps on the owning issue."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No failure markers found in this shard log. Review test totals and quarantines before treating the shard as acceptance evidence." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Link UI shard failure to backlog issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! grep -Eq 'Testing failed|TEST FAILED|Test Case .* failed|XCTAssert|Assertion Failure|Fatal error|Assertion failed' uitest.log; then exit 0; fi
          suite="Full UI shard ${{ matrix.shard }}"
          marker="<!-- ate-ci-regression:${GITHUB_RUN_ID}:uitest.log:${{ matrix.shard }} -->"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          details=$(grep -n -E 'Test Case .* failed|XCTAssert|Assertion Failure|Fatal error|Assertion failed|Testing failed|TEST FAILED' uitest.log | tail -n 12 | cut -c1-500 || true)
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "CI regression: $suite in:title" --json number,title --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            created=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "CI regression: $suite" --body "Automated UI regression report for candidate ${GITHUB_SHA}.\n\nWorkflow run/artifacts: $run_url\nShard log: uitest.log\n\nFailure evidence:\n$details\n\nTriage: reproduce on the exact SHA and record concrete reproduction steps.") || { echo "::warning::Could not create backlog issue for $suite"; exit 0; }
            existing="${created##*/}"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/issues/$existing/comments?per_page=100" --paginate --jq '.[].body' 2>/dev/null | grep -Fq "$marker"; then exit 0; fi
          body=$(printf '%s\n' "$marker" "## CI regression detected — NOT PASSED" "- **Suite/shard:** $suite" "- **Candidate SHA:** ${GITHUB_SHA}" "- **Workflow run and retained artifacts:** $run_url" "- **Artifact:** preproduction-ui-${{ matrix.shard }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "" "### Failure evidence" '```text' "$details" '```' "" "Re-run this shard against the exact SHA, record the reproduction steps, and keep this issue open until the failure is fixed and verified. continue-on-error is not a pass.")
          gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body" || echo "::warning::Could not comment shard failure on issue #$existing"
          echo "::warning::UI shard failure recorded on issue #$existing — NOT PASSED."
          echo "- **Issue:** #$existing — $suite (NOT PASSED)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Evidence:** $run_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full UI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preproduction-ui-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            uitest.log
            build/UITests.xcresult

  backend-e2e:
    name: Backend end-to-end validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-playwright-chromium-${{ hashFiles('scripts/e2e/*.py') }}
          restore-keys: |
            ubuntu-playwright-chromium-
      - name: Install Playwright
        run: pip install -q playwright && python -m playwright install --with-deps chromium
      - name: Run backend E2E against configured QA backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          BASE=$(grep -E '^\s*MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\\1/' | cut -d. -f1-2)
          set +e
          python scripts/e2e/backend_e2e.py --upload --build "$BASE preproduction-$GITHUB_SHA" 2>&1 | tee backend-e2e.log
          status=$?
          set -e
          if [ -f build/e2e/summary.md ]; then cat build/e2e/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - name: Upload backend E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preproduction-backend-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            backend-e2e.log
            build/e2e/


  release-gate:
    name: Pre-production release gate
    if: always()
    needs: [compile, full-ui-suite, backend-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate required validation outcomes
        env:
          COMPILE_RESULT: ${{ needs.compile.result }}
          FULL_UI_RESULT: ${{ needs.full-ui-suite.result }}
          BACKEND_E2E_RESULT: ${{ needs.backend-e2e.result }}
        shell: bash
        run: |
          {
            echo "## Pre-production release gate"
            echo
            echo "- Candidate SHA: $GITHUB_SHA"
            echo "- Compile and focused validation: **$COMPILE_RESULT**"
            echo "- Full UI matrix: **$FULL_UI_RESULT**"
            echo "- Backend E2E: **$BACKEND_E2E_RESULT**"
            echo
            echo "Only successful required jobs qualify. Quarantined or skipped tests are not passes."
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$COMPILE_RESULT" != "success" ] || [ "$FULL_UI_RESULT" != "success" ] || [ "$BACKEND_E2E_RESULT" != "success" ]; then
            echo "::error::Pre-production validation failed or did not complete successfully. This candidate is NOT release-qualified."
            exit 1
          fi

          echo "All required pre-production jobs completed successfully for $GITHUB_SHA."
