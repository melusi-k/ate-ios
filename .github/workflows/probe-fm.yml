name: Probe FoundationModels SDK
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-26
    steps:
      - run: |
          for X in /Applications/Xcode*.app; do
            [ -L "$X" ] && { echo "== $X -> $(readlink "$X") (symlink)"; continue; }
            V=$(DEVELOPER_DIR="$X/Contents/Developer" xcodebuild -version 2>/dev/null | tr '\n' ' ')
            F=$(find "$X/Contents/Developer/Platforms/iPhoneOS.platform" -path '*FoundationModels.swiftmodule*' -name 'arm64e-apple-ios.swiftinterface' 2>/dev/null | head -1)
            echo "== $X :: $V"
            [ -z "$F" ] && { echo "   no FoundationModels interface"; continue; }
            for P in 'Transcript\.Image|ImageSegment|struct.*Image|CGImage|Attachment' 'Profile' 'protocol LanguageModel\b' 'protocol Tool'; do
              N=$(grep -cE "$P" "$F" | tr -d ' '); echo "   [$P] $N hits"
              grep -nE "$P" "$F" | grep -v logFeedbackAttachment | head -6 | sed 's/^/      /'
            done
          done
