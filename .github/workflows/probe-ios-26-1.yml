name: Probe iOS 26.1 capsule overlay
on:
  push:
    branches: ["probe/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Runner inventory (actual, not assumed)
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          echo "--- runtimes before:"
          xcrun simctl list runtimes
          df -h /System/Volumes/Data | tail -1
      - name: Install iOS 26.1 simulator runtime
        run: |
          set -x
          time xcodebuild -downloadPlatform iOS -buildVersion 26.1 || time sudo xcodebuild -downloadPlatform iOS -buildVersion 26.1
      - name: Create and boot an iPhone on iOS 26.1
        run: |
          xcrun simctl list runtimes
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys;rs=json.load(sys.stdin)["runtimes"];m=[r for r in rs if r.get("version")=="26.1" and r.get("isAvailable")];print(m[0]["identifier"] if m else "MISSING")')
          echo "runtime=$RT"; test "$RT" != "MISSING"
          # iPhone 18 Pro requires iOS 27 (simctl create: Incompatible device); iPhone 17
          # Pro has the identical 402x874pt geometry and supports 26.1. Prefer it, then fall
          # back through same-generation models.
          DT=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys;ds=json.load(sys.stdin)["devicetypes"];avail={d["name"]:d["identifier"] for d in ds};pref=["iPhone 17 Pro","iPhone 16 Pro","iPhone 17","iPhone 16","iPhone 15"];print(next((avail[n] for n in pref if n in avail), "MISSING"))')
          echo "devicetype=$DT"; test "$DT" != "MISSING"
          UDID=$(xcrun simctl create probe-261 "$DT" "$RT")
          echo "UDID=$UDID" | tee -a "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep -i "$UDID"
      - name: Build app for testing
        run: |
          brew install xcodegen && xcodegen generate
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate -destination "id=$UDID" -resultBundlePath "${{ runner.temp }}/probe/build.xcresult" CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || { tail -60 build.log; exit 1; }
      - name: Preflight app launch on 26.1
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Ate.app" -path "*iphonesimulator*" | head -1)
          echo "app=$APP"; test -n "$APP"
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          echo "bundleid=$BID" | tee -a "$GITHUB_ENV"
          xcrun simctl install booted "$APP"
          xcrun simctl launch --console booted "$BID" > preflight-launch.log 2>&1 &
          LPID=$!
          sleep 12
          xcrun simctl terminate booted "$BID" || true
          kill $LPID 2>/dev/null || true
          xcrun simctl io booted screenshot preflight.png || true
          tail -30 preflight-launch.log || true
      - name: Focused overlay reproduction (diary+goals audit on 26.1)
        run: |
          set +e
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$UDID" -only-testing:AteUITests/AccessibilityAuditUITests/testAuditNutritionScreens -resultBundlePath "${{ runner.temp }}/probe/audit26-1.xcresult" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO > audit.log 2>&1
          echo "AUDIT_EXIT=$?" >> "$GITHUB_ENV"
          grep -E "Test Case|error:|a11y-audit" audit.log | head -40 || true
          exit 0
      - name: Collect crash diagnostics
        if: always()
        run: |
          mkdir -p "${{ runner.temp }}/probe/diagnostics"
          ls -la ~/Library/Logs/DiagnosticReports/ | tail -25 || true
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            case "$(basename "$f")" in Ate*|*Runner*) cp "$f" "${{ runner.temp }}/probe/diagnostics/" 2>/dev/null || true;; esac
          done
          xcrun simctl spawn booted log show --last 15m --predicate 'process == "AteUITests-Runner" OR process == "Ate" OR processImagePath CONTAINS "testmanagerd" OR process == "assertd"' --style compact > "${{ runner.temp }}/probe/diagnostics/device-filtered.log" 2>&1 || true
          wc -l "${{ runner.temp }}/probe/diagnostics/device-filtered.log" || true
          ls -la "${{ runner.temp }}/probe/diagnostics/"
      - name: Verdict gate
        run: |
          echo "audit exit was $AUDIT_EXIT"
          test "$AUDIT_EXIT" = "0"
      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-26-1-capsule
          path: |
            ${{ runner.temp }}/probe
            build.log
            audit.log
