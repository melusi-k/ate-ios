name: Native release notes (#74)
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'Ate/**'
      - 'AteTests/ProductUpdates*'
      - 'AteUITests/ProductUpdates*'
      - 'project.yml'
      - '.github/workflows/product-updates-ui.yml'
  workflow_dispatch:
concurrency:
  group: product-updates-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-notes:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - run: brew install xcodegen && xcodegen generate
      - name: Build exact-head native acceptance
        run: |
          set -o pipefail
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" CODE_SIGNING_ALLOWED=NO > release-notes-build.log 2>&1 || { tail -120 release-notes-build.log; exit 1; }
      - name: Run local catalog, persistence, incoming-route and paging acceptance
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteTests/ProductUpdatesTests \
            -only-testing:AteTests/ProductUpdatesLaunchTests \
            -only-testing:AteTests/ProductUpdatesIncomingRouteTests \
            -only-testing:AteUITests/ProductUpdatesLaunchUITests \
            -only-testing:AteUITests/InsightsPresentationUITests/testSettingsReleaseNotesAndReplayableTourAtNormalText \
            -resultBundlePath "$RUNNER_TEMP/release-notes.xcresult" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO > release-notes-tests.log 2>&1 || { tail -120 release-notes-tests.log; exit 1; }
          python3 scripts/verify-product-updates-results.py release-notes-tests.log
      - name: Retain native screenshots and exact results
        if: always()
        run: |
          mkdir -p release-notes-screenshots
          if [ -d "$RUNNER_TEMP/release-notes.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/release-notes.xcresult" --output-path release-notes-screenshots
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            release-notes-build.log
            release-notes-tests.log
            release-notes-screenshots
            ${{ runner.temp }}/release-notes.xcresult
