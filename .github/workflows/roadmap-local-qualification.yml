name: Local Roadmap qualification (#74)
permissions:
  contents: read
on:
  push:
    branches: [feat/74-local-roadmap-votes]
  workflow_dispatch:
concurrency:
  group: roadmap-74-${{ github.ref }}
  cancel-in-progress: true
jobs:
  roadmap:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Prepare project and exact source receipt
        run: |
          mkdir -p roadmap-evidence
          git rev-parse HEAD > roadmap-evidence/source-sha.txt
          brew install xcodegen
          xcodegen generate
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
      - name: Build native targets
        run: |
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO > roadmap-evidence/build.log 2>&1
      - name: Verify actual built catalog directory
        run: |
          xcodebuild -showBuildSettings -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO > roadmap-evidence/build-settings.txt
          python3 scripts/verify-product-catalog-bundle.py roadmap-evidence/build-settings.txt \
            > roadmap-evidence/catalog-bundle-receipt.json
      - name: Catalog, local persistence and Settings journey
        run: |
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteTests/RoadmapTests \
            -only-testing:AteTests/ProductUpdatesTests \
            -only-testing:AteUITests/RoadmapUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/roadmap74.xcresult" \
            CODE_SIGNING_ALLOWED=NO > roadmap-evidence/tests.log 2>&1
      - name: Retain screenshots and failure details
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/roadmap74.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/roadmap74.xcresult" \
              --output-path roadmap-evidence/attachments
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: roadmap-74-${{ github.sha }}
          path: |
            roadmap-evidence
            ${{ runner.temp }}/roadmap74.xcresult
