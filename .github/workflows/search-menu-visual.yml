name: Search menu visual capture only
on:
  push:
    branches: [capture/search-menu-view]
permissions:
  contents: read
concurrency:
  group: search-menu-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  search-menu-visual:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Record exact source and toolchain
        run: |
          mkdir -p build/search-visual
          git rev-parse HEAD | tee build/search-visual/head.txt
          git status --porcelain > build/search-visual/worktree.txt
          xcodebuild -version | tee build/search-visual/xcode.txt
      - run: brew install xcodegen && xcodegen generate
      - name: Capture real Search UI only, not acceptance qualification
        run: |
          set -o pipefail
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          printf '%s\n' "$SIM_ID" > build/search-visual/simulator.txt
          xcodebuild test -project Ate.xcodeproj -scheme Ate -destination "id=$SIM_ID" \
            -only-testing:AteUITests/AteUITests/testSearchMenuVisualCapture \
            -resultBundlePath build/search-visual/SearchVisual.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO > build/search-visual/ui.log 2>&1 || { tail -120 build/search-visual/ui.log; exit 1; }
          grep -F "AteUITests testSearchMenuVisualCapture]' passed" build/search-visual/ui.log
      - name: Export retained UI attachments even on failure
        if: always()
        run: |
          if [ -d build/search-visual/SearchVisual.xcresult ]; then
            xcrun xcresulttool export attachments --path build/search-visual/SearchVisual.xcresult --output-path build/search-visual/attachments
          fi
      - name: Stream bounded decoded PNG evidence without artifact storage
        if: always()
        run: |
          python3 scripts/export-search-visual-console.py build/search-visual/attachments
