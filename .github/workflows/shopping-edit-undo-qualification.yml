name: Shopping Edit/Undo Qualification (#72)

# Branch-owned qualification lane for PR #282. Runs the real Shopping edit/undo UI
# journeys on the exact branch head with a hard named-pass gate and always-uploaded
# evidence (log, xcresult, exported screenshots, run metadata). Independent of the
# shared compile-check workflow.

on:
  workflow_dispatch:
  push:
    branches: ["shopping/edit-undo-72"]

permissions:
  contents: read

concurrency:
  group: shopping-edit-undo-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shopping-edit-undo-ui:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SCHEME: Ate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: build/DerivedData
          key: xcode-27-shopping-qual-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-27-shopping-qual-deriveddata-${{ hashFiles('project.yml', '**/Package.resolved') }}-
            xcode-27-xcode-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project for exact commit
        run: |
          BASE=$(grep -E '^\s*MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          VERSION="$(echo "$BASE" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
          sed -i '' -E "s/^( *MARKETING_VERSION: ).*/\1\"$VERSION\"/; s/^( *CURRENT_PROJECT_VERSION: ).*/\1\"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate
          mkdir -p build
          xcodebuild -version
          echo "Qualification commit: $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Select iPhone 18 Pro simulator (iOS 27.0)
        id: select_simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/available-simulators.json
          xcodebuild -project Ate.xcodeproj -scheme "$SCHEME" -showdestinations > /tmp/xcode-destinations.txt 2>&1 || {
            cat /tmp/xcode-destinations.txt
            exit 1
          }
          SIM_ID=$(python3 scripts/select-ios-simulator.py)
          if ! grep -Fq "id:$SIM_ID" /tmp/xcode-destinations.txt; then
            echo "ERROR: selected iPhone 18 Pro is not listed as an Ate scheme destination."
            cat /tmp/xcode-destinations.txt
            exit 1
          fi
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b

      - name: Build for testing (iOS simulator)
        id: build
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO > build-for-testing.log 2>&1 || { grep -n -B 8 -A 12 -E "error:" build-for-testing.log || true; tail -100 build-for-testing.log; exit 1; }
          grep -E "warning:" build-for-testing.log | sort -u | tail -30 || true

      - name: Shopping edit/undo UI journeys (#72)
        id: ui_journeys
        run: |
          set -o pipefail
          SIM_ID="${{ steps.select_simulator.outputs.id }}"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          # Clean process so launch arguments are real (same rationale as other UI shards).
          xcrun simctl terminate "$SIM_ID" com.melusik.ate >/dev/null 2>&1 || true
          set +e
          xcodebuild test-without-building -project Ate.xcodeproj -scheme "$SCHEME" -destination "id=$SIM_ID" \
            -derivedDataPath build/DerivedData \
            -only-testing:AteUITests/ShoppingEditUndoUITests \
            -resultBundlePath build/ShoppingEditUndoUITests.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO > shopping-edit-undo-ui.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Shopping edit/undo UI journeys failed (xcodebuild exit $status). Exact diagnostics follow; log and xcresult are uploaded."
            grep -n -B 8 -A 15 -E "error:|failed|XCTAssert|Assertion Failure|Test Case .* failed|Fatal error|Terminating app|Testing failed|Assertion failed" shopping-edit-undo-ui.log || true
            tail -n 100 shopping-edit-undo-ui.log
            exit "$status"
          fi
          # Hard gate: a green selection that ran nothing is a failure, and every named
          # journey must appear with its own pass line in the log.
          if grep -q "Executed 0 tests" shopping-edit-undo-ui.log; then echo "::error::shopping edit/undo selection executed 0 tests"; exit 1; fi
          for evidence in \
            "ShoppingEditUndoUITests testEditSaveCancelAndInvalidQuantityJourneys]' passed" \
            "ShoppingEditUndoUITests testBatchUndoRestoresBothRemovalsInOriginalOrder]' passed" \
            "ShoppingEditUndoUITests testUndoWindowExpiryFinalizesRemoval]' passed"; do
            grep -qF "$evidence" shopping-edit-undo-ui.log || { echo "::error::missing pass evidence: $evidence"; tail -60 shopping-edit-undo-ui.log; exit 1; }
          done
          grep -E "Test Case .* (passed|failed)|Executed" shopping-edit-undo-ui.log | tail -20

      - name: Export journey screenshots
        if: always()
        run: |
          # Export whatever the run produced, success or failure: partial captures are
          # failure diagnostics and the raw xcresult is always retained alongside.
          mkdir -p build/ShoppingEditUndoUIAttachments
          if [ -d build/ShoppingEditUndoUITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ShoppingEditUndoUITests.xcresult --output-path build/ShoppingEditUndoUIAttachments
          fi
          find build/ShoppingEditUndoUIAttachments -type f | sort | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify journey screenshot evidence
        if: always() && steps.ui_journeys.outcome == 'success'
        run: |
          # Hard gate: each of the five named journey screenshots must resolve to a real
          # nonempty PNG on disk. Association: name-matched exported file first, then the
          # xcresult export manifest (humanReadableName -> fileName). Unknown manifest
          # structure, a missing file, or a zero-byte/non-PNG match all fail the run.
          set -euo pipefail
          DIR=build/ShoppingEditUndoUIAttachments
          MANIFEST="$DIR/manifest.json"
          [ -d "$DIR" ] || { echo "::error::attachment export directory missing: $DIR"; exit 1; }
          fail() {
            echo "::error::$1"
            echo "--- exported files ---"
            find "$DIR" -type f -exec ls -l {} + 2>/dev/null || true
            if [ -f "$MANIFEST" ]; then echo "--- manifest.json ---"; head -c 4000 "$MANIFEST"; echo; fi
            exit 1
          }
          png_ok() {
            [ -f "$1" ] && [ -s "$1" ] || return 1
            [ "$(od -An -tx1 -N8 "$1" | tr -d ' \n')" = "89504e470d0a1a0a" ]
          }
          resolve_shot() {
            local shot="$1" f
            f=$(find "$DIR" -type f -name "*${shot}*" | head -n 1)
            if [ -n "$f" ]; then echo "$f"; return 0; fi
            [ -f "$MANIFEST" ] || return 1
            python3 - "$MANIFEST" "$shot" "$DIR" <<'PYMAP'
          import json, os, sys
          manifest, shot, outdir = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              top = json.load(open(manifest))
          except Exception:
              sys.exit(2)
          if not isinstance(top, list):
              sys.exit(2)
          # Observed manifest shape (run 41775045591): a list of payload groups, each with an
          # "attachments" list of {exportedFileName, suggestedHumanReadableName, ...}; suggested
          # names carry an "_0_<uuid>" suffix and extension. Accept a flat list too; anything
          # else fails closed.
          atts = []
          for e in top:
              if not isinstance(e, dict):
                  continue
              inner = e.get("attachments")
              atts.extend(inner) if isinstance(inner, list) else atts.append(e)
          for a in atts:
              if not isinstance(a, dict):
                  continue
              name = a.get("suggestedHumanReadableName") or a.get("humanReadableName") or ""
              fname = a.get("exportedFileName") or a.get("fileName") or a.get("attachedFileName") or ""
              base = name[:-4] if name.lower().endswith(".png") else name
              if (base == shot or base.startswith(shot + "_0_")) and fname:
                  print(os.path.join(outdir, fname))
                  sys.exit(0)
          sys.exit(1)
          PYMAP
          }
          for shot in \
            edit-save-row-renamed \
            edit-invalid-quantity-save-disabled \
            batch-undo-toast-two-items \
            batch-undo-restored-order \
            undo-expired-removal-final; do
            set +e
            file=$(resolve_shot "$shot")
            rc=$?
            set -e
            case $rc in
              0) ;;
              1) fail "missing screenshot evidence: $shot" ;;
              *) fail "unrecognised export manifest structure; cannot associate screenshot: $shot" ;;
            esac
            png_ok "$file" || fail "screenshot for $shot is not a nonempty PNG: $file"
            echo "verified $shot -> $file ($(stat -f%z "$file") bytes)"
          done

      - name: Record qualification metadata
        if: always()
        run: |
          {
            echo "head_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "simulator_id=${{ steps.select_simulator.outputs.id }}"
            echo "build_outcome=${{ steps.build.outcome }}"
            echo "ui_journeys_outcome=${{ steps.ui_journeys.outcome }}"
            echo "collected_at=$(date -u +%FT%TZ)"
          } | tee qualification-metadata.txt
          mkdir -p build/ShoppingEditUndoUIAttachments

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shopping-edit-undo-qualification-${{ github.run_number }}
          path: |
            qualification-metadata.txt
            build-for-testing.log
            shopping-edit-undo-ui.log
            build/ShoppingEditUndoUITests.xcresult
            build/ShoppingEditUndoUIAttachments
          if-no-files-found: warn
