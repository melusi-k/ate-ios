name: Simulator concurrency experiment

on:
  push:
    branches:
      - experiment/simulator-concurrency-coverage

permissions:
  contents: read

concurrency:
  group: simulator-concurrency-experiment
  cancel-in-progress: false

jobs:
  coverage-concurrency:
    name: CoverageUITests — serial vs 2 workers
    runs-on: macos-26
    timeout-minutes: 360
    env:
      CANDIDATE_SHA: f2969dd5133e9c0bce679b40d74dcd7615432ba0
      DERIVED_DATA: ${{ runner.temp }}/ate-concurrency-derived-data
      RESULTS_DIR: ${{ runner.temp }}/ate-concurrency-results
    steps:
      - name: Checkout fixed candidate
        uses: actions/checkout@v7
        with:
          ref: f2969dd5133e9c0bce679b40d74dcd7615432ba0
          fetch-depth: 1

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ate-concurrency-derived-data
          key: simulator-concurrency-${{ env.CANDIDATE_SHA }}-${{ runner.os }}
          restore-keys: |
            simulator-concurrency-${{ env.CANDIDATE_SHA }}-

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Build CoverageUITests once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR"
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          candidates=[(runtime,device) for runtime,devices in d.items() if "iOS-26" in runtime for device in devices if device["name"]=="iPhone 17"]
          if not candidates:
              candidates=[(runtime,device) for runtime,devices in d.items() if "iOS" in runtime for device in devices if device["name"]=="iPhone 17"]
          candidates.sort(key=lambda item:item[0])
          if not candidates: raise SystemExit("No iPhone 17 iOS Simulator is installed")
          print(candidates[-1][1]["udid"])')
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          echo "Candidate SHA: $CANDIDATE_SHA"
          echo "Simulator UDID: $SIM_ID"
          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
          xcodebuild build-for-testing -project Ate.xcodeproj -scheme Ate \
            -destination "id=$SIM_ID" -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO > "$RESULTS_DIR/build-for-testing.log" 2>&1 || {
              tail -160 "$RESULTS_DIR/build-for-testing.log"
              exit 1
            }
          grep -E "BUILD SUCCEEDED|warning:" "$RESULTS_DIR/build-for-testing.log" | tail -40

      - name: Run three interleaved serial and parallel trials
        shell: bash
        run: |
          set -uo pipefail
          SUMMARY="$RESULTS_DIR/summary.csv"
          RESOURCE_LOG="$RESULTS_DIR/resource-samples.log"
          echo "mode,repeat,elapsed_seconds,exit_code,test_cases_passed,test_cases_failed" > "$SUMMARY"

          (
            while true; do
              echo "===== $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
              memory_pressure 2>&1 | grep -E "System-wide memory free percentage|Pages wired down|Pages occupied by compressor" || true
              vm_stat | awk 'NR==2 {print "vm_stat: "$0}'
              sleep 30
            done
          ) > "$RESOURCE_LOG" 2>&1 &
          MONITOR_PID=$!
          trap 'kill "$MONITOR_PID" 2>/dev/null || true' EXIT

          failures=0
          run_trial() {
            mode="$1"
            repeat="$2"
            log="$RESULTS_DIR/$mode-$repeat.log"
            result="$RESULTS_DIR/$mode-$repeat.xcresult"
            if [ "$mode" = "serial" ]; then
              parallel_args=(-parallel-testing-enabled NO)
            else
              parallel_args=(-parallel-testing-enabled YES -parallel-testing-worker-count 2)
            fi

            echo "::group::Trial $mode #$repeat"
            xcrun simctl shutdown "$SIM_ID" >/dev/null 2>&1 || true
            xcrun simctl erase "$SIM_ID" >/dev/null 2>&1 || true
            start=$(python3 -c 'import time; print(time.monotonic_ns())')
            xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate \
              -destination "id=$SIM_ID" -derivedDataPath "$DERIVED_DATA" \
              -only-testing:AteUITests/CoverageUITests \
              -resultBundlePath "$result" \
              "${parallel_args[@]}" -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 240 \
              -maximum-test-execution-time-allowance 480 \
              CODE_SIGNING_ALLOWED=NO > "$log" 2>&1
            status=$?
            end=$(python3 -c 'import time; print(time.monotonic_ns())')
            elapsed=$(( (end - start) / 1000000000 ))
            passed=$(grep -Ec 'Test Case .* passed' "$log" || true)
            failed=$(grep -Ec 'Test Case .* failed' "$log" || true)
            echo "$mode,$repeat,$elapsed,$status,$passed,$failed" >> "$SUMMARY"
            echo "mode=$mode repeat=$repeat elapsed_seconds=$elapsed exit_code=$status passed=$passed failed=$failed"
            grep -E "Test Case .* (passed|failed)|Executed|TEST SUCCEEDED|TEST FAILED|error:" "$log" | tail -60 || true
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
            return 0
          }

          run_trial serial 1
          run_trial parallel 1
          run_trial serial 2
          run_trial parallel 2
          run_trial serial 3
          run_trial parallel 3

          echo "## Simulator concurrency experiment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate SHA: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Suite: AteUITests/CoverageUITests (34 test methods)" >> "$GITHUB_STEP_SUMMARY"
          echo "- One build-for-testing; six interleaved test-without-building trials on one macOS runner." >> "$GITHUB_STEP_SUMMARY"
          echo "- Parallel mode: two Xcode test workers. No production CI workflow or required gate is changed." >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures of 6 trials failed; keep all failure diagnostics and do not adopt parallel execution."
            exit 1
          fi

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-concurrency-${{ github.run_id }}
          path: ${{ runner.temp }}/ate-concurrency-results
          if-no-files-found: error
          retention-days: 30
