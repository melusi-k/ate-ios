name: Ate
options:
  bundleIdPrefix: com.melusik
  # Beta testing checklist is generated from docs/MVP_CHECKLIST.md on every `xcodegen generate` (CI included).
  preGenCommand: python3 scripts/gen-beta-checklist.py
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # ── PUBLIC CONFIG (ships in the app; NOT secrets) ─────────────────────────────
    # Real secrets (service-role key, signing certs, AI keys) live ONLY in GitHub secrets / Supabase.
    # Mode: ondevice (default, mock fallback) | mock | supabase
    ATE_BACKEND_MODE: ondevice
    # Melusi's Supabase project "ate" (ploncuhexmwydjxljuhe). The publishable key is RLS-protected and safe to ship.
    ATE_SUPABASE_URL: "https://ploncuhexmwydjxljuhe.supabase.co"
    ATE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_iiLYpvTdIEhYk2FsvJlzTQ_3T4w77mv"
    # Share links. Template with {slug}; the ?s= form returns 200 on GitHub Pages (the /r/<slug> path form 404s before its JS redirect).
    # Switch to https://ate.app/r/{slug} once the domain and AASA are live. Old lovable.app/r/<slug> links are still parsed.
    ATE_SHARE_HOST: "https://melusi-k.github.io/ate-legal"
    ATE_SHARE_URL_TEMPLATE: "https://melusi-k.github.io/ate-legal/r/?s={slug}"
    # ── END PUBLIC CONFIG ────────────────────────────────────────────────────────
    # Signing team from env/secret TEAM_ID at `xcodegen generate` time (empty = unsigned / free-ID sideload).
    DEVELOPMENT_TEAM: "${TEAM_ID}"
    # Overwritten by CI with the short commit sha (see build-ipa.yml).
    ATE_GIT_SHA: "dev"
    # Empty by default: beta-only UI is fail-closed unless CI explicitly sets a recognized beta channel.
    ATE_CHANNEL: ""
    # Legal pages: source docs/legal/*.md → scripts/build-legal.py → public repo melusi-k/ate-legal (GitHub Pages).
    ATE_PRIVACY_URL: "https://melusi-k.github.io/ate-legal/privacy.html"
    ATE_TERMS_URL: "https://melusi-k.github.io/ate-legal/terms.html"
targets:
  Ate:
    type: application
    platform: iOS
    sources:
      - path: Ate
      - path: Shared
      - path: SharedWidgets
    dependencies:
      - target: AteWidgets
      - target: AteShare
      # Independent watch app, embedded at Ate.app/Watch/AteWatch.app so it can be installed alongside the phone app.
      - target: AteWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate
        CODE_SIGN_STYLE: "${ATE_SIGN_STYLE}"
        PROVISIONING_PROFILE_SPECIFIER: "${ATE_PROFILE_APP}"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Ate/Info.plist
        # App Group only by default; CI switches to Ate-Signed.entitlements (adds associated domains) when TEAM_ID is set.
        ATE_ENTITLEMENTS: Ate/Ate.entitlements
        CODE_SIGN_ENTITLEMENTS: $(ATE_ENTITLEMENTS)
    info:
      path: Ate/Info.plist
      properties:
        CFBundleDisplayName: ate
        INAlternativeAppNames:
          - INAlternativeAppName: Ate
          - INAlternativeAppName: Ate app
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIImageName: AteLogo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIAppFonts: [Fraunces.ttf, DMSans.ttf]
        NSSupportsLiveActivities: true
        NSPhotoLibraryUsageDescription: ate reads the recipe screenshot you pick to turn it into a recipe card.
        NSSpeechRecognitionUsageDescription: ate listens on your iPhone for “next”, “back”, “start timer” and “repeat” while you cook. Audio never leaves your device.
        NSMicrophoneUsageDescription: ate uses the microphone for hands-free cook mode commands.
        NSCameraUsageDescription: ate uses the camera to snap a recipe.
        NSHealthShareUsageDescription: ate reads your sleep, steps, active energy and workouts (read-only, on this iPhone) to suggest meals that fit your day. Health data never leaves your device.
        ITSAppUsesNonExemptEncryption: false
        AteBackendMode: $(ATE_BACKEND_MODE)
        AteSupabaseURL: $(ATE_SUPABASE_URL)
        AteSupabasePublishableKey: $(ATE_SUPABASE_PUBLISHABLE_KEY)
        AteShareHost: $(ATE_SHARE_HOST)
        AteShareURLTemplate: $(ATE_SHARE_URL_TEMPLATE)
        AtePrivacyURL: $(ATE_PRIVACY_URL)
        AteGitSHA: $(ATE_GIT_SHA)
        AteChannel: $(ATE_CHANNEL)
        AteTermsURL: $(ATE_TERMS_URL)
        CFBundleURLTypes:
          - CFBundleURLName: com.melusik.ate
            CFBundleURLSchemes: [ate]
  AteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AteWidgets
      - path: Shared
      - path: SharedWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.widgets
        CODE_SIGN_STYLE: "${ATE_SIGN_STYLE}"
        PROVISIONING_PROFILE_SPECIFIER: "${ATE_PROFILE_WIDGETS}"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AteWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: AteWidgets/AteWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: AteWidgets/Info.plist
      properties:
        CFBundleDisplayName: ate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AteShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AteShare
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.share
        CODE_SIGN_STYLE: "${ATE_SIGN_STYLE}"
        PROVISIONING_PROFILE_SPECIFIER: "${ATE_PROFILE_SHARE}"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AteShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: AteShare/AteShare.entitlements
        SKIP_INSTALL: YES
    info:
      path: AteShare/Info.plist
      properties:
        CFBundleDisplayName: Save to ate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
  AteWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: AteWatch
      - path: Shared/Watch
    dependencies:
      - target: AteWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.watchkitapp
        CODE_SIGN_STYLE: "${ATE_SIGN_STYLE}"
        PROVISIONING_PROFILE_SPECIFIER: "${ATE_PROFILE_WATCH}"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AteWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: AteWatch/AteWatch.entitlements
        SKIP_INSTALL: YES
    info:
      path: AteWatch/Info.plist
      properties:
        CFBundleDisplayName: ate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.melusik.ate
        WKBackgroundModes: [self-care]
        AteSupabaseURL: $(ATE_SUPABASE_URL)
        AteSupabasePublishableKey: $(ATE_SUPABASE_PUBLISHABLE_KEY)
  AteWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: AteWatchWidgets
      - path: Shared/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.watchkitapp.widgets
        CODE_SIGN_STYLE: "${ATE_SIGN_STYLE}"
        PROVISIONING_PROFILE_SPECIFIER: "${ATE_PROFILE_WATCHWIDGETS}"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AteWatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: AteWatchWidgets/AteWatchWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: AteWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: ate timer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AteClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: AteClip
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: AteClip/AteClip.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.Clip
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: AteClip/Info.plist
      properties:
        CFBundleDisplayName: ate recipe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AteSupabaseURL: $(ATE_SUPABASE_URL)
        AteSupabasePublishableKey: $(ATE_SUPABASE_PUBLISHABLE_KEY)
  AteClipTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AteClipTests]
    dependencies:
      - target: AteClip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.clip.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AteClip.app/AteClip
        BUNDLE_LOADER: $(TEST_HOST)
  AteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AteTests]
    dependencies:
      - target: Ate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ate.app/Ate
        BUNDLE_LOADER: $(TEST_HOST)
  AteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AteUITests]
    dependencies:
      - target: Ate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.uitests
        TEST_TARGET_NAME: Ate
schemes:
  Ate:
    build:
      targets:
        Ate: all
        AteTests: [test]
        AteUITests: [test]
    test:
      targets: [AteTests, AteUITests]
  AteClip:
    build:
      targets:
        AteClip: all
        AteClipTests: [test]
    test:
      targets: [AteClipTests]
  AteWatch:
    build:
      targets:
        AteWatch: all
        AteWatchWidgets: all
