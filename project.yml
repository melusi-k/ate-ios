name: Ate
options:
  bundleIdPrefix: com.melusik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Backend config (non-secret). Mode: ondevice (default, mock fallback) | mock | supabase
    ATE_BACKEND_MODE: ondevice
    ATE_SUPABASE_URL: ""
    ATE_SUPABASE_PUBLISHABLE_KEY: ""
    ATE_SHARE_HOST: "https://recipe-transform-ai.lovable.app"
targets:
  Ate:
    type: application
    platform: iOS
    sources:
      - path: Ate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Ate/Info.plist
    info:
      path: Ate/Info.plist
      properties:
        CFBundleDisplayName: ate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [Fraunces.ttf, DMSans.ttf]
        NSPhotoLibraryUsageDescription: ate reads the recipe screenshot you pick to turn it into a recipe card.
        NSCameraUsageDescription: ate uses the camera to snap a recipe.
        ITSAppUsesNonExemptEncryption: false
        AteBackendMode: $(ATE_BACKEND_MODE)
        AteSupabaseURL: $(ATE_SUPABASE_URL)
        AteSupabasePublishableKey: $(ATE_SUPABASE_PUBLISHABLE_KEY)
        AteShareHost: $(ATE_SHARE_HOST)
        CFBundleURLTypes:
          - CFBundleURLName: com.melusik.ate
            CFBundleURLSchemes: [ate]
  AteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AteTests]
    dependencies:
      - target: Ate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ate.app/Ate
        BUNDLE_LOADER: $(TEST_HOST)
  AteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AteUITests]
    dependencies:
      - target: Ate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.uitests
        TEST_TARGET_NAME: Ate
schemes:
  Ate:
    build:
      targets:
        Ate: all
        AteTests: [test]
        AteUITests: [test]
    test:
      targets: [AteTests, AteUITests]
