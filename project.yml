name: Ate
options:
  bundleIdPrefix: com.melusik
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Backend config (non-secret). Mode: ondevice (default, mock fallback) | mock | supabase
    ATE_BACKEND_MODE: ondevice
    # Public values for Melusi's own Supabase project "ate" (ploncuhexmwydjxljuhe). The publishable key is safe to ship (RLS-protected).
    ATE_SUPABASE_URL: "https://ploncuhexmwydjxljuhe.supabase.co"
    ATE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_iiLYpvTdIEhYk2FsvJlzTQ_3T4w77mv"
    # Single source of truth for share links (<host>/r/<slug>). Switch to https://ate.app once the domain + AASA are live.
    # Signing team from env/secret TEAM_ID at `xcodegen generate` time (empty = unsigned / free-ID sideload).
    DEVELOPMENT_TEAM: "${TEAM_ID}"
    ATE_SHARE_HOST: "https://recipe-transform-ai.lovable.app"
    # Overwritten by CI with the short commit sha (see build-ipa.yml).
    ATE_GIT_SHA: "dev"
    # Legal pages: source docs/legal/*.md → scripts/build-legal.py → public repo melusi-k/ate-legal (GitHub Pages).
    ATE_PRIVACY_URL: "https://melusi-k.github.io/ate-legal/privacy.html"
    ATE_TERMS_URL: "https://melusi-k.github.io/ate-legal/terms.html"
targets:
  Ate:
    type: application
    platform: iOS
    sources:
      - path: Ate
      - path: Shared
    dependencies:
      - target: AteWidgets
      - target: AteShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate
        CODE_SIGN_STYLE: "${ATE_SIGN_STYLE}"
        PROVISIONING_PROFILE_SPECIFIER: "${ATE_PROFILE_APP}"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Ate/Info.plist
        # App Group only by default; CI switches to Ate-Signed.entitlements (adds associated domains) when TEAM_ID is set.
        ATE_ENTITLEMENTS: Ate/Ate.entitlements
        CODE_SIGN_ENTITLEMENTS: $(ATE_ENTITLEMENTS)
    info:
      path: Ate/Info.plist
      properties:
        CFBundleDisplayName: ate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIImageName: AteLogo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [Fraunces.ttf, DMSans.ttf]
        NSSupportsLiveActivities: true
        NSPhotoLibraryUsageDescription: ate reads the recipe screenshot you pick to turn it into a recipe card.
        NSSpeechRecognitionUsageDescription: ate listens on your iPhone for “next”, “back”, “start timer” and “repeat” while you cook. Audio never leaves your device.
        NSMicrophoneUsageDescription: ate uses the microphone for hands-free cook mode commands.
        NSCameraUsageDescription: ate uses the camera to snap a recipe.
        ITSAppUsesNonExemptEncryption: false
        AteBackendMode: $(ATE_BACKEND_MODE)
        AteSupabaseURL: $(ATE_SUPABASE_URL)
        AteSupabasePublishableKey: $(ATE_SUPABASE_PUBLISHABLE_KEY)
        AteShareHost: $(ATE_SHARE_HOST)
        AtePrivacyURL: $(ATE_PRIVACY_URL)
        AteGitSHA: $(ATE_GIT_SHA)
        AteTermsURL: $(ATE_TERMS_URL)
        CFBundleURLTypes:
          - CFBundleURLName: com.melusik.ate
            CFBundleURLSchemes: [ate]
  AteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AteWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.widgets
        CODE_SIGN_STYLE: "${ATE_SIGN_STYLE}"
        PROVISIONING_PROFILE_SPECIFIER: "${ATE_PROFILE_WIDGETS}"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AteWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: AteWidgets/AteWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: AteWidgets/Info.plist
      properties:
        CFBundleDisplayName: ate timers
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AteShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AteShare
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.share
        CODE_SIGN_STYLE: "${ATE_SIGN_STYLE}"
        PROVISIONING_PROFILE_SPECIFIER: "${ATE_PROFILE_SHARE}"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AteShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: AteShare/AteShare.entitlements
        SKIP_INSTALL: YES
    info:
      path: AteShare/Info.plist
      properties:
        CFBundleDisplayName: Save to ate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
  AteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AteTests]
    dependencies:
      - target: Ate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ate.app/Ate
        BUNDLE_LOADER: $(TEST_HOST)
  AteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AteUITests]
    dependencies:
      - target: Ate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.melusik.ate.uitests
        TEST_TARGET_NAME: Ate
schemes:
  Ate:
    build:
      targets:
        Ate: all
        AteTests: [test]
        AteUITests: [test]
    test:
      targets: [AteTests, AteUITests]
